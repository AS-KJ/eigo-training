タルかの選択を教委任せにして、学力格差が生じないか心配だ。", "en": "This marks a major transition in learning. The government has long safeguarded an environment where all students in compulsory education receive a certain standard of education uniformly across the country. It is concerning that leaving the choice between paper and digital up to boards of education might lead to disparities in academic achievement.\\""}, {"ja": "文部科学省は10日、デジタル教科書の発行や選定、使い方を議論する有識者会議を開いた。今秋をめどに指針を策定するという。", "en": "The Education, Culture, Sports, Science and Technology Ministry on Friday held a meeting of experts to discuss the publication, selection and use of digital textbooks. It is said to be aiming to formulate guidelines by this autumn.\\""}, {"ja": "これに対して、文化人らで作る「活字の学びを考える懇談会」（浅田次郎会長）は、デジタル化を危惧する提言を発表している。", "en": "In response, a group of cultural figures and others who discuss learning with printed materials, chaired by Jiro Asada, has released a proposal voicing concerns about digitization.\\""}, {"ja": "言語脳科学が専門の酒井邦嘉・東京大教授は「言葉の力と考える力が衰え、すべての教科で学力低下が懸念される」と訴える。", "en": "University of Tokyo Prof. Kuniyoshi Sakai, who specializes in language neuroscience, gave a warning, saying, \\"It is feared that linguistic skills and the ability to think will weaken, leading to a deterioration in academic performance across all subjects.\\"\\""}, {"ja": "歌人の俵万智さんは「紙の教科書が不便だと思ったことは一度もない。デジタルに使うお金があるなら、先生方の給料を上げたほうがいい」と提案している。", "en": "Poet Machi Tawara said: \\"I have never once found paper textbooks inconvenient. If there\'s a budget for going digital, it would be better to use it to raise teachers\' salaries.\\"\\""}, {"ja": "指針作りを進める文科省は、真摯（しんし）に耳を傾けるべきだ。「利用ありき」ではなく、負の側面も考慮した慎重な議論が必要だ。", "en": "The ministry, which is proceeding with formulating the guidelines, should sincerely listen to these concerns. Rather than holding discussions on the premise that digital materials will be used, a cautious debate is necessary that also considers the negative aspects.\\""}, {"ja": "デジタルには動画や音声を活用できる利点があるが、深い思考や記憶の定着には紙の方が優位だとされる。このため海外では、紙に回帰する動きが始まっている。教科や学年を問わず、むやみに多用することは避けなければならない。", "en": "While digital formats have the advantage of incorporating videos and audio materials, paper textbooks are considered more effective for fostering deep thinking and memory retention. As a result, there is a movement overseas to return to paper. Regardless of subject or grade level, digital textbooks should not be used extensively without careful consideration.\\""}, {"ja": "特に、デジタルの使用を開始する学年には留意する必要がある。小学校低学年については、認知処理能力の未熟さが指摘されている。情報量の多い端末を見て、操作するのは負担が大きい。使うのは紙の教科書だけにすべきだ。", "en": "Particular attention must be paid to the grade level at which students begin using digital materials. It has been pointed out that pupils in the lower grades of elementary school have immature cognitive processing abilities. Viewing and operating devices with large amounts of information places a significant burden on them. They should be limited to using only paper textbooks.\\""}, {"ja": "子供たちはすでに、学校以外でも「デジタル漬け」になっている。海外では、心身に悪影響があるとして、未成年者のSNS利用を規制する国が相次いでいる。", "en": "Children are already immersed in digital media outside of school. Regulations are being introduced in one country after another to restrict minors\' use of social media due to concerns about adverse effects on their physical and mental health.\\""}, {"ja": "政府はデジタル化の遅れを挽回したいのだろうが、デジタル化が急務なのは行政システムやビジネスの現場であろう。子供たちの授業だとは到底思えない。", "en": "While the government likely wishes to make up for its delay in digitization, the settings in which digitization is urgently needed are administrative systems and workplaces. But certainly not children\'s classrooms.\\""}]}, {"id": "default-16", "topic": "U.S.-Iran talks", "title": "停戦崩さず外交努力を尽くせ", "source": "読売新聞 2026年4月14日", "isDefault": true, "pairs": [{"ja": "戦闘終結に向けた米国とイランの協議が、成果なく終わったのは残念でならない。原油輸送の要衝であるホルムズ海峡の封鎖の解除に向けた展望も開けなかった。", "en": "It is deeply regrettable that the U.S.-Iran talks, which were aimed at ending the fighting, have ended without any results. No prospects have emerged for lifting the blockade of the Strait of Hormuz, a strategic point for transporting crude oil.\\""}, {"ja": "このままでは、残り約1週間の停戦が崩れかねない。米国とイランは互いに攻撃を控え、戦闘の完全な終結に向けた外交努力を尽くす必要がある。", "en": "If the situation continues, the ceasefire — which is set to remain in place for one more week — could collapse. The United States and Iran must refrain from attacking each other and exhaust all diplomatic efforts in order to completely end the fighting.\\""}, {"ja": "米、イランの協議は仲介国パキスタンの首都イスラマバードで開かれ、米国のバンス副大統領、イランのガリバフ国会議長らが出席した。両国が1979年のイラン革命で国交を断絶して以来、最高位の対面での接触となった。", "en": "The U.S.-Iran talks were held in Islamabad, the capital of Pakistan, which served as the mediator, and attended by U.S. Vice President JD Vance and Iranian Parliament Speaker Mohammad Bagher Ghalibaf, among others. This marked the highest-level in-person interaction between the two countries since they severed diplomatic relations following the 1979 Iranian Revolution.\\""}, {"ja": "だが、焦点だったホルムズ海峡における航行の安全確保や、イランの核開発を巡り、双方の立場の隔たりは埋まらなかった。", "en": "However, the two sides could not bridge their differences on key issues such as ensuring safe navigation in the Strait of Hormuz and Iran\'s nuclear development.\\""}, {"ja": "トランプ米大統領は協議後、イランが交渉に戻ってくるとの見方を示した。ガリバフ氏は「理屈には理屈で対処する」と表明した。協議継続か決裂かの岐路にあるが、両国とも話し合いによる事態打開の方針を堅持すべきだ。", "en": "Following the talks, U.S. President Donald Trump expressed the view that Iran would return to the negotiating table. Ghalibaf said, \\"If you come forward with logic, we will deal with logic.\\" While the negotiations are at a crossroads between continuing and breaking down, both countries should stick to the policy of resolving the situation through dialogue.\\""}, {"ja": "ホルムズ海峡を巡っては、イランが一方的に管理すると主張し、通過するタンカーなどから通航料を徴収し始めている。", "en": "Regarding the Strait of Hormuz, Iran unilaterally claims control and has begun collecting tolls from tankers and other vessels passing through.\\""}, {"ja": "これに対トランプ氏は、ホルムズ海峡を封鎖するとSNSで宣言し、イランに対抗して米国が海峡の管理に乗り出す考えを示した。イランの港を出入りする船舶の航行を一切認めないという。", "en": "In response, Trump declared on social media that the United States will blockade the strait, indicating that the United States intends to take control of the waterway to counter Iran. Trump said he would not allow any ships going through the strait to enter or exit Iranian ports.\\""}, {"ja": "ホルムズ海峡は、どの国の船舶にも自由な航行が認められている国際海峡だ。通航料を取ったり、管理したりする権限はイランにも米国にもない。", "en": "The Strait of Hormuz is an international waterway where vessels from any country are entitled to free passage. Neither Iran nor the United States has the authority to collect tolls or exercise control over it.\\""}, {"ja": "封鎖のため米軍が艦艇を派遣し、米国とイランの海軍が交戦する事態となった場合、戦闘の長期化が避けられなくなる。", "en": "If the U.S. military dispatches warships to enforce a blockade, leading to a clash between the U.S. and Iranian navies, a prolonged fight would be inevitable.\\""}, {"ja": "これ以上、原油や液化天然ガス（LNG）などエネルギーの調達が滞れば、世界経済はかつてないほどの大混乱に陥りかねない。", "en": "If the supply of crude oil, liquefied natural gas and other such energy resources is further disrupted, the global economy could plunge into unprecedented turmoil.\\""}, {"ja": "強く懸念されるのが、米国とともにイランを攻撃したイスラエルの動向である。", "en": "A cause for major concern is the actions of Israel, which attacked Iran alongside the United States.\\""}, {"ja": "ネタニヤフ政権は、親イラン勢力ヒズボラの基盤であるレバノン南部に加え、首都ベイルートもミサイルなどで激しく攻撃している。米国とイランが2週間の停戦に合意した後でも、300人以上を殺害したとされる。", "en": "The administration of Israeli Prime Minister Benjamin Netanyahu has been using missiles to intensely attack the Lebanese capital of Beirut in addition to southern Lebanon, where the pro-Iranian group Hezbollah is based. More than 300 people have reportedly been killed even after the United States and Iran agreed to a two-week ceasefire.\\""}, {"ja": "米国とイランが停戦しても、イスラエルがレバノンへの攻撃を続けたら、中東の戦火はやまない。トランプ氏はネタニヤフ首相の暴走に歯止めをかけるべきだ。", "en": "Even if the United States and Iran stopped fighting, the war in the Middle East will not end if Israel continues its attacks on Lebanon. Trump must put a stop to Netanyahu\'s reckless actions.\\""}]}, {"id": "default-17", "topic": "Guidelines for life-sustaining treatment", "title": "患者の意思を尊重するために", "source": "読売新聞 2026年4月30日", "isDefault": true, "pairs": [{"ja": "延命治療を望むのか、また、それを行う場合いつまで続けるか。誰にとっても重大な選択だ。", "en": "Whether to seek life-sustaining treatment, and when receiving it, how long to continue it — these are critical decisions for everyone.\\""}, {"ja": "高齢化が進んだ今、一人ひとりが最期にどのような治療を受けたいかを日頃から考え、周囲と意思を共有することが必要になっている。", "en": "As the population ages, it has now become necessary for each individual to routinely consider what kind of treatment they wish to receive at the end of their life and to share their wishes with those around them.\\""}, {"ja": "日本集中治療医学会など4学会が、延命治療に関する指針を近く改定する。", "en": "Four medical societies, including the Japanese Society of Intensive Care Medicine, are set to revise their guidelines on life-sustaining treatment in the near future.\\""}, {"ja": "延命治療を終えるかどうかを判断する場合の手順を、丁寧に示すものだ。", "en": "The revision is intended to provide detailed procedures for determining whether to discontinue life-sustaining treatment.\\""}, {"ja": "延命治療の中止を巡っては、医師が殺人容疑で警察の捜査を受けるケースが相次いだ。", "en": "In the past, there were a number of cases in which doctors were investigated by the police on suspicion of murder in connection with the discontinuation of life-sustaining treatment.\\""}, {"ja": "こうした事態を背景として、現行の指針は2014年に医療現場が判断しやすいように定められた。", "en": "Against this background, the current guidelines were established in 2014 to make it easier for medical professionals to make such decisions.\\""}, {"ja": "この指針は、人生の最終段階にある「終末期」の患者を対象に位置づけ、目安として「診断後1〜3日以内の死亡が予測される場合」と例示している。", "en": "These guidelines classified patients in the \\"terminal phase\\" of life as candidates for the discontinuation of life-sustaining treatment, citing as examples cases in which death is predicted to occur within two to three days.\\""}, {"ja": "だがその後、医療が進歩し、重篤な患者も人工呼吸器などを使って生命を維持できるようになった。このため、現行の指針は実際に合わなくなった。", "en": "However, medical advances since then have made it possible to sustain the lives of critically ill patients using medication and devices such as ventilators. Consequently, the current guidelines no longer reflect the reality.\\""}, {"ja": "改定案では、延命治療を始める際に患者側と医療関係者が話し合って期限を決める方法も提示した。", "en": "The draft revision also proposes as a new option a method in which the patient\'s side and medical professionals discuss and decide the timing to discontinue life-sustaining treatment when initiating it.\\""}, {"ja": "治療中に回復の見通しが立てば継続し、そうでなければ打ち切りを検討するという考え方だ。", "en": "The idea is that treatment would continue if there is a prospect of recovery during the course of treatment, and if not, ending it would be considered.\\""}, {"ja": "結論を急がずに患者や家族が気持ちを整理し、容体を見極めた上で判断する試みと言えるだろう。", "en": "This can be seen as an attempt to allow patients and their families to come to terms with their feelings and make a decision after carefully assessing the patient\'s condition, without rushing to a conclusion.\\""}, {"ja": "医師は患者の尊厳を守り、家族に丁寧に説明してもらいたい。", "en": "It is hoped that doctors will uphold the patient\'s dignity and provide thorough explanations to their family.\\""}, {"ja": "今回の改定に対し、日常的に人工呼吸器などを使っている難病患者の中には、自分が望まない形で、家族や医師の判断で治療を中止されてしまうのではないか、と心配する人もいる。", "en": "In response to this revision, some people, mainly patients with intractable diseases who rely on ventilators and other medical devices on a daily basis, are worried that, even if they wish to continue living, treatment might be discontinued based on the decisions of others including their families or doctors.\\""}, {"ja": "医療現場では、延命治療を一度始めると、治療を続けざるを得なくなるケースが多い。中止すれば命が失われてしまうためだ。", "en": "In medical settings, once life-sustaining treatment begins, there is often no option but to continue treatment. This is because discontinuing treatment would result in the loss of life.\\""}, {"ja": "本人が求めていないのに、苦痛を伴う延命治療が続いてしまうとしたら望ましいことではない。", "en": "It is undesirable for life-sustaining treatment that causes suffering to continue when the patient does not want it.\\""}, {"ja": "改定案は、延命治療を終えるかどうかを判断する際には、患者の意思を尊重することを原則に掲げる。", "en": "According to the draft revision, respecting a patient\'s wishes is the first principle when ending life-sustaining treatment.\\""}, {"ja": "本人に意識がなく、意思を確認できない時は、医師と家族が協議を重ね、患者にとって最善策をとるよう求めるという。", "en": "If the patient is unconscious and their wishes cannot be ascertained, the draft calls for doctors, family members and others to discuss the matter thoroughly and take the best course of action for the patient.\\""}, {"ja": "延命治療に関して判断する際には、医療関係者は、患者が納得のいく意思決定ができるよう支援してほしい。", "en": "When making decisions regarding life-sustaining treatment, medical professionals should provide support to ensure that patients and their families can make decisions that are acceptable to them.\\""}]}, {"id": "default-18", "topic": "3 security documents", "title": "戦い方の変化にも対応が必要", "source": "読売新聞 2026年4月28日", "isDefault": true, "pairs": [{"ja": "日本を取り巻く安全保障環境はかつてないほど厳しさを増している。", "en": "The security environment surrounding Japan is becoming more severe than ever before.\\""}, {"ja": "また、無人機（ドローン）などを使った新しい戦い方にも対処せねばならない。そうした状況に対応するための防衛力のさらなる強化に必要な財源をどう確保するか。", "en": "Japan also has to deal with new methods of warfare, including those involving the use of unmanned aerial vehicles, commonly known as drones. How can the necessary funding be secured to further strengthen the nation\'s defense capabilities in response to these circumstances?\\""}, {"ja": "政府は、有識者の意見を踏まえ、アジア全体の平和と安全を守るための課題を整理し、実行に移す体制を整えることが重要だ。", "en": "It is essential for the government to identify challenges involved in safeguarding peace and safety in the entire Asian region, and to establish a framework to translate these challenges into actions, based on the opinions of experts.\\""}, {"ja": "政府は年末までに、安全保障政策の基本方針を定めた国家安全保障戦略や、2023年度から5年間の防衛費を明記した防衛力整備計画など、安保3文書を改定する予定だ。そのあり方について議論する有識者会議が初会合を開いた。", "en": "By the end of the year, the government plans to revise three security documents, including the National Security Strategy, which sets forth the basic security policy, and the Defense Buildup Program, which specifies defense spending for the five years that started in fiscal 2023. A panel of experts tasked with discussing how the documents should be revised has held its first meeting.\\""}, {"ja": "22年末に改定された現在の3文書は、中国や北朝鮮のミサイルへの対処力を高めるため、反撃能力の保有などを明記した。防衛費は5年間で43兆円と定めた。", "en": "The current documents, which were revised at the end of 2022, explicitly state the need to possess counterattack and other capabilities to enhance Japan\'s ability to deal with missiles from China and North Korea. Defense spending was set at ¥43 trillion over five years.\\""}, {"ja": "だがその後も、中国は軍事力を増強し続けている。太平洋に空母を展開し、訓練を繰り返すようになった。ロシアと北朝鮮は軍事協力を深めている。", "en": "Since then, however, China has continued to build up its military capabilities. It has begun deploying aircraft carriers in the Pacific and has repeatedly conducted military exercises. Russia and North Korea are deepening their military cooperation.\\""}, {"ja": "4年前に比べて、安保環境が悪化しているのは明白だ。3文書の改定を前倒して脅威に備えるのは妥当である。改定に向けた議論で焦点となるのは、新たな戦い方への対処だ。", "en": "It is clear that the security environment has deteriorated compared to the situation four years ago. It is appropriate for the government to advance the revision of the three documents to be prepared for these threats. The focus of the discussions leading up to the revisions is how to deal with new methods of warfare.\\""}, {"ja": "イランは米国とイスラエルの攻撃に対抗し、安価なドローンを大量に投入している。", "en": "Iran is deploying large numbers of low-cost drones to counter attacks by the United States and Israel.\\""}, {"ja": "現在、日本には、戦闘で使用できるだけのドローンを製造する基盤がない。高性能なドローンを調達するため、防衛企業の育成を急ぐことが肝だ。", "en": "Currently, Japan lacks the foundation to produce drones that can be used in combat. It is essential for the government to help rapidly foster defense companies in order to procure high-performance drones.\\""}, {"ja": "ロシアの侵略を受けるウクライナは、常に武器の不足に直面している。継戦能力の維持はどの国にとっても重い課題だ。", "en": "Ukraine, which is being subjected to Russia\'s aggression, constantly faces a shortage of weapons. Maintaining combat sustainability is a significant challenge for any country.\\""}, {"ja": "政府は防衛装備移転3原則とその運用指針を改め、殺傷能力のある装備品の輸出に道を開いた。", "en": "The government has revised the Three Principles on Transfer of Defense Equipment and Technology and their operational guidelines, paving the way for the export of lethal defense equipment.\\""}, {"ja": "海外に販路を拡大し、同志国との相互協力の体制を構築する意義は大きい。そうした取り組みを通じて国内の生産能力が向上させられれば、継戦能力も高まる。", "en": "Expanding sales channels overseas and establishing a framework for mutual cooperation with like-minded nations is extremely important for Japan. If domestic production capacity can be improved through such steps, the nation\'s combat sustainability will also be enhanced.\\""}, {"ja": "企業が円滑に装備品を輸出するには、政府の後押しが欠かせない。価格交渉などに国が関与することも視野に入れてはどうか。", "en": "Government support is essential for companies to export defense equipment smoothly. Perhaps government involvement in such matters as price negotiations should be considered.\\""}, {"ja": "今後、防衛費を含む安保関連経費をどの程度積み増すかも、有識者会議で議論するテーマだ。防衛力の強化には恒久的な財源が必要だ。安易な国債依存や一過性のやり繰りでは済まされない。政府は恒久財源の確保へ正面から国民に理解を求めるべきだ。", "en": "Going forward, the extent to which security-related expenditures, including defense spending, should be increased will also be a topic of discussion at the expert panel. Enhancing defense capabilities requires permanent fiscal resources. There should not be a casual reliance on government bonds, nor should stopgap measures be used. The government should directly seek the public\'s understanding regarding the securing of permanent fiscal resources.\\""}]}, {"id": "default-19", "topic": "Gun attack in U.S. capital", "title": "政治への暴力連鎖を憂慮する", "source": "読売新聞 2026年4月28日", "isDefault": true, "pairs": [{"ja": "トランプ米大統領が、今度は首都ワシントンで銃の脅威にさらされた。米国で政治への凶行が相次ぎ、自由な言論や民主主義を脅かしている事態を深く憂慮する。", "en": "U.S. President Donald Trump faced the threat of gun violence again; this time it happened in Washington, the U.S. capital. It is deeply concerning that atrocious acts against politics have occurred in the United States one after another, threatening free speech and democracy.\\""}, {"ja": "ワシントン中心部のホテルで開かれていた米ホワイトハウス記者会主催の夕食会の会場近くで、男が発砲した。男はその場で拘束されたが、出席していたトランプ氏やバンス副大統領らは退席を余儀なくされた。", "en": "A man opened fire near the ballroom of a hotel in central Washington during a dinner hosted by the White House Correspondents\' Association. The man was apprehended at the scene, but Trump, U.S. Vice President JD Vance and other guests in attendance were forced to evacuate.\\""}, {"ja": "米国や世界の行方に重大な影響力を持つ米政権幹部が勢ぞろいしていた場に、銃口が迫っていた事実には驚愕（しんかん）させられる。", "en": "It is shocking that such an attack occurred so close to a gathering of senior U.S. administration officials who wield significant influence over the future of the United States as well as the world.\\""}, {"ja": "米メディアによると、男は犯行前に家族に送った声明で、政権幹部を「最高位から順に標的」にすると記していた。トランプ氏が含まれていたとみられる。", "en": "According to U.S. media reports, in a statement sent to his family before his attack, the man wrote that he would target administration officials, \\"from highest-ranking to lowest.\\" It is believed that he included Trump as a target.\\""}, {"ja": "米軍のカリブ海での麻薬密輸船攻撃や、イランの小学校への空爆などにも触れ、トランプ政権への強い不満を示していたという。", "en": "The man had reportedly shown strong dissatisfaction with the Trump administration, mentioning incidents such as the U.S. military\'s attacks on drug-trafficking vessels in the Caribbean and the airstrike on an elementary school in Iran.\\""}, {"ja": "いかなる動機であろうとも、政治を暴力で踏みにじろうとする企ては、断じて許されない。", "en": "Regardless of the motive, any attempt to trample on politics through violence is absolutely unacceptable.\\""}, {"ja": "米国では最近、意見の違う相手を「敵」と決めつけ、力で排除しようとする動きが目立つ。", "en": "Recently in the United States, there has been a noticeable trend of labeling those with differing opinions as enemies and attempting to eliminate them through violence.\\""}, {"ja": "トランプ氏は2期目の大統領に就く前の2024年に2度、暗殺未遂の標的となっている。昨年9月には、トランプ氏に近い保守派の論客が演説中に銃撃され、死亡する事件も起きた。", "en": "Trump was the target of two assassination attempts in 2024, prior to his second term as president. Last September, a conservative political activist who was a key Trump ally was shot and killed while giving a speech.\\""}, {"ja": "凶行はトランプ政権の与党・共和党だけでなく、民主党の政治家らにも及んでいるが、トランプ氏は保守派論客の殺害を「左派の過激派」のせいにするなど、党派対立を自ら煽（あお）ってきた。", "en": "While such atrocious acts have reached members of Trump\'s Republican party, they have also affected Democratic politicians. Trump himself has stirred up partisan division, such as by blaming the killing of the conservative activist on the \\"radical left.\\"\\""}, {"ja": "だが今回の事件後、トランプ氏は米国民に対し、「意見の違いを平和的に解決しよう」と融和を呼び掛けた。11月の米中間選挙に向けて政治的な対立が過熱し、暴力の連鎖が続くことを懸念したとすれば、正しい判断と言える。", "en": "However, after the latest incident, Trump urged the American people to be conciliatory, calling on them to \\"resolve our differences peacefully.\\" If the president made this remark out of concern that political tensions could escalate ahead of the November midterm elections and that the cycle of violence could continue, it can be seen as the right decision.\\""}, {"ja": "まずは大統領自らが国内外の諸課題について、力ではなく話し合いを通じた平和的解決を目指す姿を見せるべきだ。", "en": "First and foremost, Trump himself should demonstrate a commitment to seeking peaceful resolutions through dialogue — rather than force — for domestic and global issues.\\""}, {"ja": "トランプ氏が、政権に批判的なメディアを含むホワイトハウス記者会の招待に応じて夕食会に出席するのは今回が初めてだったが、銃撃事件で打ち切られた。", "en": "This was the first time Trump had accepted an invitation from the correspondents\' association — whose members include media outlets critical of his administration — to attend a dinner. However, the event was cut short because of the attack.\\""}, {"ja": "トランプ氏は、軍事的なイラン攻撃を批判する主要紙報道を「反米フェイクニューズ」と決めつけ、攻撃している。トランプ氏は夕食会を改めて開くよう希望したというが、求められるのはメディアの批判に真摯（しんし）に向き合う姿勢だ。", "en": "Trump has been attacking major newspapers for their reports that criticize the U.S. military\'s strikes on Iran, dismissing their coverage as \\"anti-American fake news.\\" Trump reportedly hopes for the dinner to be held again, but what he needs is to take the position of seriously facing criticism from the media.\\""}]}, {"id": "default-20", "topic": "Appeal of Japanese food", "title": "海外の「気づき」を生かしたい", "source": "読売新聞 2026年4月26日", "isDefault": true, "pairs": [{"ja": "自分でも気がついていない日本食の魅力を、海外が発見する。そのような事例が増えている。", "en": "An increasing number of people overseas have discovered appealing aspects of Japanese food that even Japanese people had not noticed.\\""}, {"ja": "海外での評判を敏感につかんでビジネスにつなげるよう工夫し、日本食の輸出を増やしていきたい。", "en": "Japan should increase exports of its food products by keeping a close eye on their reputation overseas and devising ways to turn this into business opportunities.\\""}, {"ja": "「バブル」と呼ばれるほど世界的に人気を博しているのが、抹茶である。カテキンなどの成分が健康によいとされ、サプリメント感覚で摂取されている。鮮やかな緑色はSNSで見栄えがよく、投稿が相次いでいることも大きい。", "en": "Matcha has seen such global popularity that the craze is being called a bubble. The constituents of matcha, including catechins, are believed to be beneficial to one\'s health, and people abroad often consume it as though it were a dietary supplement. Its vibrant green color is visually appealing on social media, leading people to post images of matcha products, yet another factor fueling the craze.\\""}, {"ja": "芳醇（ほうじゅん）なうまみを生かし、抹茶ラテやデザートなどに使われ、米コーヒーチェーン大手スターバックスでは定番メニューとなった。大谷翔平選手らがヒットのたびに、抹茶を点（た）てるポーズでチームを鼓舞したことも話題を呼んだ。", "en": "Matcha is used in lattes and desserts for its rich flavor, and it has become a staple at Starbucks, the major U.S. coffee chain. Matcha also became a hot topic as Shohei Ohtani and other baseball players fired up their team by pretending to whisk matcha every time they got a hit.\\""}, {"ja": "これまで予想もしなかったエンターテインメント的な人気の呼び方は、日本食の魅力を売り込む上で大きなヒントになるだろう。", "en": "This unexpected way to gain popularity, which resembles something out of the entertainment industry, likely offers a major clue for selling the appeal of Japanese food.\\""}, {"ja": "東南アジアでは、焼き芋が高級スイーツとして人気だ。凍らせてシャーベット状にして食べることがブームというのは、日本人の想像を超えているのではないか。", "en": "In Southeast Asia, roasted sweet potatoes are popular as high-end sweets. The trend of freezing these sweet potatoes and eating them as a sorbet-like treat would probably never occur to most Japanese people.\\""}, {"ja": "ふんわりとしたパンと、濃厚で滑らかな卵サラダを組み合わせた「たまごサンド」も、海外では新鮮さをもって受け入れられているようだ。これからも、訪日客が日本食のさらなる魅力を発見して世界に伝えていくに違いない。", "en": "Japanese-style egg salad sandwiches, which combine fluffy bread with rich, smooth egg salad, also seem to be well received as a novelty outside Japan. No doubt foreign visitors to Japan will continue discovering the appeal of Japanese food and sharing it with people worldwide.\\""}, {"ja": "日本も、アンテナを高くして、ビジネスチャンスをつかんでいくことが大切だ。", "en": "It is crucial for Japan to seize business opportunities by keeping an eye out.\\""}, {"ja": "2025年の農林水産物・食品の輸出額は1.7兆円に上り、13年連続で過去最高を更新した。抹茶を含む緑茶の輸出額は前年比で約2倍となる721億円に上る。日本食の潜在力を踏まえれば、伸びしろはまだまだあるはずだ。", "en": "In 2025, Japan\'s exports of agricultural, forestry and fishery products as well as processed foods reached ¥1.7 trillion, setting a new record high for the 13th consecutive year. Its exports of green tea, including matcha, amounted to ¥72.1 billion, about double the previous year\'s figure. Given the potential for Japanese food, there is surely still room for growth.\\""}, {"ja": "政府が日本食のブランドを守る施策を強化する必要もある。", "en": "The government also needs to strengthen measures to protect Japanese food brands.\\""}, {"ja": "日本で開発された高級ブドウのシャインマスカットは、苗木が中国や韓国に流出し、栽培面積が広がった結果、日本からの輸出が減って打撃を被っている。", "en": "The high-quality Shine Muscat grape variety, which was developed in Japan, has suffered a blow. Japan\'s exports fell after saplings were taken to China and South Korea, resulting in more land being devoted to the variety\'s cultivation.\\""}, {"ja": "抹茶も、中国で「宇治抹茶」という文字を表示した日本の模倣品が売られていたという。", "en": "It has also been reported that counterfeit Japanese products labeled \\"Uji matcha\\" were being sold in China.\\""}, {"ja": "政府は今月、果物などの新品種の海外への流出対策を強化する種苗法改正案を閣議決定した。", "en": "Earlier this month, the Cabinet approved a bill to amend the Plant Variety Protection and Seed Law, so as to strengthen measures for preventing new varieties of fruits and other crops from being leaked overseas.\\""}, {"ja": "農産品の新たな種や苗などについて、品種登録の出願から登録までに時間がかかるため、その間に第三者が無断で輸出するのを防ぐようにするものだ。", "en": "Because it takes time to go from applying to register a new variety of an agricultural product to actually getting it registered, the legal revision is aimed at preventing third parties from exporting seeds and seedlings of the product without permission during this time.\\""}, {"ja": "規制の抜け穴を不断に点検していくことが重要になろう。", "en": "There will probably be a need to constantly monitor for loopholes in the regulations.\\""}]}, {"id": "default-21", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part1", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Jacob: M&A Talkへようこそ。", "en": "Jacob: Welcome to M&A Talk."}, {"ja": "Jacob: Morgan and Westfieldの代表であり、M&A Talkのホストを務めるJacobです。", "en": "Jacob: My name is Jacob, president of Morgan and Westfield and your host of M&A Talk."}, {"ja": "Jacob: 本日はカリフォルニア州ロサンゼルスのItafosより、Luana Helsingerさんをお迎えしています。", "en": "Jacob: And today we have Luana Helsinger of Itafos in Los Angeles, California, joining us on the show."}, {"ja": "Jacob: LuanaはItafosでコーポレート・ディベロップメントを担当しており、M&A、資金調達、株式調査、株式トレーディングの分野で10年以上の経験を有し、ラテンアメリカおよび米国市場を専門としています。", "en": "Jacob: Luana is a corporate development professional at Itafos with over 10 years of experience in M&A, capital raising, equity research, and equity trading with a focus on Latin American and U.S. markets."}, {"ja": "Jacob: Itafosに入社する前は、Raymond Jamesで株式調査アソシエイトとして、米国および海外の石油・ガス会社を担当していました。", "en": "Jacob: Prior to joining Itafos, Luana worked as an equity research associate at Raymond James covering international and US oil and gas companies."}, {"ja": "Jacob: Luanaは現在カリフォルニアのUCLA AndersonでMBA取得を目指しており、金融経済学の修士号と経済学の学士号を取得しています。", "en": "Jacob: Luana is an MBA candidate at UCLA Anderson in California and holds a master\'s in financial economics and a bachelor of arts in economics."}, {"ja": "Jacob: Luanaさん、本日はご出演いただきうれしく思います。", "en": "Jacob: Luana, it\'s great to have you on the show."}, {"ja": "Jacob: まず最初に、Itafosはどのような会社なのでしょうか。", "en": "Jacob: Tell me a little bit, first of all, what does Itafos do?"}, {"ja": "Luana: Itafosはミネアポリスのプライベートエクイティが保有する投資先企業です。", "en": "Luana: Itafos, it\'s a portfolio company held by a private equity out of Minneapolis."}, {"ja": "Luana: そのプライベートエクイティの名称はCastle Lakeで、当社は鉱業権とリン資源に注力しており、肥料を製造しています。", "en": "Luana: The private equity name is Castle Lake, and that the business is focused on mining rights and phosphorus, so we manufacture fertilizer."}, {"ja": "Jacob: つまり、本質的にはPEファンドということですか。", "en": "Jacob: So they\'re a PE firm, essentially?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Jacob: もう一度戻りましょう。", "en": "Jacob: And back up again, because I think a lot of people might not have caught that."}, {"ja": "Jacob: 彼らの専門分野は何でしたか。", "en": "Jacob: What is their specialty again?"}, {"ja": "Jacob: 鉱業やガス関連とのことでしたが、具体的には何をしているのでしょうか。", "en": "Jacob: Mining and gas and what do they do?"}, {"ja": "Luana: はい。当社の専門分野は世界各地でリン鉱石の採掘権を保有することです。", "en": "Luana: Yeah, so the specialty is having phosphorus mining rights all over the world."}, {"ja": "Luana: そして、そのリンを使って肥料を製造しています。", "en": "Luana: And with phosphorus, we manufacture fertilizer."}, {"ja": "Jacob: その「権利」とは、どのような形態のものなのでしょうか。", "en": "Jacob: So when you say rights, what form does that come in?"}, {"ja": "Jacob: ライセンス契約のようなものですか、それとも別の形でしょうか。", "en": "Jacob: Is that a licensing type arrangement or what?"}, {"ja": "Luana: はい、その通りです。", "en": "Luana: Yes, yes."}, {"ja": "Luana: 天然資源のある国によって異なりますが、権利の場合もあれば、リース契約の場合もあります。", "en": "Luana: So depending on the country that you have natural resources, sometimes you have rights, sometimes you have leasy agreements."}, {"ja": "Luana: 簡単に言うと、通常は政府から採掘権を取得し、リンのような天然資源を探査できるようになります。", "en": "Luana: But in a very short answer is usually you have mining rights with the government to be able to explore natural resources such as phosphorus."}, {"ja": "Jacob: そのリン肥料は、具体的にどのように使われるのでしょうか。", "en": "Jacob: And again, what do you do with the phosphorus fertilizer?"}, {"ja": "Luana: はい。リンは作物向け肥料の主要成分の一つで、主に大豆やトウモロコシに使われます。", "en": "Luana: Yes, phosphorus is one of the main fertilizer for crops, essentially soybeans and corn."}, {"ja": "Jacob: 大豆とトウモロコシですか。素晴らしいですね。", "en": "Jacob: Soybeans and corn, wonderful."}, {"ja": "Jacob: 私はその二つの食べ物が好きではありません。", "en": "Jacob: Two foods I don\'t like."}, {"ja": "Jacob: 大豆は体によくないと言われていますよね。", "en": "Jacob: Soy supposedly is not good for that."}, {"ja": "Jacob: 先日そのことを料理人に話したら、嫌な顔をされました。", "en": "Jacob: I just told my cook that the other day and she gave me a dirty look."}, {"ja": "Jacob: あなたの経歴についてもう少し教えてください。", "en": "Jacob: Tell me a little bit more about your background."}, {"ja": "Jacob: あなたの専門分野は何でしたか。", "en": "Jacob: What has been your core specialty?"}, {"ja": "Jacob: その前に、確かあなたはブラジル出身でしたよね。", "en": "Jacob: Actually, before we go into that, I know you\'re originally from Brazil."}, {"ja": "Jacob: ドイツ系のお名前ですよね。", "en": "Jacob: You\'ve got a German name."}, {"ja": "Jacob: この会話の背景をリスナーに知ってもらうためにも、ご自身について少しお話しください。", "en": "Jacob: Tell us a little bit about your background so the listeners know the behind the scenes of this conversation."}, {"ja": "Luana: もちろんです。", "en": "Luana: Absolutely."}, {"ja": "Luana: はい、私の名前はLuana Helsingerです。", "en": "Luana: Yes, my name is Luana Helsinger."}, {"ja": "Luana: Luanaはとてもブラジルらしい名前です。", "en": "Luana: So there is Luana, that it\'s a very Brazilian name."}, {"ja": "Luana: 一方で、Helsingerはとてもドイツ的な姓です。", "en": "Luana: Helsinger, very German name."}, {"ja": "Luana: 私はブラジルのリオデジャネイロで生まれました。", "en": "Luana: I was born in Rio de Janeiro, Brazil."}, {"ja": "Luana: 実は父方の家族はユダヤ系で、第二次世界大戦中にブラジルへ移住してきました。", "en": "Luana: And my family, actually, my father\'s side of the family is Jewish and arrived in Brazil during the Second World War."}, {"ja": "Luana: そのため、この姓を受け継いでいます。", "en": "Luana: That\'s how I inherited my last name."}, {"ja": "Luana: 経歴についてお話しすると、", "en": "Luana: In terms of career backgrounds."}, {"ja": "Luana: 私は経済学の学士号を取得し、その後ブラジルで金融学の修士号を取得しました。", "en": "Luana: I have an undergrad in economics, then I did a master\'s in finance, all of this in Brazil."}, {"ja": "Luana: その後、2014年に私は米国へ移住しました。", "en": "Luana: Then I moved to the US in 2014."}, {"ja": "Luana: 私はテキサスへ移り、Raymond Jamesという株式調査会社に入社しました。", "en": "Luana: I moved to Texas and joined an equity research company called Raymond James."}, {"ja": "Luana: そしてRaymond Jamesでしばらく働いた後、現在の職場であるItafosに移り、コーポレート・ディベロップメント・マネージャーとして働くようになりました。", "en": "Luana: And after a little bit of time in Raymond James, I moved to Itafos, my current role as a corporate development manager."}, {"ja": "Luana: 現在は、会社のM&A戦略、成長機会、資金調達、ファイナンスに注力しています。", "en": "Luana: So I focus on the M&A strategy of the company, the growth opportunities, capital raise, financing."}, {"ja": "Luana: そして現在はロサンゼルスで暮らしながら、UCLAでMBAを取得しています。", "en": "Luana: And I\'m currently living in California, Los Angeles, doing my MBA at UCLA."}, {"ja": "Jacob: 素晴らしいですね。", "en": "Jacob: Wonderful."}, {"ja": "Jacob: ブラジルから銃社会のテキサスへ移って、どのようなカルチャーショックがありましたか。", "en": "Jacob: What was the culture shock from Brazil to gunslinging Texas like?"}, {"ja": "Luana: むしろカルチャーショックを受けたのは私よりも彼らの方だったと思います。", "en": "Luana: I think maybe the culture shock came more from them than from me."}, {"ja": "Luana: 私は何年も前からアメリカを訪れていましたから。", "en": "Luana: I have been going, had me visiting the US for years."}, {"ja": "Luana: ただ、ドイツ系の血筋ということもあって、『こんにちは、Luana Helsingerです』と自己紹介すると、皆とても戸惑うことがありました。", "en": "Luana: But given that my German descendency, I think whenever I was introducing myself, hi, I\'m Luana Helsinger, and they would all be sometimes very confused."}, {"ja": "Luana: ブラジル出身なのですか。", "en": "Luana: Are you from Brazil?"}, {"ja": "Luana: 私は「はい、ブラジル出身です」と答えました。", "en": "Luana: I said, yeah, I am from Brazil."}, {"ja": "Luana: そしてもう一つのカルチャーショックは、テキサスの人たちの多くが、もちろん全員ではありませんが、南米についてほとんど知らなかったことでした。", "en": "Luana: And the second portion of it, my main shock was to see how Texas, most of them, not everyone, of course, knew very little about South America."}, {"ja": "Luana: その良い例として、アルゼンチンの首都であるブエノスアイレスをブラジルの首都だと思っている人たちに出会ったことがあります。", "en": "Luana: And a good example was I met some folks who thought Buenos Aires, which is the capital of Argentina, thought Buenos Aires was the capital of Brazil."}, {"ja": "Jacob: なんてことだ。", "en": "Jacob: Oh, Lord."}, {"ja": "Luana: はい、私は実際にそういう経験をしました。", "en": "Luana: Yes, I had to go through that."}, {"ja": "Jacob: 彼らには助けが必要ですね。", "en": "Jacob: They need some help."}, {"ja": "Jacob: そして地図も必要ですね。", "en": "Jacob: And a map."}, {"ja": "Jacob: では、あなたの専門分野は何ですか。", "en": "Jacob: So what is your core expertise?"}, {"ja": "Jacob: LinkedInのプロフィールを見ると、とても幅広い経歴をお持ちですよね。", "en": "Jacob: If I\'m looking at your LinkedIn profile, you\'ve got a pretty diverse background."}, {"ja": "Jacob: いわゆるエレベーターピッチは好きではありませんが、10秒でも20秒でも30秒でもよいので、あなたの仕事の本質を説明するとしたら、普段どのように説明していますか。", "en": "Jacob: I hate to use the elevator pitch, but if you\'ve got 10, 20, 30 seconds to explain the essence of what you do, what do you typically tell people what you do for a living?"}, {"ja": "Luana: もちろんです。", "en": "Luana: Absolutely."}, {"ja": "Luana: 私は株式調査からキャリアをスタートしました。そこでは上場企業の適正価値を見つけ出すことを行いますが、その過程には企業価値評価や多くのキャッシュフロー予測が含まれます。", "en": "Luana: So I started my career as a research, which encompasses trying to find the fair value of public traded companies, which then encompasses valuation, a lot of forecasting of cash flows."}, {"ja": "Luana: 株式調査の後、私はコーポレート・ディベロップメントへ移りました。これは自然な流れでした。そこでも引き続きキャッシュフローを予測しますが、今度は実際にM&Aを実行したり、自社の予算策定に活用したりするためです。", "en": "Luana: After equity research, I transitioned, it was a natural transition to corporate developments, which is you\'re still trying to forecast these cash flows, but at this time, more to actually perform a merger and acquisition and even internally for your own company budgets."}, {"ja": "Luana: ですので、私の主な専門性は、できる限り正確にキャッシュフローを予測し、企業や資産、プロジェクトを適正に評価することだと思います。", "en": "Luana: So I think my main expertise is to try my best to be very accurate in forecasting cash flows and to do a fair valuation of companies or assets or projects."}, {"ja": "Jacob: 株式調査の本質とは何でしょうか。", "en": "Jacob: What is the essence of equity research?"}, {"ja": "Jacob: 日々どのような仕事をしているのですか。", "en": "Jacob: What are you doing on a daily basis?"}, {"ja": "Jacob: また、その職種の仕事内容や成果物はどのようなものなのでしょうか。", "en": "Jacob: And what is the job description or kind of the outcome of that type of role?"}, {"ja": "Luana: はい。", "en": "Luana: Sure."}, {"ja": "Luana: 株式調査の本質は、特定の業界を担当することです。", "en": "Luana: So the essence of equity research is you are assigned a sector."}, {"ja": "Luana: 私の場合は石油・ガス業界を担当しており、Exxon、Chevron、Marathonなどをカバーしていました。", "en": "Luana: In my case, I was assigned at the oil and gas sector, which means I was covering Exxon, Chevron, Marathon."}, {"ja": "Luana: そして、それらの企業について財務モデルを作成します。", "en": "Luana: And with these names, you have to develop a financial model."}, {"ja": "Luana: 財務モデルには、損益計算書、キャッシュフロー計算書、貸借対照表が含まれ、企業が公表している実績値を利用します。", "en": "Luana: And in the financial model, you have income statements, you have a cash flow statement, you have a balance sheet, and you use actuals provided by companies."}, {"ja": "Luana: すべての上場企業にはInvestor Relationsと呼ばれるウェブサイトがあります。", "en": "Luana: All the public traded companies have a website called Investor Relations."}, {"ja": "Luana: ChevronのInvestor RelationsやExxonのInvestor Relationsといったものです。", "en": "Luana: Investor Relations of Chevron, Investor Relations of Exxon."}, {"ja": "Luana: そうした実績データを集めた後、その企業の次の展開について本格的に深く分析し始めます。", "en": "Luana: After gathering all of these actuals, you start really doing a deep dive on on what is next for these companies."}, {"ja": "Luana: だからこそ、これを株式調査と呼ぶのだと思います。", "en": "Luana: And I think that\'s why it\'s called equity research."}, {"ja": "Luana: 企業が今後どこへ向かうのかをできる限り正確に予測するために、膨大な調査を行います。", "en": "Luana: A lot of research goes in so you can try to do the best forecast possible on the direction of this company."}, {"ja": "Luana: そのためには、企業のIR担当者との電話や、経営陣との数多くのやり取りが含まれます。", "en": "Luana: So with that, that involves a lot of calls with the investor relations manager of these companies, involves a lot of. management interaction with these companies."}, {"ja": "Luana: Raymond Jamesにいた頃には、当時ExxonのCEOだったRex Tillersonと話をする機会にも恵まれました。", "en": "Luana: Back at my days at Raymond James, I was happy enough to be able to have a conversation with Rex Tillerson, which at the time was the CEO of Exxon."}, {"ja": "Luana: とても良い会話でした。", "en": "Luana: It was a very nice conversation."}, {"ja": "Luana: そして、企業が発する微妙なニュアンスを読み取ろうとします。", "en": "Luana: And you really try to get the nuances, right?"}, {"ja": "Luana: なぜなら、企業は自分たちが期待していることをそのまま話すことは決してないからです。", "en": "Luana: Because a company will never tell you exactly what they are expecting."}, {"ja": "Luana: むしろ、より楽観的なストーリーを描こうとすることが多いと思います。", "en": "Luana: I think they always try to outline more the optimistic story."}, {"ja": "Luana: ですから、「これは現実的なシナリオなのか」を見極める必要があります。", "en": "Luana: So you need to be able to kind of gauge a little bit of, okay, is this a realistic scenario?"}, {"ja": "Luana: また、そのシナリオにどの程度の確率を割り当てるべきかも考えなければなりません。", "en": "Luana: Should I assign a probability for this scenario?"}, {"ja": "Luana: そして、それらすべての情報を集め、企業が示す将来見通しを検討し、さらに多くのカンファレンスに参加して業界で何が起きているのかを学びます。石油・ガス業界では原油価格が非常に重要です。", "en": "Luana: And after gathering all of this, in a future indications that the company\'s providing to you and going into a lot of conferences to really learn of what\'s happening in the sector in the case of oil and gas, oil prices are very important."}, {"ja": "Luana: そのため、世界のマクロ経済についても非常に注意深く見ておく必要があります。", "en": "Luana: So you also have to have a very close look in the macroeconomic of the world."}, {"ja": "Luana: こうした情報をすべてExcelにまとめ、フリーキャッシュフローを算出し、企業価値評価を行います。", "en": "Luana: You put all of this in an Excel spreadsheet and you come to your free cashflow and perform evaluation."}, {"ja": "Luana: その後、その数値を発行済株式数で割り、さらにすべてのキャッシュフローを現在価値に割り引いたうえで、「この会社の価値は1株当たり50ドルだ」と判断するのです。", "en": "Luana: After you do that, you divide that number by the amount of shares the company has issued and see, well, after doing this, bringing all this cashflow to present value, I think this company worth $50 per share."}, {"ja": "Luana: その後、その株式が市場で30ドルで取引されているとします。株式調査アナリストは、『この銘柄をポートフォリオに組み入れることを推奨します』というレポートを作成します。", "en": "Luana: Then you look at this stock being traded and let\'s say if the stock is at $30, the equity research will write a research report saying, we recommend this stock to be a part of your portfolio."}, {"ja": "Luana: なぜなら、将来キャッシュフローを反映すると、本来の株価は50ドルになると考えられるからです。", "en": "Luana: It\'s a buy, given that future cash flows would reflect into $50 share price instead."}, {"ja": "Luana: しかし現在、その会社の株価は30ドルで取引されています。", "en": "Luana: And currently the company\'s trading at 30."}, {"ja": "Luana: 逆のケースもあります。", "en": "Luana: And the opposite can happen, right?"}, {"ja": "Luana: 株価が50ドルであっても、すべてのキャッシュフローを現在価値に割り引くと、実際の価値は1株30ドルしかないこともあります。", "en": "Luana: So like the share price can be at 50, but when you bring all this cash flows to present value, you see that the company is actually at $30 per price."}, {"ja": "Luana: その場合は売り推奨になります。", "en": "Luana: So it would be a sell."}, {"ja": "Luana: このように株式調査アナリストは、通常同じ業界に属する担当企業群について日々分析を行い、ヘッジファンド、資産運用会社、個人投資家のポートフォリオ構築を支援しています。", "en": "Luana: So the equity research is doing this on a daily basis with their assigned group of companies, usually in the same sector, and trying to help hedge funds, asset management, individual investors to build their portfolio."}, {"ja": "Jacob: 何銘柄を担当していたのですか。", "en": "Jacob: How many stocks were you covering?"}, {"ja": "Luana: Raymond Jamesにいた当時は、およそ15〜20銘柄を担当していました。", "en": "Luana: At the time at Raymond James, I was covering about 15 to 20 stocks."}, {"ja": "Jacob: それらはすべて同じ業界だったのですか。", "en": "Jacob: And all in the same sector?"}, {"ja": "Luana: はい、すべて石油・ガス業界でした。", "en": "Luana: All in oil and gas, yes."}, {"ja": "Jacob: 例えば、その中の1社を取り上げると、1社あたり何人くらいのアナリストがカバーしているのでしょうか。", "en": "Jacob: How many, for example, pick one of those companies, how many analysts might be covering one company?"}, {"ja": "Luana: 私は石油・ガス業界を担当していましたが、この業界は多くの国のGDPに大きな影響を与える世界的に重要なセクターです。", "en": "Luana: The key thing is since I was covering oil and gas and it\'s a sector follow, it\'s a very heavy sector worldwide in GDP of so many countries and has so much impact in the world."}, {"ja": "Luana: インフレや原油価格への影響について常に議論されており、非常に注目度の高い業界です。", "en": "Luana: You can see with all this, the conversations with inflation being as inflation transitory and the J-Pal is having and this how does it affect oil prices is a sector very much covered."}, {"ja": "Luana: そのため、Exxon、Chevron、Occidental、Marathonといった主要企業については、少なくとも15人程度のアナリストがカバーしていたと思います。", "en": "Luana: So I would say at least 15 analysts were covering the main stocks like Exxon, like Chevron, Occidental, Marathon."}, {"ja": "Luana: より小さな時価総額の企業になると、担当アナリストは少なくなり、5人程度になることもあります。", "en": "Luana: When you go down to a smaller market cap company, then it\'s when you would see a little bit less, maybe five analysts covering that name."}, {"ja": "Jacob: スモールキャップは売上高で定義するのですか。それとも時価総額ですか。", "en": "Jacob: How do you define a small cap by revenue or market cap?"}, {"ja": "Luana: 主に時価総額です。もちろん両者は関連していますが、基本的には時価総額です。", "en": "Luana: Mainly, I think one connects to the other, but market cap."}, {"ja": "Jacob: どの程度の時価総額になるとスモールキャップの範囲に入るのでしょうか。", "en": "Jacob: What market cap would you start to get into the range of a small cap stock?"}, {"ja": "Luana: スモールキャップであれば、おおよそ1億ドル以下の企業はスモールキャップ株と見なされます。", "en": "Luana: Small cap, it would fall around like anything, $100 million below can be already considered a small cap stock."}, {"ja": "Jacob: 私は本当にたくさん質問があります。", "en": "Jacob: I\'ve got lots and lots of questions."}, {"ja": "Jacob: Morgan & Westfieldはローワー・ミドルマーケットを対象としており、その多くは非公開企業です。", "en": "Jacob: Just personally, I\'m very curious about this because our company, Morgan and Westfield operating in the lower middle market, most of those companies are private."}, {"ja": "Jacob: そのため、この番組を聞いている経営者や、そのような非公開市場で活動するアドバイザーにとって、この話にどのような意味があるのか気になります。", "en": "Jacob: So I think for business owners listening to this show or their advisors who mainly work in the private markets, what relevance would you say that this conversation is going to have to them?"}, {"ja": "Jacob: もちろん私たちは公開企業について話していますが、なぜ彼らにとってこの世界の仕組みを知ることが役立つのでしょうか。", "en": "Jacob: So we\'re really, we\'re talking about publicly held companies here, of course, but why do you think it\'d be helpful for them to know how this world operates?"}, {"ja": "Luana: もちろんです。とても良い質問です。", "en": "Luana: Sure, that\'s a great question."}, {"ja": "Luana: 少なくとも二つの側面があると思います。", "en": "Luana: And I think at least two-fold it."}, {"ja": "Luana: 第一に、非公開企業のオーナーは株式調査アナリストとの関係を築くことが非常に有益だと思います。", "en": "Luana: I think one, for all the private owners of companies, it would be extremely helpful for them to build a relationship with an equity research analyst."}, {"ja": "Luana: なぜなら、株式調査アナリストは24時間365日その業界を見続け、他のアナリストや上場企業の経営陣と対話し、業界カンファレンスにも参加しているからです。", "en": "Luana: The reason being, imagine an equity research is 24/7, looking at the sector, having conversations with other equity research analysts, having conversations with the management of public traded companies, attending conference in the sector."}, {"ja": "Luana: つまり、その業界の中で生き、その業界を呼吸しているような存在であり、将来について非常に高い可視性を持っています。", "en": "Luana: So you are literally living and breathing that sector that you gain so much visibility of what the future is kind of unfolding onto that\'s relevant."}, {"ja": "Luana: ですから、もし株式調査との接点がないのであれば、ぜひ関係を築くことをお勧めします。自社のキャッシュフローの見通しをより正確に把握できるようになるからです。", "en": "Luana: So I would for sure recommend if you still don\'t have any type of a relationship or access to equity research, I would encourage you to have so you can have a better visibility of your own cashflow."}, {"ja": "Luana: 例えば、自社が価格受容者の立場にあり、将来の価格動向を知りたいのであれば、株式調査は最も有力な情報源の一つになります。", "en": "Luana: And being less abstract, for example, if you\'re a price taker in your business and you want to kind of get a direction of where prices are going, equity research will be one of the best sources to give you that information."}]}, {"id": "default-22", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part2", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Luana: あるいは、その業界の次のトレンドや、ブレークスルーとなる技術が何かを知るうえでも役立ちます。", "en": "Luana: Or even in the sense of what\'s next in this sector, what technology is materializing, that will be a breakthrough."}, {"ja": "Luana: 特に将来志向の情報については、株式調査が大きな助けになります。", "en": "Luana: These things, especially future-oriented, equity research will be able to help you."}, {"ja": "Luana: 第二に、将来的に上場企業になる可能性について考える際にも重要です。", "en": "Luana: And secondly, I think that the relevance is also starting to think about potentially even being a public listed company."}, {"ja": "Luana: これはそれだけで一本のポッドキャストになるテーマです。", "en": "Luana: And this is a topic for entire podcasts."}, {"ja": "Luana: しかし、株式調査が企業の味方になる場面として、資金調達プロセスがあります。", "en": "Luana: But one thing I can see in equity research being an ally of a company is in the process of capital raise."}, {"ja": "Luana: 株式による調達や負債による調達です。", "en": "Luana: Equity, debt raise."}, {"ja": "Luana: 私は日々その重要性を実感しています。", "en": "Luana: And I see that a lot in my day to day."}, {"ja": "Luana: 私たちがロードショーを行う際には、必ず『アナリストは御社をカバーしていますか』という質問を受けます。", "en": "Luana: Whenever we are going to the streets, our road shows, we always have the questions, does any analyst cover you guys?"}, {"ja": "Luana: 第三者が独自に分析し、独自モデルを作成していることは、投資家や銀行と対話する際に大きな助けになります。", "en": "Luana: And having that third party doing a deep dive, doing their own model can really help the company talking to investors or talking to banks."}, {"ja": "Jacob: アナリストは非公開企業もカバーするのですか。", "en": "Jacob: Do analysts cover private companies?"}, {"ja": "Luana: 通常、アナリストは非公開企業をカバーしませんが、その存在や市場への影響については十分認識しています。", "en": "Luana: Usually analysts do not cover the private companies, but they are very aware of their existence and the impact that they can have in the market."}, {"ja": "Jacob: 公開企業に対する競争上の影響という意味ですか。", "en": "Jacob: The competitive impact on the public companies?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Luana: しかし、実際に非公開企業を追跡しているのは投資銀行家です。", "en": "Luana: But who actually really tracks private companies is our investment bankers."}, {"ja": "Luana: 投資銀行家は、その企業の資金調達や将来のIPOを支援する可能性があるため、非公開企業について詳しく把握しています。", "en": "Luana: So they usually keep a good track of what are the private companies out there, especially because investment bankers may have the interest to help this company to raise money, help this company to in the future do an IPO, an initial public offer."}, {"ja": "Luana: そのため、投資銀行家はより密接に関わっています。", "en": "Luana: So investment bankers will be very much closer."}, {"ja": "Luana: 彼らは各業界の非公開企業に関する独自のデータベースを持っています。", "en": "Luana: They have their own files there of which companies are private in any specific sector."}, {"ja": "Jacob: Saudi Aramcoは世界最大の時価総額企業ですか。", "en": "Jacob: Saudi Aramco is highest market cap in the world?"}, {"ja": "Luana: はい、Saudi Aramcoは世界最大の時価総額企業です。", "en": "Luana: Yes, Saudi Aramco is the largest market cap in the world."}, {"ja": "Luana: そして確か2016年だったと思いますが、Saudi AramcoがIPOを行うと発表しました。", "en": "Luana: And I remember that, I think it was 2016, that they announced they would IPO."}, {"ja": "Luana: そのニュースは私たち全員にとって衝撃でした。", "en": "Luana: And it came to all of us as a shock."}, {"ja": "Luana: 上場企業になると多くの情報を開示しなければならないため、彼らがIPOするとは誰も思っていませんでした。", "en": "Luana: We never thought they would IPO, given that once you\'re a public company, you have to share a lot of information with the public."}, {"ja": "Luana: Saudi Aramcoは常に情報を厳重に管理しており、特にコスト面については社内の人間しか実態を把握していませんでした。", "en": "Luana: And Saudi Aramco always tried to keep their information pretty much in a locker, only Saudi Aramco really knew what was going on there, especially on the cost side."}, {"ja": "Luana: ですから、彼らが上場企業になると決めたことは間違いなく大きな驚きでした。", "en": "Luana: So that was for sure one of the surprises that came out when they decided to become a public company."}, {"ja": "Jacob: そのとき彼らはライオンやトラを手放さなければならなかったのでしょうね。", "en": "Jacob: They probably had to get rid of all the lions and tigers then."}, {"ja": "Jacob: そういった特典も含めて。", "en": "Jacob: All the perks."}, {"ja": "Luana: あらゆる特典ですね。", "en": "Luana: All the parts, all the parts."}, {"ja": "Jacob: ライオンやトラも、貸借対照表から外さなければなりませんね。", "en": "Jacob: Remove the lions and tigers and the balance sheets."}, {"ja": "Jacob: 例えば石油・ガス業界では、どうでしょうか。", "en": "Jacob: In the oil and gas, for example, what\'s what would you say?"}, {"ja": "Jacob: 現在の大手非公開企業にはどのような企業がありますか。", "en": "Jacob: Are some of the largest private companies now?"}, {"ja": "Jacob: もしお話しできる範囲で。", "en": "Jacob: If you can speak on that."}, {"ja": "Luana: 私は今は石油・ガス業界から少し離れており、鉱業セクターに集中しています。", "en": "Luana: Well, I\'ve been a little bit away from the oil and gas now, very focused on the mining sector."}, {"ja": "Luana: ですので、現在の非公開企業については最適な回答者ではないかもしれません。", "en": "Luana: So I wouldn\'t be the best person to help with private companies currently."}, {"ja": "Luana: ただ、石油・ガス業界について言えば、その分野の非公開企業は通常サービス会社であることが多いです。", "en": "Luana: One thing I would say in terms of in oil and gas, usually the private companies in that sector are the services companies, are the companies which are performing some type of services for the upstream."}, {"ja": "Luana: 一方、上流部門の企業は実際に石油探査を行い、原油を汲み上げたり新たな油田を探したりしています。", "en": "Luana: And the upstream companies are the ones which are really doing the oil exploration, pumping barrels or trying to find new oil reservoirs."}, {"ja": "Luana: 石油サービス会社は非公開のままでいることもあります。", "en": "Luana: Sometimes the oil services companies keep their companies private."}, {"ja": "Jacob: ところでSaudi Aramcoはどの取引所に上場したのでしょうか。", "en": "Jacob: So Saudi Aramco, where did they go public, by the way, and what exchange?"}, {"ja": "Luana: Saudi Aramcoは上場しました。", "en": "Luana: Saudi Aramco, they went public."}, {"ja": "Luana: 確かそうだったと思います。", "en": "Luana: I think it was nice."}, {"ja": "Jacob: そのIPOはどうでしたか。", "en": "Jacob: And how was their IPO?"}, {"ja": "Jacob: ご存じであれば、割高でしたか、割安でしたか、それとも適正価格でしたか。", "en": "Jacob: If you\'re aware of that, was it overpriced, underpriced, on target?"}, {"ja": "Luana: それについては把握していません。", "en": "Luana: I\'m not aware of that."}, {"ja": "Jacob: 株式調査アナリストはIPOにも関与するのですか。", "en": "Jacob: As an equity analyst, do you get into the IPOs?"}, {"ja": "Luana: いいえ。", "en": "Luana: No."}, {"ja": "Luana: IPOの場面では投資銀行家が中心になります。", "en": "Luana: So as an equity analyst, it\'s when investment banker will be behind."}, {"ja": "Luana: 株式調査アナリストとしては、企業がIPO申請を行った段階で、その企業をカバーするかどうかを判断します。", "en": "Luana: So as an equity analyst, we are aware that whenever a company filed for an IPO, so that\'s when you make a decision of, do you want to cover this company or not?"}, {"ja": "Luana: そして上場後に最初のレポートを発行し、これを『カバレッジ開始（initiating coverage）』と呼びます。", "en": "Luana: But, and once they start being public traded, that\'s when you issue your first reports and we call initiating coverage."}, {"ja": "Luana: そのレポートでは企業を徹底的に分析し、三つの評価区分のいずれかを付与してカバレッジを開始します。", "en": "Luana: And in that reports, you do a really deep dive and you initiate a coverage using three, one of the three ratings that you assign to a company."}, {"ja": "Luana: その評価は「買い」「保有」「売り」のいずれかです。", "en": "Luana: The company can be a buy, the company can be a hold or the company can be a sell."}, {"ja": "Luana: 投資銀行家は、その企業が実際にIPOを行う前の段階から支援しています。", "en": "Luana: Investment bankers will be working with this company before they actually do their IPO."}, {"ja": "Jacob: 大まかに言うと、投資銀行家と株式調査アナリストの違いは何ですか。", "en": "Jacob: At a high level, what\'s the difference between an investment banker and an equity analyst?"}, {"ja": "Jacob: 投資銀行家が行い、株式調査アナリストが行わない仕事とは何でしょうか。", "en": "Jacob: What do the iBankers do that the equity analysts don\'t do?"}, {"ja": "Jacob: 逆に、株式調査アナリストが行う仕事は何でしょうか。", "en": "Jacob: and vice versa."}, {"ja": "Jacob: また、それぞれは企業のライフサイクルの中でどのような役割を果たすのでしょうか。", "en": "Jacob: And what role does each play in the life cycle of a company?"}, {"ja": "Luana: 企業という観点ですね。もちろんです。", "en": "Luana: Of a company, sure."}, {"ja": "Luana: これも非常に良い質問です。", "en": "Luana: That\'s also a great question."}, {"ja": "Luana: 大まかに言うと、私たちはどちらもセルサイドに属しています。つまり、自分たちのためではなく第三者により良い投資機会を提供する立場です。", "en": "Luana: So on a high level, we both consider a sell side, which means we are working to provide a better investment to a third party, not ourselves."}, {"ja": "Luana: これに対しバイサイドとは、通常は自らのリターンを得るためにポートフォリオを構築する資産運用会社などを指します。", "en": "Luana: So sell side versus the buy side is an asset management who is usually making an building a portfolio to have returns from themselves."}, {"ja": "Luana: その意味では、どちらも同じセルサイドです。", "en": "Luana: So both in that sense, they are the same sell side."}, {"ja": "Luana: 投資銀行家は、非公開企業または上場企業と協働し、M&A、株式による資金調達、IPO（新規株式公開）などを支援します。", "en": "Luana: An investment banker will work with companies and they can be private or public traded to help these companies in mergers and acquisitions, to help the companies to equity raises, to help the companies to do an IPO, initial public offering, if these companies are private."}, {"ja": "Luana: これが投資銀行家の役割であり、彼らは非常に機密性の高い環境で仕事をしています。", "en": "Luana: So that\'s the role of the the IB bankers and they work in a very confidential space."}, {"ja": "Luana: 企業は多くの情報を投資銀行家に共有するため、彼らは機密情報を扱います。", "en": "Luana: They work with confidential information as the company has to share a lot with these bankers."}, {"ja": "Luana: 一方、株式調査アナリストは、企業が公開している情報、いわゆる重要な公開情報を用いて仕事をします。", "en": "Luana: Now, an equity research works with public information, what we call material public information that a company share with us."}, {"ja": "Luana: そして、その公開情報と私たち自身の分析・洞察に基づいて投資推奨を行います。", "en": "Luana: And with these public informations and our sensibility and our analysis of these companies, that\'s when we can make a recommendation."}, {"ja": "Luana: 例えば私がある企業を担当していても、その企業が他社買収を検討しているかどうかは分かりません。しかし投資銀行家はその情報を持っています。", "en": "Luana: But for example, if I\'m covering a company, I will never know if this company is actually looking to acquire another company, but an investment banker will have this information."}, {"ja": "Luana: 企業のライフサイクルにおいて、非公開企業は通常、投資銀行家とより多く接触します。", "en": "Luana: And in the life cycle of a company, for private companies, usually they have more conversations with investment bankers."}, {"ja": "Luana: 投資銀行家は、その企業の上場支援を行うこともできますし、たとえ上場が目標でなくても、豊富なネットワークを活用して支援できます。", "en": "Luana: Investment bankers can try to help this company become public or even if it\'s not the goal of the company at the moment, investment bankers, given their list of contacts, it\'s an amazing networking that iBankers have."}, {"ja": "Luana: 彼らは企業の株式による資金調達を大いに支援することができます。", "en": "Luana: They can really help companies in having an equity raise."}, {"ja": "Luana: そのため、この初期段階において、あるいは上場を目指していない企業であっても、投資銀行家と良好な関係を築く価値は大いにあります。", "en": "Luana: And so in this first stage of, or even if the company doesn\'t want to be a public company, they can have a very good relationship with iBankers."}, {"ja": "Luana: 一方で、株式調査アナリストは通常、上場企業と強い関係を築いています。", "en": "Luana: On the other side, equity research analysts, usually they have a strong relationships with public traded companies."}, {"ja": "Jacob: 興味深いですね。", "en": "Jacob: Interesting."}, {"ja": "Jacob: しばらく株式調査の話を続けた後で、あなたのキャリアの第二段階であるコーポレート・ディベロップメントの話に移りましょう。", "en": "Jacob: We\'ll kind of cover the equity researcher for a while and then we\'ll branch off into the corporate development, which is the second phase of your career here."}, {"ja": "Jacob: 私自身、この仕事をしていても株式調査の世界に触れる機会はほとんどないので、とても興味があります。", "en": "Jacob: So I\'m very, very curious about the equity research because for me and what I do, it\'s just not something we\'re exposed to very often."}, {"ja": "Jacob: 株式調査アナリストは公開情報を利用します。", "en": "Jacob: The equity analysts use public information."}, {"ja": "Jacob: しかし例えば、あなたはRex Tillersonと話をしたと言っていました。", "en": "Jacob: But for example, you said you talked to Rex Tillerson."}, {"ja": "Jacob: 非公開情報にアクセスできる機会はどの程度あるのでしょうか。", "en": "Jacob: How common is it for you to be able to access private information?"}, {"ja": "Jacob: この質問は答えにくいかもしれませんね。", "en": "Jacob: Maybe this question might make you uncomfortable."}, {"ja": "Luana: まずいですね。", "en": "Luana: Mike, you\'re in trouble."}, {"ja": "Jacob: あなたのことはやめておきましょう。", "en": "Jacob: Let\'s not talk about you."}, {"ja": "Jacob: あなたではなく、他の株式調査アナリストについて聞きたいのですが、そのような会話を聞くと、アナリストが非公開情報を入手することがあるのか、それとも年次報告書や財務諸表など公開情報だけで仕事をしているのか気になります。", "en": "Jacob: Let\'s talk about other equity analysts because that conversation to me, a conversation like that, I\'m wondering if equity analysts ever get their hands on non-public information or are they just strictly working off of what\'s public, the annual report, the financial statements and so forth?"}, {"ja": "Jacob: この点についてどう考えますか。", "en": "Jacob: But what are your thoughts and comments on that?"}, {"ja": "Luana: もちろんです。そして非常に重要な質問です。株式調査アナリストは非公開情報を得ようとしていると思われがちですが、実際にはそうではありません。", "en": "Luana: Sure, and it\'s a very important question because sometimes we think that the equity research, the equity analyst is really trying to get the private information and that\'s not really the case."}, {"ja": "Luana: もし非公開情報を入手した場合、FINRA認定の株式調査アナリストとしてはレポート作成などの対応が必要になります。", "en": "Luana: Once you get a hold of private information, you as an equity research certified by FINRA, you have to write a report."}, {"ja": "Jacob: 誰の認定ですか。", "en": "Jacob: Certified by who?"}, {"ja": "Jacob: FINRAですか。", "en": "Jacob: FINRA?"}, {"ja": "Luana: はい、FINRAです。", "en": "Luana: FINRA, right."}, {"ja": "Luana: FINRAは金融業界規制機構（Financial Industry Regulatory Authority）のことです。", "en": "Luana: FINRA is the Financial Industry Regulatory Authority."}, {"ja": "Luana: その非公開情報に対して何らかの対応をしなければなりません。", "en": "Luana: You have to do something with this private information."}, {"ja": "Luana: 通常は勤務先の銀行のコンプライアンス部門に連絡し、自分が非公開情報を認識していることを報告する必要があります。", "en": "Luana: You have to call usually the compliance of the bank you work for to let them know you are aware of a private information."}, {"ja": "Luana: 場合によっては、その非公開情報に関するレポートを作成しなければなりません。", "en": "Luana: You might need to issue a report on the private information."}, {"ja": "Luana: つまり、その背後には包括的な法規制が存在します。", "en": "Luana: So there is an entire legality behind that."}, {"ja": "Luana: 私たちが本当に行おうとしているのは公開情報の分析です。", "en": "Luana: What we try to do since, let\'s say, tell public information."}, {"ja": "Luana: もしすべてが公開情報だけなら、なぜアナリストごとに同じ銘柄に対する見方が異なるのでしょうか。", "en": "Luana: So if everything is just public, why analysts have different views on the same stock?"}, {"ja": "Luana: そこにこそ、『他にどのような公開情報を入手できるか』という微妙な違いがあります。", "en": "Luana: And that\'s where the nuances of what other public information can I get?"}, {"ja": "Luana: 例えば企業は、『今年は生産量が10％増加する見込みです』というガイダンスを出します。", "en": "Luana: Because the company will be providing some guidance of, we expect, let\'s say, our production to grow by 10% this year."}, {"ja": "Luana: まず企業のガイダンスがあります。", "en": "Luana: And, OK, you have the company\'s guidance."}, {"ja": "Luana: 企業が市場に公表しているため、これは公開情報と見なされます。", "en": "Luana: This is considered public information, since the company has announced to the market."}, {"ja": "Luana: その上で、『本当に会社はそれを達成できるのか』を考えることになります。", "en": "Luana: Now, how you can rely on that in the sense of, do you think the company will make it?"}, {"ja": "Luana: そこでカンファレンスへの参加が重要になってきます。", "en": "Luana: That\'s when you start attending conference."}, {"ja": "Luana: だからこそ、業界の人々と話をするようになるのです。もちろん、彼らが市場に公表されていない企業の非公開情報を教えてくれるわけではありませんが、何が起きているのかについて示唆を与えてくれます。", "en": "Luana: That\'s why you start talking to people from the industry and not necessarily they will give you a private information of a company or what they are doing that has not been announced to the market, but they will hint you of what\'s going on."}, {"ja": "Luana: 例えば、以前私が担当していたブラジルに2つの探鉱鉱区を持つ石油会社の話です。", "en": "Luana: Now an example about this back in the days when I was covering an oil company that had two exploration fields in Brazil."}, {"ja": "Luana: その会社は常に石油を発見したと発表していました。", "en": "Luana: And they were always indicated that they had found oil."}, {"ja": "Luana: そして年末には原油の生産を開始する予定だと言っていました。", "en": "Luana: They were about to start exploring pumping barrels at the end of the year."}, {"ja": "Luana: それが当時公開されていた情報でした。", "en": "Luana: And that was the public information out there."}, {"ja": "Luana: しかし株式調査アナリストとしては、それが楽観的すぎるのか、それとも前提として採用すべき情報なのかを調査しなければなりません。", "en": "Luana: Now as an equity analyst, I had to do my research to see, let\'s see if it\'s optimistic or this is the information I should take into account."}, {"ja": "Luana: そこで工夫をするわけです。", "en": "Luana: Then you can be smart enough to."}, {"ja": "Luana: 例えば地震探査会社に話を聞いてみる。", "en": "Luana: Let me talk to seismic companies."}, {"ja": "Luana: 探鉱における地震探査がどのように行われているのか調べてみる。", "en": "Luana: Let me see how exploration is seismic work."}, {"ja": "Luana: その会社が「生産開始の準備ができている」と言っている地域で、実際に探査活動が行われているか確認してみる。", "en": "Luana: It\'s going on in that area where this company told me that they are ready to start pumping barrels."}, {"ja": "Luana: あるいは、会社がアナリスト向けではなく技術的な説明を行うカンファレンスに参加してみる。", "en": "Luana: Let me attend a conference where the company is presenting more of their technology and not really talking to analysts."}, {"ja": "Luana: そうすることで、より多くの情報や変数を分析に組み込み、数値を見直していくのです。", "en": "Luana: And with that, you start kind of putting more information, more variables into your equation and rehashing numbers."}, {"ja": "Jacob: かなり大変な作業ですね。", "en": "Jacob: Sounds like a lot of work."}, {"ja": "Jacob: これはCFA試験のようなものですか。株式調査アナリストもCFAを取得するのでしょうか。", "en": "Jacob: Is this similar to the, do the equity analysts take the CFA exam?"}, {"ja": "Luana: はい、株式調査アナリストにとってCFA取得は非常に有益です。", "en": "Luana: Yes, it\'s always good for an equity analyst to take the-"}, {"ja": "Jacob: それが主要な基礎資格なのですか。", "en": "Jacob: Is the main foundation?"}, {"ja": "Luana: はい、それが主要な基礎資格です。", "en": "Luana: Yes, that is the main foundation."}, {"ja": "Luana: また、株式調査アナリストにはSEC関連の必須試験もあります。", "en": "Luana: We have, as equity analysts, you have some exams that are mandatory by the SEC."}, {"ja": "Luana: 米国市場であればSEC、その他の国ではそれぞれの規制当局の要件があります。", "en": "Luana: SEC, you are in the US markets, and other regulations when you are in other countries."}, {"ja": "Luana: そのため、証券取引所や各国の規制当局に対する何らかの資格や登録が必要になります。", "en": "Luana: So you have to have some type of credential with the stock exchange and the regulatory entity of that country."}, {"ja": "Luana: これらは必須です。", "en": "Luana: And these are mandatory."}, {"ja": "Luana: 一方でCFAは必須ではありませんが、キャリアを大きく発展させる助けになります。", "en": "Luana: And the CFA is the good to have that can really take your career further."}, {"ja": "Jacob: 話を聞いていると、米国を離れて国際的に株式分析を行うと、財務モデルや期待収益率、割引率などが変わり、急激に複雑になるように思えます。", "en": "Jacob: So this sounds like it\'s getting exponentially more complicated because I would imagine once you jump out of the U.S. and you\'re analyzing equities on an international basis, I would imagine the financial models change, the returns change, the discount rates probably different, et cetera."}, {"ja": "Jacob: 例えばSaudi Aramcoのように国際的に事業を展開し、ニューヨーク証券取引所で取引されている企業を考えるとどうでしょう。", "en": "Jacob: So not only that, but you take a company like Saudi Aramco that\'s doing business on an international basis that is traded on the New York Stock Exchange."}]}, {"id": "default-23", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part3", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Jacob: かなり複雑そうですが、国際的な要素を扱う際にはどのような調整が必要になりますか。", "en": "Jacob: This sounds pretty complicated, but what adjustments do you have to make when you\'re dealing with changes internationally?"}, {"ja": "Luana: はい。", "en": "Luana: Yeah."}, {"ja": "Luana: おっしゃる通りです。", "en": "Luana: And you\'re absolutely right."}, {"ja": "Luana: 企業がグローバルに事業展開している場合、その企業の財務モデルやバリュエーションは間違いなくより手間がかかります。", "en": "Luana: Whenever a company has this global footprint, the valuation of this company to do a financial model, it\'s definitely more laborious."}, {"ja": "Luana: 最大の理由は為替レートの影響です。例えばSaudi Aramcoがサウジアラビア国内だけでなく海外でも事業を行っている場合を考えてみてください。", "en": "Luana: And the main reason is the effects, the exchange rate, because let\'s say if a company like Saudi Aramco is doing business in Saudi, but also doing, then they\'re going to be dealing with the exchange rate in Saudi."}, {"ja": "Luana: ExxonやChevronも同様に世界中で事業を行っています。", "en": "Luana: The company, for example, Exxon or Chevron, they are all over the world as well."}, {"ja": "Luana: こうした企業はドル建て収入を持っています。", "en": "Luana: Now this company has income in dollars."}, {"ja": "Luana: 同時にブラジルレアル建てやアルゼンチンペソ建ての収入も持っています。", "en": "Luana: This company will have income in reais, which is the exchange rates in Pesos, in Argentinian Pesos."}, {"ja": "Luana: するとモデルには新たな複雑性、つまり為替レート予測が加わります。", "en": "Luana: How to actually have, now you are adding a complication to your model, which is the forecast of exchange rates."}, {"ja": "Luana: そのため株式調査アナリストは銀行のエコノミストと良好な関係を持つ必要があります。", "en": "Luana: And that really demands the equity analysts to have a good relationship with the economists of the bank."}, {"ja": "Luana: 何よりも重要なのはそこです。", "en": "Luana: More than anything,"}, {"ja": "Jacob: どこの銀行のエコノミストですか。", "en": "Jacob: Economists of which bank?"}, {"ja": "Luana: 自分が所属している銀行のエコノミストです。", "en": "Luana: With the bank they are working for."}, {"ja": "Luana: 例えばRaymond Jamesでは社内エコノミストがおり、様々な為替レートの予測を提供してくれました。為替は企業価値評価に非常に大きな影響を与えるからです。", "en": "Luana: So for example, my days with Raymond James, we had an economist in-house that would provide us with forecasts of different exchange rates because and that can have a very big impact in valuations."}, {"ja": "Jacob: どうやって計算するのか考えるだけで頭がくらくらします。", "en": "Jacob: My head is spinning trying to figure out how to calculate that."}, {"ja": "Jacob: 入力項目が非常に多そうですね。", "en": "Jacob: It sounds like there\'s so many inputs."}, {"ja": "Jacob: あなたの秘密のスプレッドシートには、どれくらいの入力項目があるのですか。", "en": "Jacob: How many inputs here are we talking about in your secret spreadsheet?"}, {"ja": "Luana: 本当にたくさんありますよ、Jacob。",
