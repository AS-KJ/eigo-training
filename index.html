const STORAGE_KEY = 'eigo_custom_articles';
function loadCustom() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
function saveCustom(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function allArticles() { return [...DEFAULT_ARTICLES, ...loadCustom()]; }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showList() { buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); } showScreen('screen-list'); }

function buildList() {
  const all = allArticles();
  const el = document.getElementById('article-list');
  el.innerHTML = '';
  all.forEach((art, idx) => {
    const card = document.createElement('div');
    card.className = 'article-card';
    const numEl = art.isDefault
      ? '<div class="article-num">' + (idx+1) + '</div>'
      : '<div class="article-num custom">✎</div>';
    const delBtn = art.isDefault ? '' : '<button class="delete-btn" onclick="deleteArt(event,\'' + art.id + '\')">削除</button>';
    card.innerHTML = numEl +
      '<div class="article-card-tap" onclick="startPractice(' + idx + ')">' +
        '<div class="article-info">' +
          '<div class="article-topic">' + esc(art.topic || '') + '</div>' +
          '<div class="article-title">' + esc(art.title) + '</div>' +
          '<div class="article-meta">' + esc(art.source || '') + (art.source ? ' · ' : '') + art.pairs.length + '文</div>' +
        '</div>' +
        '<div class="article-arrow">›</div>' +
      '</div>' + delBtn;
    el.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.innerHTML = '<span style="font-size:22px">＋</span><span>新しい記事を追加</span>';
  addCard.onclick = () => openEdit(null);
  el.appendChild(addCard);
}

function deleteArt(e, id) {
  e.stopPropagation();
  if (!confirm('この記事を削除しますか？')) return;
  saveCustom(loadCustom().filter(a => a.id !== id));
  buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); }
}

// ===== OCR =====
let ocrImageBase64 = null;
let ocrImageType = 'image/jpeg';

function onImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    ocrImageBase64 = dataUrl.split(',')[1];
    ocrImageType = file.type || 'image/jpeg';
    const preview = document.getElementById('ocr-preview');
    preview.src = dataUrl;
    preview.style.display = 'block';
    document.getElementById('ocr-run-btn').style.display = 'block';
    document.getElementById('ocr-status').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function runOcr() {
  if (!ocrImageBase64) return;
  const statusEl = document.getElementById('ocr-status');
  const runBtn = document.getElementById('ocr-run-btn');
  statusEl.style.display = 'block';
  statusEl.style.color = '#888';
  statusEl.textContent = '画像を解析中です。しばらくお待ちください...';
  runBtn.disabled = true;

  const apiKey = localStorage.getItem('eigo_api_key') || '';
  if (!apiKey) {
    statusEl.textContent = 'APIキーが設定されていません。右上の ⚙ APIキー設定 から入力してください。';
    statusEl.style.color = '#cc0033';
    runBtn.disabled = false;
    return;
  }

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 8192,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: ocrImageType, data: ocrImageBase64 }
            },
            {
              type: 'text',
              text: `この画像は日本語記事と英語記事が左右または上下に並んだ新聞・雑誌の画像です。
和文（日本語）と英文（英語）を一文ずつ対応させて抽出してください。
必ず以下のJSON形式のみで返してください。前後に説明文は不要です。

{
  "topic": "英語のトピック名（英文見出しから抽出）",
  "title": "日本語タイトル（和文見出しから抽出）",
  "source": "出典（紙名と日付、画像から読み取れる場合のみ）",
  "pairs": [
    {"ja": "和文1文目", "en": "英文1文目"},
    {"ja": "和文2文目", "en": "英文2文目"}
  ]
}`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'APIエラー');

    const text = data.content[0].text.trim();
    const clean = text.replace(/^```json\s*/,'').replace(/\s*```$/,'');
    const parsed = JSON.parse(clean);

    // フォームに反映
    document.getElementById('f-topic').value = parsed.topic || '';
    document.getElementById('f-title').value = parsed.title || '';
    document.getElementById('f-source').value = parsed.source || '';
    document.getElementById('pairs-list').innerHTML = '';
    pairSeq = 0;
    (parsed.pairs || []).forEach(p => addPair(p.ja, p.en));

    statusEl.textContent = parsed.pairs.length + '文を抽出しました。内容を確認して保存してください。';
    statusEl.style.color = '#0f6e56';
  } catch(e) {
    statusEl.textContent = 'エラーが発生しました: ' + e.message;
    statusEl.style.color = '#cc0033';
  }
  runBtn.disabled = false;
}

// ===== 追加・編集 =====
let editingId = null;
let pairSeq = 0;

function openEdit(id) {
  editingId = id;
  pairSeq = 0;
  ocrImageBase64 = null;
  document.getElementById('edit-title').textContent = id ? '記事を編集' : '記事を追加';
  document.getElementById('f-topic').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-source').value = '';
  document.getElementById('pairs-list').innerHTML = '';
  document.getElementById('ocr-preview').style.display = 'none';
  document.getElementById('ocr-run-btn').style.display = 'none';
  document.getElementById('ocr-status').style.display = 'none';
  document.getElementById('ocr-input').value = '';
  if (id) {
    const art = loadCustom().find(a => a.id === id);
    if (art) {
      document.getElementById('f-topic').value = art.topic || '';
      document.getElementById('f-title').value = art.title;
      document.getElementById('f-source').value = art.source || '';
      art.pairs.forEach(p => addPair(p.ja, p.en));
    }
  } else { addPair(); }
  showScreen('screen-edit');
}

function addPair(ja='', en='') {
  const n = ++pairSeq;
  const div = document.createElement('div');
  div.className = 'pair-item';
  div.id = 'pair-' + n;
  div.innerHTML =
    '<div class="pair-header"><span class="pair-num-label">' + n + '文目</span><button class="pair-del-btn" onclick="removePair(' + n + ')">削除</button></div>' +
    '<div class="pair-row"><label>和文</label><textarea id="pja-' + n + '" rows="2" placeholder="日本語の文を入力">' + esc(ja) + '</textarea></div>' +
    '<div class="pair-row"><label>英文</label><textarea id="pen-' + n + '" rows="2" placeholder="English sentence">' + esc(en) + '</textarea></div>';
  document.getElementById('pairs-list').appendChild(div);
  div.querySelectorAll('textarea').forEach(ta => {
    const resize = () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
    ta.addEventListener('input', resize);
    setTimeout(resize, 10);
  });
}

function removePair(n) { const el = document.getElementById('pair-'+n); if (el) el.remove(); }

function saveArticle() {
  const topic = document.getElementById('f-topic').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const source = document.getElementById('f-source').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  const pairs = [];
  document.querySelectorAll('.pair-item').forEach(item => {
    const n = item.id.replace('pair-','');
    const ja = (document.getElementById('pja-'+n)||{}).value||'';
    const en = (document.getElementById('pen-'+n)||{}).value||'';
    if (ja.trim()||en.trim()) pairs.push({ja:ja.trim(), en:en.trim()});
  });
  if (!pairs.length) { alert('対訳ペアを1つ以上追加してください'); return; }
  const list = loadCustom();
  if (editingId) {
    const i = list.findIndex(a => a.id===editingId);
    if (i>=0) list[i] = {...list[i], topic, title, source, pairs};
  } else {
    list.push({id:'c-'+Date.now(), topic, title, source, isDefault:false, pairs});
  }
  saveCustom(list);
  showList();
}

// ===== 練習 =====
let practiceArt = null;
let sentIdx = 0;
let revealed = false;

function startPractice(idx) {
  practiceArt = allArticles()[idx];
  sentIdx = 0; revealed = false;
  renderPractice();
  showScreen('screen-practice');
}

function renderPractice() {
  const p = practiceArt.pairs[sentIdx];
  const pct = ((sentIdx+1)/practiceArt.pairs.length*100).toFixed(0);
  document.getElementById('practice-title').textContent = practiceArt.title;
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('counter').textContent = (sentIdx+1)+' / '+practiceArt.pairs.length;
  document.getElementById('ja-text').textContent = p.ja;
  document.getElementById('btn-prev').disabled = sentIdx===0;
  document.getElementById('btn-next').disabled = sentIdx===practiceArt.pairs.length-1;
  revealed = false;
  renderEn();
}

function renderEn() {
  const p = practiceArt.pairs[sentIdx];
  const el = document.getElementById('en-content');
  const btn = document.getElementById('btn-reveal');
  if (revealed) {
    el.innerHTML = '<div class="en-revealed">'+esc(p.en)+'</div>';
    btn.textContent = '隠す';
  } else {
    el.innerHTML = '<div class="en-placeholder"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#bbb" stroke-width="1.2"/><path d="M8 5v4M8 11v.5" stroke="#bbb" stroke-width="1.4" stroke-linecap="round"/></svg>タップして英文を表示</div>';
    btn.textContent = '英文を見る';
  }
}

function toggleEn() { revealed=!revealed; renderEn(); }
function next() { if(sentIdx<practiceArt.pairs.length-1){sentIdx++;renderPractice();} }
function prev() { if(sentIdx>0){sentIdx--;renderPractice();} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); }
</script>
