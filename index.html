タルかの選択を教委任せにして、学力格差が生じないか心配だ。", "en": "This marks a major transition in learning. The government has long safeguarded an environment where all students in compulsory education receive a certain standard of education uniformly across the country. It is concerning that leaving the choice between paper and digital up to boards of education might lead to disparities in academic achievement.\\""}, {"ja": "文部科学省は10日、デジタル教科書の発行や選定、使い方を議論する有識者会議を開いた。今秋をめどに指針を策定するという。", "en": "The Education, Culture, Sports, Science and Technology Ministry on Friday held a meeting of experts to discuss the publication, selection and use of digital textbooks. It is said to be aiming to formulate guidelines by this autumn.\\""}, {"ja": "これに対して、文化人らで作る「活字の学びを考える懇談会」（浅田次郎会長）は、デジタル化を危惧する提言を発表している。", "en": "In response, a group of cultural figures and others who discuss learning with printed materials, chaired by Jiro Asada, has released a proposal voicing concerns about digitization.\\""}, {"ja": "言語脳科学が専門の酒井邦嘉・東京大教授は「言葉の力と考える力が衰え、すべての教科で学力低下が懸念される」と訴える。", "en": "University of Tokyo Prof. Kuniyoshi Sakai, who specializes in language neuroscience, gave a warning, saying, \\"It is feared that linguistic skills and the ability to think will weaken, leading to a deterioration in academic performance across all subjects.\\"\\""}, {"ja": "歌人の俵万智さんは「紙の教科書が不便だと思ったことは一度もない。デジタルに使うお金があるなら、先生方の給料を上げたほうがいい」と提案している。", "en": "Poet Machi Tawara said: \\"I have never once found paper textbooks inconvenient. If there\'s a budget for going digital, it would be better to use it to raise teachers\' salaries.\\"\\""}, {"ja": "指針作りを進める文科省は、真摯（しんし）に耳を傾けるべきだ。「利用ありき」ではなく、負の側面も考慮した慎重な議論が必要だ。", "en": "The ministry, which is proceeding with formulating the guidelines, should sincerely listen to these concerns. Rather than holding discussions on the premise that digital materials will be used, a cautious debate is necessary that also considers the negative aspects.\\""}, {"ja": "デジタルには動画や音声を活用できる利点があるが、深い思考や記憶の定着には紙の方が優位だとされる。このため海外では、紙に回帰する動きが始まっている。教科や学年を問わず、むやみに多用することは避けなければならない。", "en": "While digital formats have the advantage of incorporating videos and audio materials, paper textbooks are considered more effective for fostering deep thinking and memory retention. As a result, there is a movement overseas to return to paper. Regardless of subject or grade level, digital textbooks should not be used extensively without careful consideration.\\""}, {"ja": "特に、デジタルの使用を開始する学年には留意する必要がある。小学校低学年については、認知処理能力の未熟さが指摘されている。情報量の多い端末を見て、操作するのは負担が大きい。使うのは紙の教科書だけにすべきだ。", "en": "Particular attention must be paid to the grade level at which students begin using digital materials. It has been pointed out that pupils in the lower grades of elementary school have immature cognitive processing abilities. Viewing and operating devices with large amounts of information places a significant burden on them. They should be limited to using only paper textbooks.\\""}, {"ja": "子供たちはすでに、学校以外でも「デジタル漬け」になっている。海外では、心身に悪影響があるとして、未成年者のSNS利用を規制する国が相次いでいる。", "en": "Children are already immersed in digital media outside of school. Regulations are being introduced in one country after another to restrict minors\' use of social media due to concerns about adverse effects on their physical and mental health.\\""}, {"ja": "政府はデジタル化の遅れを挽回したいのだろうが、デジタル化が急務なのは行政システムやビジネスの現場であろう。子供たちの授業だとは到底思えない。", "en": "While the government likely wishes to make up for its delay in digitization, the settings in which digitization is urgently needed are administrative systems and workplaces. But certainly not children\'s classrooms.\\""}]}, {"id": "default-16", "topic": "U.S.-Iran talks", "title": "停戦崩さず外交努力を尽くせ", "source": "読売新聞 2026年4月14日", "isDefault": true, "pairs": [{"ja": "戦闘終結に向けた米国とイランの協議が、成果なく終わったのは残念でならない。原油輸送の要衝であるホルムズ海峡の封鎖の解除に向けた展望も開けなかった。", "en": "It is deeply regrettable that the U.S.-Iran talks, which were aimed at ending the fighting, have ended without any results. No prospects have emerged for lifting the blockade of the Strait of Hormuz, a strategic point for transporting crude oil.\\""}, {"ja": "このままでは、残り約1週間の停戦が崩れかねない。米国とイランは互いに攻撃を控え、戦闘の完全な終結に向けた外交努力を尽くす必要がある。", "en": "If the situation continues, the ceasefire — which is set to remain in place for one more week — could collapse. The United States and Iran must refrain from attacking each other and exhaust all diplomatic efforts in order to completely end the fighting.\\""}, {"ja": "米、イランの協議は仲介国パキスタンの首都イスラマバードで開かれ、米国のバンス副大統領、イランのガリバフ国会議長らが出席した。両国が1979年のイラン革命で国交を断絶して以来、最高位の対面での接触となった。", "en": "The U.S.-Iran talks were held in Islamabad, the capital of Pakistan, which served as the mediator, and attended by U.S. Vice President JD Vance and Iranian Parliament Speaker Mohammad Bagher Ghalibaf, among others. This marked the highest-level in-person interaction between the two countries since they severed diplomatic relations following the 1979 Iranian Revolution.\\""}, {"ja": "だが、焦点だったホルムズ海峡における航行の安全確保や、イランの核開発を巡り、双方の立場の隔たりは埋まらなかった。", "en": "However, the two sides could not bridge their differences on key issues such as ensuring safe navigation in the Strait of Hormuz and Iran\'s nuclear development.\\""}, {"ja": "トランプ米大統領は協議後、イランが交渉に戻ってくるとの見方を示した。ガリバフ氏は「理屈には理屈で対処する」と表明した。協議継続か決裂かの岐路にあるが、両国とも話し合いによる事態打開の方針を堅持すべきだ。", "en": "Following the talks, U.S. President Donald Trump expressed the view that Iran would return to the negotiating table. Ghalibaf said, \\"If you come forward with logic, we will deal with logic.\\" While the negotiations are at a crossroads between continuing and breaking down, both countries should stick to the policy of resolving the situation through dialogue.\\""}, {"ja": "ホルムズ海峡を巡っては、イランが一方的に管理すると主張し、通過するタンカーなどから通航料を徴収し始めている。", "en": "Regarding the Strait of Hormuz, Iran unilaterally claims control and has begun collecting tolls from tankers and other vessels passing through.\\""}, {"ja": "これに対トランプ氏は、ホルムズ海峡を封鎖するとSNSで宣言し、イランに対抗して米国が海峡の管理に乗り出す考えを示した。イランの港を出入りする船舶の航行を一切認めないという。", "en": "In response, Trump declared on social media that the United States will blockade the strait, indicating that the United States intends to take control of the waterway to counter Iran. Trump said he would not allow any ships going through the strait to enter or exit Iranian ports.\\""}, {"ja": "ホルムズ海峡は、どの国の船舶にも自由な航行が認められている国際海峡だ。通航料を取ったり、管理したりする権限はイランにも米国にもない。", "en": "The Strait of Hormuz is an international waterway where vessels from any country are entitled to free passage. Neither Iran nor the United States has the authority to collect tolls or exercise control over it.\\""}, {"ja": "封鎖のため米軍が艦艇を派遣し、米国とイランの海軍が交戦する事態となった場合、戦闘の長期化が避けられなくなる。", "en": "If the U.S. military dispatches warships to enforce a blockade, leading to a clash between the U.S. and Iranian navies, a prolonged fight would be inevitable.\\""}, {"ja": "これ以上、原油や液化天然ガス（LNG）などエネルギーの調達が滞れば、世界経済はかつてないほどの大混乱に陥りかねない。", "en": "If the supply of crude oil, liquefied natural gas and other such energy resources is further disrupted, the global economy could plunge into unprecedented turmoil.\\""}, {"ja": "強く懸念されるのが、米国とともにイランを攻撃したイスラエルの動向である。", "en": "A cause for major concern is the actions of Israel, which attacked Iran alongside the United States.\\""}, {"ja": "ネタニヤフ政権は、親イラン勢力ヒズボラの基盤であるレバノン南部に加え、首都ベイルートもミサイルなどで激しく攻撃している。米国とイランが2週間の停戦に合意した後でも、300人以上を殺害したとされる。", "en": "The administration of Israeli Prime Minister Benjamin Netanyahu has been using missiles to intensely attack the Lebanese capital of Beirut in addition to southern Lebanon, where the pro-Iranian group Hezbollah is based. More than 300 people have reportedly been killed even after the United States and Iran agreed to a two-week ceasefire.\\""}, {"ja": "米国とイランが停戦しても、イスラエルがレバノンへの攻撃を続けたら、中東の戦火はやまない。トランプ氏はネタニヤフ首相の暴走に歯止めをかけるべきだ。", "en": "Even if the United States and Iran stopped fighting, the war in the Middle East will not end if Israel continues its attacks on Lebanon. Trump must put a stop to Netanyahu\'s reckless actions.\\""}]}, {"id": "default-17", "topic": "Guidelines for life-sustaining treatment", "title": "患者の意思を尊重するために", "source": "読売新聞 2026年4月30日", "isDefault": true, "pairs": [{"ja": "延命治療を望むのか、また、それを行う場合いつまで続けるか。誰にとっても重大な選択だ。", "en": "Whether to seek life-sustaining treatment, and when receiving it, how long to continue it — these are critical decisions for everyone.\\""}, {"ja": "高齢化が進んだ今、一人ひとりが最期にどのような治療を受けたいかを日頃から考え、周囲と意思を共有することが必要になっている。", "en": "As the population ages, it has now become necessary for each individual to routinely consider what kind of treatment they wish to receive at the end of their life and to share their wishes with those around them.\\""}, {"ja": "日本集中治療医学会など4学会が、延命治療に関する指針を近く改定する。", "en": "Four medical societies, including the Japanese Society of Intensive Care Medicine, are set to revise their guidelines on life-sustaining treatment in the near future.\\""}, {"ja": "延命治療を終えるかどうかを判断する場合の手順を、丁寧に示すものだ。", "en": "The revision is intended to provide detailed procedures for determining whether to discontinue life-sustaining treatment.\\""}, {"ja": "延命治療の中止を巡っては、医師が殺人容疑で警察の捜査を受けるケースが相次いだ。", "en": "In the past, there were a number of cases in which doctors were investigated by the police on suspicion of murder in connection with the discontinuation of life-sustaining treatment.\\""}, {"ja": "こうした事態を背景として、現行の指針は2014年に医療現場が判断しやすいように定められた。", "en": "Against this background, the current guidelines were established in 2014 to make it easier for medical professionals to make such decisions.\\""}, {"ja": "この指針は、人生の最終段階にある「終末期」の患者を対象に位置づけ、目安として「診断後1〜3日以内の死亡が予測される場合」と例示している。", "en": "These guidelines classified patients in the \\"terminal phase\\" of life as candidates for the discontinuation of life-sustaining treatment, citing as examples cases in which death is predicted to occur within two to three days.\\""}, {"ja": "だがその後、医療が進歩し、重篤な患者も人工呼吸器などを使って生命を維持できるようになった。このため、現行の指針は実際に合わなくなった。", "en": "However, medical advances since then have made it possible to sustain the lives of critically ill patients using medication and devices such as ventilators. Consequently, the current guidelines no longer reflect the reality.\\""}, {"ja": "改定案では、延命治療を始める際に患者側と医療関係者が話し合って期限を決める方法も提示した。", "en": "The draft revision also proposes as a new option a method in which the patient\'s side and medical professionals discuss and decide the timing to discontinue life-sustaining treatment when initiating it.\\""}, {"ja": "治療中に回復の見通しが立てば継続し、そうでなければ打ち切りを検討するという考え方だ。", "en": "The idea is that treatment would continue if there is a prospect of recovery during the course of treatment, and if not, ending it would be considered.\\""}, {"ja": "結論を急がずに患者や家族が気持ちを整理し、容体を見極めた上で判断する試みと言えるだろう。", "en": "This can be seen as an attempt to allow patients and their families to come to terms with their feelings and make a decision after carefully assessing the patient\'s condition, without rushing to a conclusion.\\""}, {"ja": "医師は患者の尊厳を守り、家族に丁寧に説明してもらいたい。", "en": "It is hoped that doctors will uphold the patient\'s dignity and provide thorough explanations to their family.\\""}, {"ja": "今回の改定に対し、日常的に人工呼吸器などを使っている難病患者の中には、自分が望まない形で、家族や医師の判断で治療を中止されてしまうのではないか、と心配する人もいる。", "en": "In response to this revision, some people, mainly patients with intractable diseases who rely on ventilators and other medical devices on a daily basis, are worried that, even if they wish to continue living, treatment might be discontinued based on the decisions of others including their families or doctors.\\""}, {"ja": "医療現場では、延命治療を一度始めると、治療を続けざるを得なくなるケースが多い。中止すれば命が失われてしまうためだ。", "en": "In medical settings, once life-sustaining treatment begins, there is often no option but to continue treatment. This is because discontinuing treatment would result in the loss of life.\\""}, {"ja": "本人が求めていないのに、苦痛を伴う延命治療が続いてしまうとしたら望ましいことではない。", "en": "It is undesirable for life-sustaining treatment that causes suffering to continue when the patient does not want it.\\""}, {"ja": "改定案は、延命治療を終えるかどうかを判断する際には、患者の意思を尊重することを原則に掲げる。", "en": "According to the draft revision, respecting a patient\'s wishes is the first principle when ending life-sustaining treatment.\\""}, {"ja": "本人に意識がなく、意思を確認できない時は、医師と家族が協議を重ね、患者にとって最善策をとるよう求めるという。", "en": "If the patient is unconscious and their wishes cannot be ascertained, the draft calls for doctors, family members and others to discuss the matter thoroughly and take the best course of action for the patient.\\""}, {"ja": "延命治療に関して判断する際には、医療関係者は、患者が納得のいく意思決定ができるよう支援してほしい。", "en": "When making decisions regarding life-sustaining treatment, medical professionals should provide support to ensure that patients and their families can make decisions that are acceptable to them.\\""}]}, {"id": "default-18", "topic": "3 security documents", "title": "戦い方の変化にも対応が必要", "source": "読売新聞 2026年4月28日", "isDefault": true, "pairs": [{"ja": "日本を取り巻く安全保障環境はかつてないほど厳しさを増している。", "en": "The security environment surrounding Japan is becoming more severe than ever before.\\""}, {"ja": "また、無人機（ドローン）などを使った新しい戦い方にも対処せねばならない。そうした状況に対応するための防衛力のさらなる強化に必要な財源をどう確保するか。", "en": "Japan also has to deal with new methods of warfare, including those involving the use of unmanned aerial vehicles, commonly known as drones. How can the necessary funding be secured to further strengthen the nation\'s defense capabilities in response to these circumstances?\\""}, {"ja": "政府は、有識者の意見を踏まえ、アジア全体の平和と安全を守るための課題を整理し、実行に移す体制を整えることが重要だ。", "en": "It is essential for the government to identify challenges involved in safeguarding peace and safety in the entire Asian region, and to establish a framework to translate these challenges into actions, based on the opinions of experts.\\""}, {"ja": "政府は年末までに、安全保障政策の基本方針を定めた国家安全保障戦略や、2023年度から5年間の防衛費を明記した防衛力整備計画など、安保3文書を改定する予定だ。そのあり方について議論する有識者会議が初会合を開いた。", "en": "By the end of the year, the government plans to revise three security documents, including the National Security Strategy, which sets forth the basic security policy, and the Defense Buildup Program, which specifies defense spending for the five years that started in fiscal 2023. A panel of experts tasked with discussing how the documents should be revised has held its first meeting.\\""}, {"ja": "22年末に改定された現在の3文書は、中国や北朝鮮のミサイルへの対処力を高めるため、反撃能力の保有などを明記した。防衛費は5年間で43兆円と定めた。", "en": "The current documents, which were revised at the end of 2022, explicitly state the need to possess counterattack and other capabilities to enhance Japan\'s ability to deal with missiles from China and North Korea. Defense spending was set at ¥43 trillion over five years.\\""}, {"ja": "だがその後も、中国は軍事力を増強し続けている。太平洋に空母を展開し、訓練を繰り返すようになった。ロシアと北朝鮮は軍事協力を深めている。", "en": "Since then, however, China has continued to build up its military capabilities. It has begun deploying aircraft carriers in the Pacific and has repeatedly conducted military exercises. Russia and North Korea are deepening their military cooperation.\\""}, {"ja": "4年前に比べて、安保環境が悪化しているのは明白だ。3文書の改定を前倒して脅威に備えるのは妥当である。改定に向けた議論で焦点となるのは、新たな戦い方への対処だ。", "en": "It is clear that the security environment has deteriorated compared to the situation four years ago. It is appropriate for the government to advance the revision of the three documents to be prepared for these threats. The focus of the discussions leading up to the revisions is how to deal with new methods of warfare.\\""}, {"ja": "イランは米国とイスラエルの攻撃に対抗し、安価なドローンを大量に投入している。", "en": "Iran is deploying large numbers of low-cost drones to counter attacks by the United States and Israel.\\""}, {"ja": "現在、日本には、戦闘で使用できるだけのドローンを製造する基盤がない。高性能なドローンを調達するため、防衛企業の育成を急ぐことが肝だ。", "en": "Currently, Japan lacks the foundation to produce drones that can be used in combat. It is essential for the government to help rapidly foster defense companies in order to procure high-performance drones.\\""}, {"ja": "ロシアの侵略を受けるウクライナは、常に武器の不足に直面している。継戦能力の維持はどの国にとっても重い課題だ。", "en": "Ukraine, which is being subjected to Russia\'s aggression, constantly faces a shortage of weapons. Maintaining combat sustainability is a significant challenge for any country.\\""}, {"ja": "政府は防衛装備移転3原則とその運用指針を改め、殺傷能力のある装備品の輸出に道を開いた。", "en": "The government has revised the Three Principles on Transfer of Defense Equipment and Technology and their operational guidelines, paving the way for the export of lethal defense equipment.\\""}, {"ja": "海外に販路を拡大し、同志国との相互協力の体制を構築する意義は大きい。そうした取り組みを通じて国内の生産能力が向上させられれば、継戦能力も高まる。", "en": "Expanding sales channels overseas and establishing a framework for mutual cooperation with like-minded nations is extremely important for Japan. If domestic production capacity can be improved through such steps, the nation\'s combat sustainability will also be enhanced.\\""}, {"ja": "企業が円滑に装備品を輸出するには、政府の後押しが欠かせない。価格交渉などに国が関与することも視野に入れてはどうか。", "en": "Government support is essential for companies to export defense equipment smoothly. Perhaps government involvement in such matters as price negotiations should be considered.\\""}, {"ja": "今後、防衛費を含む安保関連経費をどの程度積み増すかも、有識者会議で議論するテーマだ。防衛力の強化には恒久的な財源が必要だ。安易な国債依存や一過性のやり繰りでは済まされない。政府は恒久財源の確保へ正面から国民に理解を求めるべきだ。", "en": "Going forward, the extent to which security-related expenditures, including defense spending, should be increased will also be a topic of discussion at the expert panel. Enhancing defense capabilities requires permanent fiscal resources. There should not be a casual reliance on government bonds, nor should stopgap measures be used. The government should directly seek the public\'s understanding regarding the securing of permanent fiscal resources.\\""}]}, {"id": "default-19", "topic": "Gun attack in U.S. capital", "title": "政治への暴力連鎖を憂慮する", "source": "読売新聞 2026年4月28日", "isDefault": true, "pairs": [{"ja": "トランプ米大統領が、今度は首都ワシントンで銃の脅威にさらされた。米国で政治への凶行が相次ぎ、自由な言論や民主主義を脅かしている事態を深く憂慮する。", "en": "U.S. President Donald Trump faced the threat of gun violence again; this time it happened in Washington, the U.S. capital. It is deeply concerning that atrocious acts against politics have occurred in the United States one after another, threatening free speech and democracy.\\""}, {"ja": "ワシントン中心部のホテルで開かれていた米ホワイトハウス記者会主催の夕食会の会場近くで、男が発砲した。男はその場で拘束されたが、出席していたトランプ氏やバンス副大統領らは退席を余儀なくされた。", "en": "A man opened fire near the ballroom of a hotel in central Washington during a dinner hosted by the White House Correspondents\' Association. The man was apprehended at the scene, but Trump, U.S. Vice President JD Vance and other guests in attendance were forced to evacuate.\\""}, {"ja": "米国や世界の行方に重大な影響力を持つ米政権幹部が勢ぞろいしていた場に、銃口が迫っていた事実には驚愕（しんかん）させられる。", "en": "It is shocking that such an attack occurred so close to a gathering of senior U.S. administration officials who wield significant influence over the future of the United States as well as the world.\\""}, {"ja": "米メディアによると、男は犯行前に家族に送った声明で、政権幹部を「最高位から順に標的」にすると記していた。トランプ氏が含まれていたとみられる。", "en": "According to U.S. media reports, in a statement sent to his family before his attack, the man wrote that he would target administration officials, \\"from highest-ranking to lowest.\\" It is believed that he included Trump as a target.\\""}, {"ja": "米軍のカリブ海での麻薬密輸船攻撃や、イランの小学校への空爆などにも触れ、トランプ政権への強い不満を示していたという。", "en": "The man had reportedly shown strong dissatisfaction with the Trump administration, mentioning incidents such as the U.S. military\'s attacks on drug-trafficking vessels in the Caribbean and the airstrike on an elementary school in Iran.\\""}, {"ja": "いかなる動機であろうとも、政治を暴力で踏みにじろうとする企ては、断じて許されない。", "en": "Regardless of the motive, any attempt to trample on politics through violence is absolutely unacceptable.\\""}, {"ja": "米国では最近、意見の違う相手を「敵」と決めつけ、力で排除しようとする動きが目立つ。", "en": "Recently in the United States, there has been a noticeable trend of labeling those with differing opinions as enemies and attempting to eliminate them through violence.\\""}, {"ja": "トランプ氏は2期目の大統領に就く前の2024年に2度、暗殺未遂の標的となっている。昨年9月には、トランプ氏に近い保守派の論客が演説中に銃撃され、死亡する事件も起きた。", "en": "Trump was the target of two assassination attempts in 2024, prior to his second term as president. Last September, a conservative political activist who was a key Trump ally was shot and killed while giving a speech.\\""}, {"ja": "凶行はトランプ政権の与党・共和党だけでなく、民主党の政治家らにも及んでいるが、トランプ氏は保守派論客の殺害を「左派の過激派」のせいにするなど、党派対立を自ら煽（あお）ってきた。", "en": "While such atrocious acts have reached members of Trump\'s Republican party, they have also affected Democratic politicians. Trump himself has stirred up partisan division, such as by blaming the killing of the conservative activist on the \\"radical left.\\"\\""}, {"ja": "だが今回の事件後、トランプ氏は米国民に対し、「意見の違いを平和的に解決しよう」と融和を呼び掛けた。11月の米中間選挙に向けて政治的な対立が過熱し、暴力の連鎖が続くことを懸念したとすれば、正しい判断と言える。", "en": "However, after the latest incident, Trump urged the American people to be conciliatory, calling on them to \\"resolve our differences peacefully.\\" If the president made this remark out of concern that political tensions could escalate ahead of the November midterm elections and that the cycle of violence could continue, it can be seen as the right decision.\\""}, {"ja": "まずは大統領自らが国内外の諸課題について、力ではなく話し合いを通じた平和的解決を目指す姿を見せるべきだ。", "en": "First and foremost, Trump himself should demonstrate a commitment to seeking peaceful resolutions through dialogue — rather than force — for domestic and global issues.\\""}, {"ja": "トランプ氏が、政権に批判的なメディアを含むホワイトハウス記者会の招待に応じて夕食会に出席するのは今回が初めてだったが、銃撃事件で打ち切られた。", "en": "This was the first time Trump had accepted an invitation from the correspondents\' association — whose members include media outlets critical of his administration — to attend a dinner. However, the event was cut short because of the attack.\\""}, {"ja": "トランプ氏は、軍事的なイラン攻撃を批判する主要紙報道を「反米フェイクニューズ」と決めつけ、攻撃している。トランプ氏は夕食会を改めて開くよう希望したというが、求められるのはメディアの批判に真摯（しんし）に向き合う姿勢だ。", "en": "Trump has been attacking major newspapers for their reports that criticize the U.S. military\'s strikes on Iran, dismissing their coverage as \\"anti-American fake news.\\" Trump reportedly hopes for the dinner to be held again, but what he needs is to take the position of seriously facing criticism from the media.\\""}]}, {"id": "default-20", "topic": "Appeal of Japanese food", "title": "海外の「気づき」を生かしたい", "source": "読売新聞 2026年4月26日", "isDefault": true, "pairs": [{"ja": "自分でも気がついていない日本食の魅力を、海外が発見する。そのような事例が増えている。", "en": "An increasing number of people overseas have discovered appealing aspects of Japanese food that even Japanese people had not noticed.\\""}, {"ja": "海外での評判を敏感につかんでビジネスにつなげるよう工夫し、日本食の輸出を増やしていきたい。", "en": "Japan should increase exports of its food products by keeping a close eye on their reputation overseas and devising ways to turn this into business opportunities.\\""}, {"ja": "「バブル」と呼ばれるほど世界的に人気を博しているのが、抹茶である。カテキンなどの成分が健康によいとされ、サプリメント感覚で摂取されている。鮮やかな緑色はSNSで見栄えがよく、投稿が相次いでいることも大きい。", "en": "Matcha has seen such global popularity that the craze is being called a bubble. The constituents of matcha, including catechins, are believed to be beneficial to one\'s health, and people abroad often consume it as though it were a dietary supplement. Its vibrant green color is visually appealing on social media, leading people to post images of matcha products, yet another factor fueling the craze.\\""}, {"ja": "芳醇（ほうじゅん）なうまみを生かし、抹茶ラテやデザートなどに使われ、米コーヒーチェーン大手スターバックスでは定番メニューとなった。大谷翔平選手らがヒットのたびに、抹茶を点（た）てるポーズでチームを鼓舞したことも話題を呼んだ。", "en": "Matcha is used in lattes and desserts for its rich flavor, and it has become a staple at Starbucks, the major U.S. coffee chain. Matcha also became a hot topic as Shohei Ohtani and other baseball players fired up their team by pretending to whisk matcha every time they got a hit.\\""}, {"ja": "これまで予想もしなかったエンターテインメント的な人気の呼び方は、日本食の魅力を売り込む上で大きなヒントになるだろう。", "en": "This unexpected way to gain popularity, which resembles something out of the entertainment industry, likely offers a major clue for selling the appeal of Japanese food.\\""}, {"ja": "東南アジアでは、焼き芋が高級スイーツとして人気だ。凍らせてシャーベット状にして食べることがブームというのは、日本人の想像を超えているのではないか。", "en": "In Southeast Asia, roasted sweet potatoes are popular as high-end sweets. The trend of freezing these sweet potatoes and eating them as a sorbet-like treat would probably never occur to most Japanese peop const STORAGE_KEY = 'eigo_custom_articles';
function loadCustom() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
function saveCustom(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function allArticles() { return [...DEFAULT_ARTICLES, ...loadCustom()]; }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function showList() { buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); } showScreen('screen-list'); }

function buildList() {
  const all = allArticles();
  const el = document.getElementById('article-list');
  el.innerHTML = '';
  all.forEach((art, idx) => {
    const card = document.createElement('div');
    card.className = 'article-card';
    const numEl = art.isDefault
      ? '<div class="article-num">' + (idx+1) + '</div>'
      : '<div class="article-num custom">✎</div>';
    const delBtn = art.isDefault ? '' : '<button class="delete-btn" onclick="deleteArt(event,\'' + art.id + '\')">削除</button>';
    card.innerHTML = numEl +
      '<div class="article-card-tap" onclick="startPractice(' + idx + ')">' +
        '<div class="article-info">' +
          '<div class="article-topic">' + esc(art.topic || '') + '</div>' +
          '<div class="article-title">' + esc(art.title) + '</div>' +
          '<div class="article-meta">' + esc(art.source || '') + (art.source ? ' · ' : '') + art.pairs.length + '文</div>' +
        '</div>' +
        '<div class="article-arrow">›</div>' +
      '</div>' + delBtn;
    el.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.innerHTML = '<span style="font-size:22px">＋</span><span>新しい記事を追加</span>';
  addCard.onclick = () => openEdit(null);
  el.appendChild(addCard);
}

function deleteArt(e, id) {
  e.stopPropagation();
  if (!confirm('この記事を削除しますか？')) return;
  saveCustom(loadCustom().filter(a => a.id !== id));
  buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); }
}

// ===== OCR =====
let ocrImageBase64 = null;
let ocrImageType = 'image/jpeg';

function onImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const dataUrl = e.target.result;
    ocrImageBase64 = dataUrl.split(',')[1];
    ocrImageType = file.type || 'image/jpeg';
    const preview = document.getElementById('ocr-preview');
    preview.src = dataUrl;
    preview.style.display = 'block';
    document.getElementById('ocr-run-btn').style.display = 'block';
    document.getElementById('ocr-status').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function runOcr() {
  if (!ocrImageBase64) return;
  const statusEl = document.getElementById('ocr-status');
  const runBtn = document.getElementById('ocr-run-btn');
  statusEl.style.display = 'block';
  statusEl.style.color = '#888';
  statusEl.textContent = '画像を解析中です。しばらくお待ちください...';
  runBtn.disabled = true;

  const apiKey = localStorage.getItem('eigo_api_key') || '';
  if (!apiKey) {
    statusEl.textContent = 'APIキーが設定されていません。右上の ⚙ APIキー設定 から入力してください。';
    statusEl.style.color = '#cc0033';
    runBtn.disabled = false;
    return;
  }

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 8192,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: ocrImageType, data: ocrImageBase64 }
            },
            {
              type: 'text',
              text: `この画像は日本語記事と英語記事が左右または上下に並んだ新聞・雑誌の画像です。
和文（日本語）と英文（英語）を一文ずつ対応させて抽出してください。
必ず以下のJSON形式のみで返してください。前後に説明文は不要です。

{
  "topic": "英語のトピック名（英文見出しから抽出）",
  "title": "日本語タイトル（和文見出しから抽出）",
  "source": "出典（紙名と日付、画像から読み取れる場合のみ）",
  "pairs": [
    {"ja": "和文1文目", "en": "英文1文目"},
    {"ja": "和文2文目", "en": "英文2文目"}
  ]
}`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'APIエラー');

    const text = data.content[0].text.trim();
    const clean = text.replace(/^```json\s*/,'').replace(/\s*```$/,'');
    const parsed = JSON.parse(clean);

    // フォームに反映
    document.getElementById('f-topic').value = parsed.topic || '';
    document.getElementById('f-title').value = parsed.title || '';
    document.getElementById('f-source').value = parsed.source || '';
    document.getElementById('pairs-list').innerHTML = '';
    pairSeq = 0;
    (parsed.pairs || []).forEach(p => addPair(p.ja, p.en));

    statusEl.textContent = parsed.pairs.length + '文を抽出しました。内容を確認して保存してください。';
    statusEl.style.color = '#0f6e56';
  } catch(e) {
    statusEl.textContent = 'エラーが発生しました: ' + e.message;
    statusEl.style.color = '#cc0033';
  }
  runBtn.disabled = false;
}

// ===== 追加・編集 =====
let editingId = null;
let pairSeq = 0;

function openEdit(id) {
  editingId = id;
  pairSeq = 0;
  ocrImageBase64 = null;
  document.getElementById('edit-title').textContent = id ? '記事を編集' : '記事を追加';
  document.getElementById('f-topic').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-source').value = '';
  document.getElementById('pairs-list').innerHTML = '';
  document.getElementById('ocr-preview').style.display = 'none';
  document.getElementById('ocr-run-btn').style.display = 'none';
  document.getElementById('ocr-status').style.display = 'none';
  document.getElementById('ocr-input').value = '';
  if (id) {
    const art = loadCustom().find(a => a.id === id);
    if (art) {
      document.getElementById('f-topic').value = art.topic || '';
      document.getElementById('f-title').value = art.title;
      document.getElementById('f-source').value = art.source || '';
      art.pairs.forEach(p => addPair(p.ja, p.en));
    }
  } else { addPair(); }
  showScreen('screen-edit');
}

function addPair(ja='', en='') {
  const n = ++pairSeq;
  const div = document.createElement('div');
  div.className = 'pair-item';
  div.id = 'pair-' + n;
  div.innerHTML =
    '<div class="pair-header"><span class="pair-num-label">' + n + '文目</span><button class="pair-del-btn" onclick="removePair(' + n + ')">削除</button></div>' +
    '<div class="pair-row"><label>和文</label><textarea id="pja-' + n + '" rows="2" placeholder="日本語の文を入力">' + esc(ja) + '</textarea></div>' +
    '<div class="pair-row"><label>英文</label><textarea id="pen-' + n + '" rows="2" placeholder="English sentence">' + esc(en) + '</textarea></div>';
  document.getElementById('pairs-list').appendChild(div);
  div.querySelectorAll('textarea').forEach(ta => {
    const resize = () => { ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
    ta.addEventListener('input', resize);
    setTimeout(resize, 10);
  });
}

function removePair(n) { const el = document.getElementById('pair-'+n); if (el) el.remove(); }

function saveArticle() {
  const topic = document.getElementById('f-topic').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const source = document.getElementById('f-source').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  const pairs = [];
  document.querySelectorAll('.pair-item').forEach(item => {
    const n = item.id.replace('pair-','');
    const ja = (document.getElementById('pja-'+n)||{}).value||'';
    const en = (document.getElementById('pen-'+n)||{}).value||'';
    if (ja.trim()||en.trim()) pairs.push({ja:ja.trim(), en:en.trim()});
  });
  if (!pairs.length) { alert('対訳ペアを1つ以上追加してください'); return; }
  const list = loadCustom();
  if (editingId) {
    const i = list.findIndex(a => a.id===editingId);
    if (i>=0) list[i] = {...list[i], topic, title, source, pairs};
  } else {
    list.push({id:'c-'+Date.now(), topic, title, source, isDefault:false, pairs});
  }
  saveCustom(list);
  showList();
}

// ===== 練習 =====
let practiceArt = null;
let sentIdx = 0;
let revealed = false;

function startPractice(idx) {
  practiceArt = allArticles()[idx];
  sentIdx = 0; revealed = false;
  renderPractice();
  showScreen('screen-practice');
}

function renderPractice() {
  const p = practiceArt.pairs[sentIdx];
  const pct = ((sentIdx+1)/practiceArt.pairs.length*100).toFixed(0);
  document.getElementById('practice-title').textContent = practiceArt.title;
  document.getElementById('prog').style.width = pct+'%';
  document.getElementById('counter').textContent = (sentIdx+1)+' / '+practiceArt.pairs.length;
  document.getElementById('ja-text').textContent = p.ja;
  document.getElementById('btn-prev').disabled = sentIdx===0;
  document.getElementById('btn-next').disabled = sentIdx===practiceArt.pairs.length-1;
  revealed = false;
  renderEn();
}

function renderEn() {
  const p = practiceArt.pairs[sentIdx];
  const el = document.getElementById('en-content');
  const btn = document.getElementById('btn-reveal');
  if (revealed) {
    el.innerHTML = '<div class="en-revealed">'+esc(p.en)+'</div>';
    btn.textContent = '隠す';
  } else {
    el.innerHTML = '<div class="en-placeholder"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#bbb" stroke-width="1.2"/><path d="M8 5v4M8 11v.5" stroke="#bbb" stroke-width="1.4" stroke-linecap="round"/></svg>タップして英文を表示</div>';
    btn.textContent = '英文を見る';
  }
}

function toggleEn() { revealed=!revealed; renderEn(); }
function next() { if(sentIdx<practiceArt.pairs.length-1){sentIdx++;renderPractice();} }
function prev() { if(sentIdx>0){sentIdx--;renderPractice();} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

buildList();
// APIキー未設定なら設定画面を表示
if(!localStorage.getItem("eigo_api_key")){ setTimeout(function(){ if(sessionStorage.getItem("eigo_auth")==="1") document.getElementById("screen-apikey").style.display="flex"; },300); }
</script>
