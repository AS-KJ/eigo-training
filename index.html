ot really used by private companies very often as valuation tool because the foundation of that is preparing a forecast."}, {"ja": "Jacob: 特にローワー・ミドルマーケットの非公開企業では、予測を作成すること自体が極めて難しいのです。", "en": "Jacob: And preparing a forecast for a privately held company, particularly one in the lower middle market, is incredibly difficult to do."}, {"ja": "Jacob: それなら占い師に頼んで予測を作ってもらうのと大差ないかもしれません。", "en": "Jacob: And you might as well just go to your fortune teller and tell them to prepare it for you."}, {"ja": "Jacob: 公開企業ではどのように予測を作成するのですか。", "en": "Jacob: How do you prepare a forecast for a public company?"}, {"ja": "Jacob: それとも誰かが用意してくれるのでしょうか。", "en": "Jacob: Or is that prepared for you?"}, {"ja": "Jacob: それも公開情報の一部なのですか。", "en": "Jacob: Is that part of the publicly available information?"}, {"ja": "Luana: いいえ、通常は違います。", "en": "Luana: No, usually it\'s not."}, {"ja": "Luana: 通常は自分たちで作成します。", "en": "Luana: Usually we have to prepare ourselves."}, {"ja": "Luana: ですから、もし株式調査アナリストとして一つだけ仕事を選ぶとしたら、それはDCF、つまり割引キャッシュフロー分析になります。", "en": "Luana: So that\'s, I think if I had to do only one thing as an equity research, it would be a DCF, a discounted cash flow."}, {"ja": "Jacob: それがすべての基礎です。", "en": "Jacob: That is the foundation."}, {"ja": "Jacob: もし一つだけ評価手法を選ぶとしたら、ということですか。", "en": "Jacob: If you had to choose one valuation method?"}, {"ja": "Luana: いいえ。もし株式調査アナリストとして最も重要な仕事を一つ挙げるなら、それは企業のDCFを作成することです。", "en": "Luana: No, if I had to do the most important task as an equity research is to get to the discounted cash flow of a company."}, {"ja": "Jacob: それがすべての土台です。", "en": "Jacob: That\'s the entire foundation."}, {"ja": "Luana: 仮にレポートを書く必要も、人に説明する必要もないとしても、株式調査アナリストとして絶対に行わなければならないことが一つあるとすれば、それはDCFです。なぜなら、それによって企業が将来生み出すキャッシュフローを予測できるからです。", "en": "Luana: So let\'s say if I didn\'t have to write a report or to talk, let\'s say there is only one thing that I must do to be an equity research analyst is a discounted cashflow because that\'s where you can predict the amount of cashflow this company will generate in the future."}, {"ja": "Luana: そして、その予測を基に企業価値を評価することができます。", "en": "Luana: And with that, you can assess how much this company value."}, {"ja": "Jacob: 予測をモデルに組み込む評価手法は他にもありますか。", "en": "Jacob: Is there other methods, valuation methods that incorporate the forecast into the model?"}, {"ja": "Jacob: それともDCFだけが予測値を取り込む手法なのでしょうか。", "en": "Jacob: Or is DCF the only one that. includes the forecasted numbers?"}, {"ja": "Luana: いいえ。", "en": "Luana: No."}, {"ja": "Luana: 予測を取り込む手法としてはDCFのほかに配当モデルがあります。", "en": "Luana: So you have DCF to incorporate forecasts and a second method that we incorporate forecasts is the dividend."}, {"ja": "Luana: 成長段階を過ぎたJohnson & JohnsonやWalmartのような安定企業、いわゆるバリュー段階にあり高配当を行う企業であれば、配当額そのものを予測することができます。", "en": "Luana: For companies which are more not in a growth stage anymore, let\'s say more stable companies like Johnson & Johnson, Walmart, these companies that are more in this what we call in their value stage and their high dividends, distributors, that\'s when you can actually just forecast."}, {"ja": "Luana: もちろんキャッシュフロー予測は必要ですが、将来支払われる配当額を予測することも可能です。", "en": "Luana: You will still have to forecast cash flows, but you can just start forecasting what is the amount of dividend payment that they will do."}, {"ja": "Luana: そのほかの評価手法もあります。", "en": "Luana: Now, other methods of valuation, yes, there are other methods."}, {"ja": "Luana: 代表的なものの一つがマルチプル法です。", "en": "Luana: I think one of the main methods that may use it\'s the multiples."}, {"ja": "Luana: 例えばEV（Enterprise Value：企業価値）/ EBITDA倍率です。", "en": "Luana: And that\'s going to be the EV enterprise value to EBITDA."}, {"ja": "Luana: これは非常によく使われる評価手法です。", "en": "Luana: That\'s very normal to see as a method of valuation."}, {"ja": "Luana: 私はDCFの結果が妥当かどうかを確認するためにマルチプルを使うのは好きですが、それでもDCFの方がはるかに優れていると思います。", "en": "Luana: I like multiples to kind of just do a check of if my DCF is more or less aligned, but it\'s so much better when you do a DCF."}, {"ja": "Luana: 私は大のDCF支持者です。", "en": "Luana: I am a very big DCF fan."}, {"ja": "Jacob: 非公開企業のオーナーの方々もご存じだと思いますが、非公開企業の評価ではEBITDA倍率が最も一般的に使われています。", "en": "Jacob: The multiples, I know private company owners hearing this, that\'s the main method that\'s used to value a private company and they\'re used to applying a multiple to their EBITDA."}, {"ja": "Jacob: 一方で公開企業を見ると、通常はPER（株価収益率）が使われます。", "en": "Jacob: But when you go see a public company, we see a PE ratio typically."}, {"ja": "Jacob: 例えばある企業を例にすると、利益とEBITDAの違いはどのようなものでしょうか。", "en": "Jacob: So take any company that you know, what would the difference be between their earnings and the EBITDA typically?"}, {"ja": "Jacob: またPERとEBITDA倍率にはどのような違いがありますか。", "en": "Jacob: And what would be the difference between an earnings, a PE ratio and an EBITDA multiple?"}, {"ja": "Jacob: その差はどの程度大きいのでしょうか。", "en": "Jacob: How wide of a difference are we talking about?"}, {"ja": "Jacob: これは非公開企業のオーナーにとって非常に重要な点です。", "en": "Jacob: Because, and this is really, really important for private company owners, they hear that public companies might be trading at a 20 PE ratio."}, {"ja": "Jacob: 公開企業がPER20倍で取引されていると聞くと、EBITDA500万ドルの会社を持つ経営者は『自社は1億ドルの価値がある』と考えるかもしれません。", "en": "Jacob: So if they\'ve got a company with a $5 million EBITDA, they might say, well, my company\'s worth $100 million or a 20 multiple."}, {"ja": "Jacob: この二つの違いは何でしょうか。", "en": "Jacob: What\'s the difference between the two?"}, {"ja": "Luana: まず結論から言うと、私はPERよりEBITDA倍率の方を好みます。なぜならEBITDAの方が企業の実態をよりよく表しており、本業でどれだけ稼いでいるかを示しているからです。", "en": "Luana: Well, I think that the main difference with, and before getting to the main difference, I prefer the EBITDA multiple versus the PE and that the reason being, I think the EBITDA tells more about a company than the earnings and the EBITDA is really what the company is generating in the core of its business."}, {"ja": "Luana: また、企業同士を比較しやすいという利点もあります。税率の違いなどを考慮しなくて済むからです。", "en": "Luana: And it\'s easier for someone to compare companies in that sense, because then you are not getting to what is the tax rates this company is paying."}, {"ja": "Luana: さらに、企業ごとの財務レバレッジの違いも排除できます。", "en": "Luana: What is the leverage that this company is paying?"}, {"ja": "Luana: 例えば貸借対照表に負債を抱える企業は利息を支払う必要がありますが、その影響はEBITDAの下に現れ、最終利益に到達する前に差し引かれます。", "en": "Luana: Let\'s say if a company holds debt in their balance sheets, they will have to pay interest in this debt and that\'s going to be below EBITDA and will be removed before you get to a company\'s earnings."}, {"ja": "Luana: 例えば非常にレバレッジの高い米国企業と、無借金でブラジルで税金を支払っている企業を比較するとします。", "en": "Luana: You see like whenever you\'re comparing, let\'s say it\'s a very high leverage company and this company is say in the US versus there is a company in Brazil with zero debt and it\'s paying taxes in Brazil."}, {"ja": "Luana: PERを使うと、こうした別の要因が混ざるため、純粋な企業価値比較は難しくなります。", "en": "Luana: If you\'re using PE, you cannot really do a comparison of value since you\'re dealing with other variables."}, {"ja": "Luana: 両者には本質的に異なる要素が存在するからです。", "en": "Luana: There are different intrinsically difference."}, {"ja": "Luana: しかし企業を見る際には、その企業の事業の中核がどのように機能しているのか、事業運営の観点から見ているのです。", "en": "Luana: But when you look at a company, you\'re looking at operationally, the core of its business, how this company is performing."}, {"ja": "Luana: そして企業には成長したり税務を管理したりするさまざまな方法がありますので、もちろんPERを見ることもできますが、EBITDAの方が企業同士の比較は容易になります。なぜなら、本当に比較しているのは事業運営そのものだからです。", "en": "Luana: And then yes, then the company has so many ways of growing or managing their taxes that you can of course look at the PE too, but the EBITDA will make it easier to make comparisons amongst the company because then you\'re really talking about, okay, operational versus operations."}, {"ja": "Jacob: PERは、EBITDAのE、つまり利益を基準にしているのですか。", "en": "Jacob: A PE ratio, is that based on the E in EBITDA, just the earnings?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Jacob: それとも、もう少し複雑なのでしょうか。", "en": "Jacob: Or is it a little more complicated than that?"}, {"ja": "Luana: いいえ、単純に利益です。", "en": "Luana: No, then it\'s just earnings."}, {"ja": "Luana: 別の言い方をすると、そのEは企業の純利益を意味します。", "en": "Luana: Then the E, the other way you can read that it\'s the net income of a company."}, {"ja": "Luana: つまりPERは常に純利益を基準にしているのですね。", "en": "Luana: So PE ratio is always based on the net income."}, {"ja": "Jacob: 利益です、はい。", "en": "Jacob: Income, yes."}, {"ja": "Luana: 失礼しました、EBITDAですね。", "en": "Luana: EBITDA, sorry, yeah."}, {"ja": "Luana: そしてEBITDAのEは、利息・税金・減価償却・償却前利益（Earnings Before Interest, Taxes, Depreciation and Amortization）を意味します。", "en": "Luana: Then EBITDA, you were talking about this E, the earnings before interest, before taxes before depreciation and amortization."}, {"ja": "Jacob: ところで、Saudi Aramcoはライオンやトラを減価償却しているのでしょうか。", "en": "Jacob: I wonder if Saudi Aramco depreciates their lions and tigers, by the way."}, {"ja": "Jacob: それは気になりますね。", "en": "Jacob: You wonder about that."}, {"ja": "Jacob: EBITDAの話になると複雑になります。考慮すべき項目が非常に多いからです。", "en": "Jacob: It gets complicated once you get into EBITDA because there\'s so many things you can..."}, {"ja": "Jacob: 先ほどお話ししたように、利息、税金、減価償却、償却費を見ますし、プライベートエクイティファンドは設備投資（CapEx）も見ます。", "en": "Jacob: You look at interest, like you mentioned, you look at taxes, you look at depreciation, you look at amortization, private equity groups, they start looking at CapEx."}, {"ja": "Jacob: 非公開企業では福利厚生やオーナー特典のような項目も加算していきます。", "en": "Jacob: Private companies, you start looking at. perks and you start adding in the perks."}, {"ja": "Jacob: ですから、単純に聞こえるかもしれませんが、実際には少し複雑なのです。", "en": "Jacob: So as simple as we want to make this sound, it\'s sometimes a little bit more complicated."}, {"ja": "Jacob: あなたはどのような情報を見ているのですか。", "en": "Jacob: What information are you looking at?"}, {"ja": "Jacob: 年次報告書はどの程度役立つのでしょうか。", "en": "Jacob: So how helpful is the annual report?"}, {"ja": "Jacob: 10-K、8-K、財務諸表などです。", "en": "Jacob: 10 Ks, 8 Ks financial statements."}, {"ja": "Jacob: それらすべてを見るのですか。それとも特に重要な情報があるのでしょうか。", "en": "Jacob: Are you looking at all of the above or is some of this stuff juicier than some of the other information?"}, {"ja": "Luana: はい。これらすべての情報は極めて重要です。なぜなら、何の根拠もなく企業の将来を予測することもできますが、", "en": "Luana: Yes, all of the information above is extremely important because you will have one thing is to forecast where a company is going without having any basis."}, {"ja": "Luana: 実績値があれば話は別だからです。そして、その実績値は10-Kや10-Qから得られます。", "en": "Luana: But once you have their actuals and that\'s where from a 10 K and a 10 Q, from a 10 K and 10 Q will you have the actuals of."}, {"ja": "Jacob: ご存じない方のために定義しておきましょう。", "en": "Jacob: Let\'s define those for those who don\'t know."}, {"ja": "Jacob: 10-Kは年次報告書ですよね。", "en": "Jacob: 10 K is the annual, right?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Luana: その通りです。", "en": "Luana: Yes."}, {"ja": "Jacob: 10-Qは四半期報告書です。", "en": "Jacob: 10 Q is quarterly."}, {"ja": "Jacob: では8-Kはどうでしょう。", "en": "Jacob: And what about the-"}, {"ja": "Luana: その通りです。", "en": "Luana: That\'s exactly right."}, {"ja": "Luana: 8-Kは上場企業がプレスリリースを発表する際に提出するものです。", "en": "Luana: And the 8K is when the public traded company issues a press release."}, {"ja": "Luana: 必ずしもEBITDAや純利益に関するものとは限りません。", "en": "Luana: So not necessarily needs to gear towards EBITDA or net income."}, {"ja": "Luana: 例えば経営陣の変更などの場合もあります。", "en": "Luana: It can be, for example, a changing management than a company."}, {"ja": "Luana: そしてそれが重要情報であるため、市場に対して公表しなければなりません。", "en": "Luana: And since it\'s a material information, they have to issue this information to the markets."}, {"ja": "Luana: ですから企業に重要な出来事が発生すると8-Kが提出されます。", "en": "Luana: So whenever something material happens with the company, they issue an 8K, which will also..."}, {"ja": "Jacob: 例えば買収のようなものですか。", "en": "Jacob: Like an acquisition?"}, {"ja": "Luana: あるいは契約延長などです。", "en": "Luana: Like an extension."}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Luana: その場合は8-Kが提出されます。", "en": "Luana: Then an 8K would be issued."}, {"ja": "Jacob: フリーキャッシュフローです。", "en": "Jacob: Free cash flow."}, {"ja": "Luana: フリーキャッシュフロー。", "en": "Luana: Free cash flow."}, {"ja": "Luana: 非常に、非常に重要です。", "en": "Luana: Very, very important."}, {"ja": "Luana: そして、まだ行っていない非公開企業にはぜひお勧めしたいのですが、単に倍率だけを見るのではなく、財務モデルを構築し始めるべきです。なぜなら、自社がどこへ向かっているのかを最も理解しているのは経営者自身だからです。", "en": "Luana: And I would encourage all the private companies to, if they are not doing this yet and only looking at multiples, I would definitely encourage them to start building their financial model, especially because they will be the best ones to have a sense on where this company is going."}, {"ja": "Luana: 例えば私が非公開企業を所有していて、その会社を売却するとしましょう。非常に単純な例で説明します。", "en": "Luana: And let\'s say, if I own a private company and I\'m selling, let\'s make this very simple."}, {"ja": "Luana: 私は椅子を製造しており、1脚100ドルで販売し、製造原価は50ドルだとします。", "en": "Luana: I\'m selling chairs and each chair that I\'m making, I\'m going to sell for a hundred dollars and it\'s costing me $50."}, {"ja": "Luana: すると粗利益は1脚当たり50ドルです。", "en": "Luana: So I know my gross margin here is $50 per chair."}, {"ja": "Luana: その場合、本当に重要になるのは年間に何脚生産したいかです。", "en": "Luana: Then it will really come down to how many chairs do I want to produce per year?"}]}, {"id": "default-24", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part4", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Luana: 何脚でしょうか。", "en": "Luana: How many chairs?"}, {"ja": "Luana: 10年後には何脚生産できると考えているでしょうか。", "en": "Luana: Do I think I can produce in 10 years?"}, {"ja": "Luana: 生産量を増やすために新しい技術を導入すべきでしょうか。", "en": "Luana: Should I buy a new technology that will increase this production?"}, {"ja": "Luana: こうした情報があって初めてキャッシュフロー予測を作成でき、自社の価値をより正確に把握できるようになります。倍率法は企業価値のレンジを示してくれますが、", "en": "Luana: And only with these informations, you will be able to actually build your cashflow forecast and have a better sense of how much your business value, because multiple can give you a range of where the company is, but you are."}, {"ja": "Luana: それは経験則に近いものです。一方で、自社の実態を細かく分析することが重要です。", "en": "Luana: It\'s more of a rule of thumb, but then actually getting to the nitty gritty of your own business."}, {"ja": "Luana: そして先ほどお話ししたフリーキャッシュフローですが、大まかに言えば、これはDCF（割引キャッシュフロー法）に非常に近い考え方です。", "en": "Luana: And then as you were saying about the free cash flow, that\'s on a very high level, you can say that this is almost, you\'re very close to the discounted cash flow."}, {"ja": "Luana: フリーキャッシュフローとは、事業活動から生み出したすべてのキャッシュから、そのキャッシュを生み出すために事業へ投資した金額を差し引いたものです。", "en": "Luana: And in the free cash flow, you have everything that you\'re generating from operational sites minus everything that you had to invest in the business to generate that operating cash flow."}, {"ja": "Jacob: では少し戻って、フリーキャッシュフローの計算方法をゆっくり説明していただけますか。", "en": "Jacob: So let\'s actually back up and can you walk us through slowly how to calculate free cash flow?"}, {"ja": "Jacob: それはキャッシュフロー計算書のことですか。", "en": "Jacob: Is that FCS in the mouse?"}, {"ja": "Luana: はい、もちろんです。", "en": "Luana: Yeah, absolutely."}, {"ja": "Luana: まずキャッシュフロー計算書ですが、少し戻ると、キャッシュフロー計算書には三つの主要なキャッシュフロー区分があります。", "en": "Luana: So for the first, a cash flow statement, going back a little bit, cash flow statements encompasses three cash flows, three main categories of cash flows."}, {"ja": "Luana: 第一が営業活動によるキャッシュフローです。", "en": "Luana: The first one, the cash flow from operations."}, {"ja": "Luana: 第二が投資活動によるキャッシュフローです。", "en": "Luana: The second one, cash flows from investing."}, {"ja": "Luana: 第三が財務活動によるキャッシュフローです。", "en": "Luana: The third one, cash flows from financing."}, {"ja": "Luana: では最初に戻りましょう。", "en": "Luana: Now let\'s go back to the first one."}, {"ja": "Luana: 営業活動によるキャッシュフローです。", "en": "Luana: Cash flow from operations."}, {"ja": "Luana: ここには事業活動によって生み出されたすべての現金が含まれます。", "en": "Luana: That\'s where all the cash that your business has generated from operation standpoint."}, {"ja": "Luana: では私の例に戻りましょう。", "en": "Luana: So let\'s go back to my own business here."}, {"ja": "Luana: 私は椅子メーカーです。", "en": "Luana: And I\'m a chair manufacturer."}, {"ja": "Luana: 10脚の椅子を販売し、粗利益が50ドルだとします。つまり100ドルから50ドルを引いた金額です。", "en": "Luana: If I sold 10 chairs and my gross margin is $50, it\'s the $100 minus 50."}, {"ja": "Luana: 50ドルの話ですね。", "en": "Luana: Talking about $50."}, {"ja": "Luana: では単純化しましょう。", "en": "Luana: So let\'s make this simple."}, {"ja": "Luana: 私は10脚販売しました。", "en": "Luana: I sold 10."}, {"ja": "Luana: つまり、今年の営業活動によるキャッシュフローは500ドルだったということです。", "en": "Luana: I\'m saying that\'s my cash flow from operations in this year was $500."}, {"ja": "Luana: もちろん実際にはもっと詳細があります。", "en": "Luana: That would be more details."}, {"ja": "Luana: さらに多くのニュアンスがあります。", "en": "Luana: There would be more nuances."}, {"ja": "Luana: 営業活動において非常に重要な部分は、販売している製品から得られる利益率だけでなく、運転資本の管理でもあります。", "en": "Luana: Another very important portion of this operations, it\'s not only the margin that you are making out of the product you\'re selling, but also your working capital management."}, {"ja": "Luana: つまり、そのお金を何日で回収しているのか、仕入先や在庫に対して実際に何日で支払っているのかということであり、この部分は少し複雑になることがあります。", "en": "Luana: So how much days you are receiving this money, how much days you\'re actually having to pay your suppliers and your inventory, but that can get a little bit more complicated."}, {"ja": "Luana: それについては後で話しましょう。", "en": "Luana: We can talk about that later."}, {"ja": "Luana: 簡単に言えば、営業活動とは、製品を販売する事業が私にどれだけのキャッシュを生み出したかということです。", "en": "Luana: In a nutshell, operations is how much the business of selling a product has generated for me."}, {"ja": "Luana: 次に投資活動に移ります。", "en": "Luana: Then you go to investing."}, {"ja": "Luana: どの事業でも……", "en": "Luana: Any business..."}, {"ja": "Jacob: その話に入る前に、少し立ち止まりましょう。", "en": "Jacob: Let\'s actually pause before we go into that."}, {"ja": "Jacob: Luanaがここで話していることは、キャッシュフロー計算書を作成していない経営者には分からないかもしれません。", "en": "Jacob: What Luana is talking about here is some business owners might not know this because they don\'t prepare a cash flow statement."}, {"ja": "Jacob: キャッシュフロー計算書は三つの財務諸表の一つです。", "en": "Jacob: So a cash flow statement is one of the three financial statements."}, {"ja": "Jacob: Luanaには信じがたいかもしれませんが、ローワー・ミドルマーケットでは、キャッシュフロー計算書を見ていない経営者を本当にたくさん見かけます。", "en": "Jacob: I know you find that very hard to believe, Luana, probably, but we see a ton of business owners in the lower middle market that do not look at their cash flow statement, believe it or not."}, {"ja": "Jacob: 彼らは損益計算書と貸借対照表は定期的に見ていますが、キャッシュフロー計算書を見ることは非常にまれです。", "en": "Jacob: So they look at their P&L and balance sheet regularly, but very rarely look at the cash flow statement."}, {"ja": "Jacob: そしてキャッシュフロー計算書は、実際には営業活動、投資活動、財務活動によるキャッシュフローに分かれています。", "en": "Jacob: So on that cash flow statement, that\'s actually broken down into the cash flow from operations, investing and financing."}, {"ja": "Jacob: ではLuana、これから投資活動の部分に入っていただきます。", "en": "Jacob: So now you\'re going to go, Luana, into the investing portion of that, which you can go ahead."}, {"ja": "Luana: もちろんです。", "en": "Luana: Sure."}, {"ja": "Luana: もちろんです。", "en": "Luana: Absolutely."}, {"ja": "Luana: 投資活動に戻ると、どの事業でも営業活動からキャッシュを生み出すためには、その事業の背後に何らかの投資があります。", "en": "Luana: So going back to the investing for any business to be able to generate cash from its own operations, some investing will go behind that business."}, {"ja": "Luana: 投資活動では、これを大きく二つの区分に分けます。", "en": "Luana: In investing, you will divide this between main two brackets."}, {"ja": "Luana: 一つは維持投資で、これは事業を継続させるために行わなければならない投資です。", "en": "Luana: You have your maintenance investments, which is the investments you have to make for the business to stay afloat."}, {"ja": "Luana: もう一つは成長投資で、必ずしも行う必要はありませんが、例えば業務効率を高める新しい設備を購入する場合などの投資であり、これを成長投資と呼びます。", "en": "Luana: And you have your growth investments, which is you don\'t need to make this investment, but let\'s say if you plan to buy a new equipment that will help you to gain efficiency in your operations, we call this the growth investment."}, {"ja": "Luana: そういうことです。", "en": "Luana: This is so."}, {"ja": "Luana: 椅子の例に戻ると、現在の設備を良好に稼働させ続けるためには、何らかのメンテナンスを行う必要があります。", "en": "Luana: And going back to our chairs here, let\'s say to keep my current equipment working well, I have to do some maintenance."}, {"ja": "Luana: 椅子の生地などのメンテナンスを行う必要があります。", "en": "Luana: I have to do maintenance in the textile of the chairs, et cetera."}, {"ja": "Luana: 事業を維持するためだけに100ドルを支出したとします。", "en": "Luana: And to keep my business, let\'s say I spent a hundred dollars to just maintain."}, {"ja": "Luana: 生産量を増やしているわけではありません。", "en": "Luana: I\'m not increasing my production."}, {"ja": "Luana: 単にその100ドルで現状を維持しているだけです。", "en": "Luana: I\'m just maintaining that my hundred dollars."}, {"ja": "Luana: そして、事業を成長させるための支出は何もしなかったとします。", "en": "Luana: So, and let\'s say if I didn\'t have any, I didn\'t expend anything in growing the business."}, {"ja": "Luana: 覚えていると思いますが、営業活動によるキャッシュフローは500ドルでした。椅子10脚で、粗利益が50ドルなので500ドルです。", "en": "Luana: If you remember, we had our cashflow of operations at 500, 10 chairs at gross margin of 50, 500."}, {"ja": "Luana: そして1年間で100ドルを投資しました。", "en": "Luana: And I invested in one year, $100."}, {"ja": "Luana: フリーキャッシュフローは、財務活動によるキャッシュフローを考慮せず、営業活動によるキャッシュフローと投資活動によるキャッシュフローだけを考慮します。", "en": "Luana: My free cashflow, because free cashflow will not set considering the financing cashflow, will only consider cashflow from operations and cashflow from investing."}, {"ja": "Luana: 私のフリーキャッシュフローは500ドルから100ドルを引いたもので、つまり400ドルだったということです。", "en": "Luana: My free cashflow is this 500 minus 100, which means my free cash flow was 400."}, {"ja": "Jacob: ところで、フリーキャッシュフローは何に使うのですか。", "en": "Jacob: What do you use free cash flow for, by the way?"}, {"ja": "Jacob: それはDCFで使われるのですか。", "en": "Jacob: Well, is that used in discounted cash flow?"}, {"ja": "Luana: はい、使います。ただしここで強調したいのは、実際にはもっと多くの詳細がありますが、大まかな数値、大まかな計算方法としてはこのようになるということです。", "en": "Luana: Yes, you use, I need to just emphasize here that there are a lot of more details behind it, but the high level figures, the high level, how we calculating is this."}, {"ja": "Luana: それぞれのキャッシュフローの中には、さらに別の項目もあります。", "en": "Luana: There would be like some other categories within each of these cash flows."}, {"ja": "Jacob: 何となく疑っていませんよ。", "en": "Jacob: I somehow don\'t doubt you."}, {"ja": "Luana: はい。フリーキャッシュフローを見ることで、実際にDCFを検討し始めます。", "en": "Luana: Yeah, so with the free cash flow, that\'s when you actually start looking at your DCF."}, {"ja": "Luana: DCFとは割引キャッシュフロー法のことです。", "en": "Luana: The DCF will be the discounted cash flow."}, {"ja": "Luana: ただし、現在価値に割り引く前に、これは最後に行う作業です。", "en": "Luana: But first, before you discount it to present value, this will only happen at the end."}, {"ja": "Luana: 最初は、まず理解することに集中します。", "en": "Luana: In the beginning, you were really just worried on trying to understand."}, {"ja": "Luana: 1年目に私は400ドルのフリーキャッシュフローを生み出すことができました。", "en": "Luana: In year one, I was able to generate $400 of free cash flow."}, {"ja": "Luana: 2年目もすべて同じだとしましょう。", "en": "Luana: In year two, let\'s say everything stays the same."}, {"ja": "Luana: 3年目、4年目も400ドルです。", "en": "Luana: $400 year three, year four."}, {"ja": "Luana: これは、同じ投資を続ければ毎年400ドルを生み出せる事業だとします。", "en": "Luana: Let\'s say this is a business that I will keep this investment and I will be able to generate $400 each year."}, {"ja": "Luana: 分かりました。", "en": "Luana: All right."}, {"ja": "Luana: このフリーキャッシュフローが分かると、それだけで多くのことが見えてきます。", "en": "Luana: Now, now that I have this free cash flow, this is already gives me a lot of sense of it."}, {"ja": "Luana: そして、これがプラスであるというだけで、営業活動が投資を賄えていることを意味します。", "en": "Luana: And just the fact that this is positive, it means that my operations are covering my investments."}, {"ja": "Luana: つまり、ここには余裕があるということです。", "en": "Luana: So I actually have a leeway here."}, {"ja": "Luana: もし事業を成長させるために投資を始めたいのであれば、新しい設備を買うこともできますし、その設備が1年以内に生産性向上をもたらさないとしても、例えば200ドルを使えば翌年には生産量を倍にできるかもしれません。", "en": "Luana: If I want to start growing the business to make an investment, to maybe buy a new equipment, and maybe this equipment will not be able to start enhancing my production in one year, but say if I spend $200 and next year I will be able to duplicate production."}, {"ja": "Luana: このように、事業や営業活動がどれほど健全かについて、多くの手掛かりが得られます。", "en": "Luana: So this already starts giving you a lot of clues of how healthy is my business, the operations."}, {"ja": "Jacob: つまり最初のステップは、いわばキャッシュフローを計算し、その後でさまざまな手法を適用することですね。", "en": "Jacob: So the first step is calculating the cash flow, if you will, and then applying the different methods."}, {"ja": "Jacob: では、他にどのようなキャッシュフロー指標を使いますか。", "en": "Jacob: So what other measures of cash flow do you use?"}, {"ja": "Jacob: 利益、EBITDA、フリーキャッシュフロー。", "en": "Jacob: Earnings, EBITDA, free cash flow."}, {"ja": "Jacob: 他にも使う方法はありますか。", "en": "Jacob: Are there any other methods that you use?"}, {"ja": "Luana: はい。", "en": "Luana: Yeah."}, {"ja": "Luana: 営業活動によるキャッシュフローから始めることができます。", "en": "Luana: So you can start your cash flow from operations."}, {"ja": "Luana: 常に営業活動から始めます。", "en": "Luana: You always start from operations."}, {"ja": "Luana: それが私たちのロードマップのようなものです。", "en": "Luana: That\'s kind of the road map that we have."}, {"ja": "Luana: 純利益から始めて、純利益から戻って必要な調整を加えることもできます。", "en": "Luana: And you can start both from net income and from net income, go back to and make the adjustments necessary."}, {"ja": "Luana: あるいはEBITDAから始めても、同じところに到達します。", "en": "Luana: Or if you want to start from EBITDA, you will get to the same place."}, {"ja": "Luana: ですから、営業活動によるキャッシュフローの計算を始めるにあたり、どちらを選んでも同じ数値に到達します。", "en": "Luana: So it don\'t matter which one you pick to start this operations calculation, you will get to the same number."}, {"ja": "Luana: 次に投資活動については、通常は経理チームから、1年間にどれだけの設備投資、略してCapExを使ったかを取得します。", "en": "Luana: Then you\'re going to get from your investments, you\'ll get from potentially from your accounting team, how much capital expenditure, which for short, and we call capex you spend in a year."}, {"ja": "Luana: そして、このフリーキャッシュフローが得られます。", "en": "Luana: And then you have this free cash flow."}, {"ja": "Luana: フリーキャッシュフローです。", "en": "Luana: The free cash flow."}, {"ja": "Jacob: それはEBITDAからCapExを引いたものと呼ぶのですか、それとも別のものですか。", "en": "Jacob: Is there a, do you call it EBITDA minus capex or is there a?"}, {"ja": "Luana: いいえ。フリーキャッシュフローについては、大まかに事業の感覚をつかむだけで、正確なフリーキャッシュフロー額までは必要ない場合には、EBITDAからCapExを引くこともできます。", "en": "Luana: No, for the free cash flow, can do like in a high, let\'s say if you\'re kind of just trying to get a sense of the business and not necessarily the correct amount of free cash flow, you can do EBITDA minus capex."}, {"ja": "Luana: それができる理由は、EBITDAが私たちの持つ営業指標の中でも最良、少なくとも最良の一つだからです。", "en": "Luana: And the reason you can do that is because EBITDA is one, if not the best, one of the best operational metrics that we have."}, {"ja": "Luana: EBITDAは本当に営業活動を見ているので、営業活動によるキャッシュフローの簡便な代替指標として使えます。", "en": "Luana: It\'s really looking at operations so it can be a good, easy substitute of the cashflow from operations."}, {"ja": "Luana: そのため一部の会社はEBITDAを見ますが、それはすぐに数字が必要な場合や、その会社を深く分析する必要がない場合です。", "en": "Luana: So some companies will look at that EBITDA, but that is when you kind of need a number in a second or you don\'t need to have to go in a deep dive of that company."}, {"ja": "Luana: ただし、営業活動によるキャッシュフローを計算するには、このEBITDAから始めますが、そこにいくつかの調整を加える必要があります。税金を支払う必要があり、EBITDAにはそれが含まれていないからです。", "en": "Luana: But to calculate cash flow from operations, you will start on this EBITDA, but you will have to make some adjustments there because you will have to make some tax adjustments since you pay taxes and this is not including the EBITDA."}, {"ja": "Luana: 例えば税率が30％であれば、その分をEBITDAから差し引く必要があり、運転資本管理も差し引く必要があります。", "en": "Luana: So let\'s say pay 30% of taxes you have to discount from this EBITDA and you\'re working cash management will also have to be discounted."}, {"ja": "Luana: 例えば、支払条件に基づいて代金を受け取っているとします。", "en": "Luana: Let\'s say you were receiving money from your payments terms."}, {"ja": "Luana: 30日後に代金を受け取る一方で、仕入先には15日後に支払わなければならない場合、支払いより15日遅れて受け取るため、運転資本上は15日分不足していることになります。", "en": "Luana: You were receiving money in 30 days, but if you have to pay your suppliers in 15 days, you kind of are 15 days short here in working capital because you\'re receiving 15 days later that you paid your supplies."}, {"ja": "Luana: したがって、それもキャッシュフロー計算書、つまり営業活動によるキャッシュフローで考慮すべき式になります。", "en": "Luana: So that will also be a formula to be considered in your cash flow statement, your operating cashflow."}, {"ja": "Jacob: 皆さん、そろそろ頭が混乱していると思います。", "en": "Jacob: I\'m sure everyone\'s heads are spinning now."}, {"ja": "Jacob: 少し戻りましょう。", "en": "Jacob: Let\'s actually back up for a moment."}, {"ja": "Jacob: 株式調査アナリストとしてのお客様は誰ですか。", "en": "Jacob: Who\'s your customer as an equity research analyst?"}, {"ja": "Jacob: 投資家ですか、それとも上場企業ですか。", "en": "Jacob: Is it the investors or the public companies?"}, {"ja": "Luana: いいえ、投資家です。", "en": "Luana: No, it\'s investors."}, {"ja": "Luana: 通常はヘッジファンドや資産運用会社が主なお客様です。", "en": "Luana: So usually our hedge funds, usually our asset managers, these are our main customers."}, {"ja": "Jacob: では、ここで少し答えにくい質問をします。", "en": "Jacob: Now, let me put you on the spot here."}, {"ja": "Jacob: これは少し気まずく感じるかもしれません。", "en": "Jacob: This might make you uncomfortable."}, {"ja": "Jacob: そして、きっと以前にも聞かれたことがあると思います。", "en": "Jacob: And I\'m sure you\'ve heard this before."}, {"ja": "Jacob: 正確な数字は分かりませんが、売り推奨より買い推奨の方が多いことは知っています。", "en": "Jacob: I don\'t know what the number is, but I know there\'s more buys than sells."}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Jacob: それに対する通常の回答は何ですか。", "en": "Jacob: And what is your typical response to that?"}, {"ja": "Luana: チャイニーズウォールです。", "en": "Luana: Chinese walls."}, {"ja": "Jacob: 分かりました。この話に入りましょう。", "en": "Jacob: Okay, let\'s go into this."}, {"ja": "Jacob: これは業界全体にとって少し気まずいテーマかもしれません。", "en": "Jacob: This can be an uncomfortable topic, but for the industry overall."}, {"ja": "Jacob: それはなぜでしょうか。", "en": "Jacob: And why is that?"}, {"ja": "Jacob: なぜ実際には売り推奨より買い推奨の方が多いのでしょうか。", "en": "Jacob: Why we actually have more buys than sell?"}, {"ja": "Luana: それについては定型的な答えがたくさんあります。", "en": "Luana: There are a lot of formulated answers for that."}, {"ja": "Luana: 私は、株式調査アナリストが企業に付けるすべてのレーティングは、その企業が本当に割安または割高だと信じているからだと思いたいです。", "en": "Luana: I want to believe that all the ratings that equity analysts are giving to a company are because they truly believe that a company is undervalued or overvalued."}, {"ja": "Luana: しかし議論はあります。", "en": "Luana: But there are discussions."}, {"ja": "Jacob: 少し待ってください。買い推奨とは何を意味するのですか。", "en": "Jacob: For one second, so a buy, what does a buy mean?"}, {"ja": "Luana: 買い推奨とは、別の言い方をすれば、その企業が割安であるということです。", "en": "Luana: A buy is, it\'s in other words, the company is undervalued."}, {"ja": "Luana: つまり、その企業が本来あるべき水準で取引されていないということです。", "en": "Luana: So the company is not traded where it should be."}, {"ja": "Luana: 現時点では、ということですね。", "en": "Luana: That\'s currently."}]}, {"id": "default-25", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part5", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Jacob: 現時点では。", "en": "Jacob: Currently."}, {"ja": "Luana: 現時点では、はい。", "en": "Luana: Currently, yes."}, {"ja": "Jacob: その時点において、ということです。", "en": "Jacob: At that moment in time."}, {"ja": "Jacob: なるほど、分かりました。", "en": "Jacob: Okay, got it."}, {"ja": "Luana: はい、その場合はその株式を買い推奨します。", "en": "Luana: Yes, that\'s when you recommend to buy the stock."}, {"ja": "Luana: 例えば、私がAppleは割安だと考えているとしましょう。今年はそうではありませんが。", "en": "Luana: So let\'s say if I think, that Apple, it\'s undervalued, which is not the case this year."}, {"ja": "Luana: テクノロジー企業は非常に強い上昇モメンタムが続いていると思います。", "en": "Luana: I think tech companies, I don\'t know, they have had their very bullish momentum."}, {"ja": "Luana: しかし、誰もが知っている企業としてAppleを例にしましょう。", "en": "Luana: But let\'s say a company that everybody knows, Apple."}, {"ja": "Luana: 将来キャッシュフローを自分で分析した結果、Apple株は600ドル近辺であるべきだと考えるなら、そして現在はそこまで達していないのであれば、買い推奨を出します。", "en": "Luana: If you think that Apple stocks should be closer to 600 after performing your own assessments of the future cash flows, and this is the company, I think they\'re trading at, I don\'t know where they\'re trading now, but then you issue a buy."}, {"ja": "Luana: そして私が話しているレポートですが、買い推奨を出す際には実際にレポート全体を書き、その評価の根拠を説明します。", "en": "Luana: And that reports that I\'m talking about, when you issue a buy, you are actually writing entire reports and justifying your rating."}, {"ja": "Luana: そしてそのレポートは銀行のすべての顧客に配布されます。", "en": "Luana: And that reports will go to all the bank customers."}, {"ja": "Jacob: それは本当に良い指摘ですね。", "en": "Jacob: Oh, that\'s a really good point."}, {"ja": "Jacob: つまり、それは単なる買い手や売り手の話ではありません。", "en": "Jacob: I mean, that\'s a good point because it\'s not just the buyer, the seller."}, {"ja": "Jacob: 重要なのはその背景にあるものです。", "en": "Jacob: It\'s what\'s behind that."}, {"ja": "Jacob: レポート全体を読むことになるのだろうと思います。", "en": "Jacob: I would imagine reading the entire report."}, {"ja": "Jacob: レポートはどのくらいの長さで、各銘柄についてどのくらいの頻度で発行されるのですか。", "en": "Jacob: How long is a report and how often do those come out for each stock?"}, {"ja": "Luana: 通常、企業が決算を発表するたびに株式調査アナリストはレポートを発行します。また、企業が8-Kを提出し、その内容が企業価値評価に影響を与える、あるいは顧客に知らせるべき重要事項だと考えられる場合にもレポートを発行します。", "en": "Luana: So each stock usually every time that a company announced earnings, an equity analyst will issue a report and then each time a company issues an 8K news release that we think can bring a change in the valuation perspective, or we think it\'s important to let our customers know that, hey, this is a big deal."}, {"ja": "Luana: これは重要なニュースではない。", "en": "Luana: No, this is not a big deal."}, {"ja": "Luana: そのような場合にもレポートを発行することがあります。", "en": "Luana: We also can issue a report."}, {"ja": "Luana: したがって、その時々の状況に大きく左右されます。", "en": "Luana: So we will very much depend on that."}, {"ja": "Luana: 企業が市場に何かを発表した場合、通常は株式調査アナリストがそのニュースを分析します。", "en": "Luana: If the company has announced something to the market, usually that\'s when equity analysts ana: まさに『すごいな』という感じです。", "en": "Luana: It\'s like, wow."}, {"ja": "Luana: 私は2億ドルを予想していたのに、結果は1億2,000万ドルでした。", "en": "Luana: I was expecting $200 million and it came 120."}, {"ja": "Luana: 一体何が起きているのだろう。", "en": "Luana: What is going on?"}, {"ja": "Luana: 今後数年間の予測を修正すべきだろうか。", "en": "Luana: Should I change my forecasting for the next years?"}, {"ja": "Luana: これは一時的なものなのか、それとも本当に予想外のことが起きたのか。", "en": "Luana: Is this a one-off, something really unexpected happened?"}, {"ja": "Luana: そういう時こそ、企業価値評価における問題解決能力や批判的思考が必要になります。", "en": "Luana: That\'s when you start really having that problem solving critical thinking into your evaluation."}, {"ja": "Luana: そして、その内容を調査レポートで説明しなければなりません。", "en": "Luana: And then you\'re to explain this in your research reports."}, {"ja": "Jacob: 決算発表はすべて30日程度の期間内に集中するのですか。", "en": "Jacob: All the earnings, do those come out within the 30 day period of time?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Jacob: 言い換えると、多くの企業の決算は3月なら3月の中で発表されるのですか。", "en": "Jacob: In other words, most companies earnings are they announced within the month of March and so on?"}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Jacob: 互いに数週間以内の範囲ですか。", "en": "Jacob: Within a few weeks of each other?"}, {"ja": "Luana: そして通常、同じ業界の企業は、理由は分かりませんが、非常に近い時期に決算発表を行います。", "en": "Luana: And usually companies of the same sector, for some reason that I actually don\'t know why, they usually report very close to each other."}, {"ja": "Luana: そのため、1週間のうちに1日2件ほど決算発表があることもあります。", "en": "Luana: So in a week, you can have like two earnings per day."}, {"ja": "Luana: だいたい同じ時期に集中します。", "en": "Luana: They\'re going to be kind of around."}, {"ja": "Luana: ExxonとChevronも、今も同じかは分かりませんが、私が担当していた頃は毎四半期同じ日に発表していました。", "en": "Luana: Exxon and Chevron, I don\'t know if it\'s still the same because I\'m not covering them anymore for a while, but they used to report on the same day, all quarters."}, {"ja": "Jacob: ええ。", "en": "Jacob: Yeah."}, {"ja": "Jacob: たぶん。", "en": "Jacob: Maybe." ore."}, {"ja": "Jacob: すごいですね。", "en": "Jacob: Wow."}, {"ja": "Jacob: かなりストレスがありそうです。", "en": "Jacob: It sounds stressful."}, {"ja": "Jacob: 思いつきで休暇に行くこともできませんね。", "en": "Jacob: You can\'t make any impromptu vacations."}, {"ja": "Jacob: 週末にティフアナへ遊びに行っていて、『しまった、決算発表の日だった』というわけにはいきません。", "en": "Jacob: Yeah, pick up and go to Tijuana for the weekend and party and, oh crap, I forgot, they announced their earnings."}, {"ja": "Jacob: 控えめに言ってもストレスの多い仕事ですが、それが上場企業とその関係者の人生なのです。", "en": "Jacob: It sounds stressful to say the least, but there goes the life of a public company and all those that are involved in that."}, {"ja": "Jacob: 投資家とは誰なのでしょうか。", "en": "Jacob: Who are the investors?"}, {"ja": "Jacob: あなた自身も投資するのですか。", "en": "Jacob: Do you invest?"}, {"ja": "Jacob: 投資家にもいろいろな種類がありますよね。", "en": "Jacob: Because I know you\'ve got different types of investors."}, {"ja": "Jacob: 短期トレーダーもいます。", "en": "Jacob: You\'ve got the short-term traders."}, {"ja": "Jacob: 長期保有の投資家もいますし、機関投資家もいます。", "en": "Jacob: You\'ve got the long-term buy and hold people, you have the institutional investors."}, {"ja": "Jacob: こうした調査レポートの最大の利用者は誰ですか。", "en": "Jacob: Who are the largest consumers of these research reports?"}, {"ja": "Jacob: どのような投資家でしょうか。", "en": "Jacob: What types of investors?"}, {"ja": "Luana: あなたが挙げたすべての投資家が利用しますが、株価に最も大きな影響を与えるのは通常、機関投資家です。", "en": "Luana: Types of investors, I think all of them both that you mentioned, but the ones that can usually have more impact on the stock, it\'s going to be the institutional investors."}, {"ja": "Luana: ただ、GameStopやReddit、Robinhood、市場参加者の裾野が大きく広がったことで、まったく異なる世界に向かっていることは認識しています。", "en": "Luana: I know we are heading to a completely different world since GameStop and Reddit and more Robinhood and the entire more inclusion of the market."}, {"ja": "Luana: とはいえ、現時点で大きな影響を持つのは依然として機関投資家、つまりアセットマネージャー、ポートフォリオマネージャー、ヘッジファンドです。", "en": "Luana: But currently it\'s still an institution investors and these being asset managers, portfolio managers and ing sentiment or struggles or emotions."}, {"ja": "Jacob: そしてもちろん、今は資本主義に対しても同じことが起きています。資本主義を非難したり、その悪影響を指摘したりする人々がいます。", "en": "Jacob: And of course you see this now with capitalism and people decrying capitalism and pointing out the bad impact of capitalism."}, {"ja": "Jacob: そして、それがESGを通じて解決されていくのかもしれません。", "en": "Jacob: And maybe that\'s going to be addressed via ESG."}, {"ja": "Jacob: しかし、まず一言で言うとESGとは何でしょうか。", "en": "Jacob: But what is ESG in a nutshell?"}, {"ja": "Jacob: その上で、細かい部分に入っていきましょう。", "en": "Jacob: And then we\'ll kind of get into the nuts and bolts of it."}, {"ja": "Luana: もちろんです。", "en": "Luana: Sure."}, {"ja": "Luana: 一言で言うと、Eは環境(Environmental)、Sは社会(Social)、Gはガバナンス(Governance)を表します。", "en": "Luana: In a nutshell, E stands for environmental, S as social and G governance."}, {"ja": "Luana: そしてESGとは、企業がこの3つの柱、すなわち環境、社会、ガバナンスに向けて取り組むすべての施策のことを指します。", "en": "Luana: And ESG are all the initiatives companies have towards these three main pillars, the environmental, social and governance."}, {"ja": "Jacob: それは、環境を優先する、必ずしも優先するというわけではないにせよ、もう少し環境に配慮する、あるいは自社の上場企業としての社会的影響に配慮する、といったことを意味するのでしょうか。", "en": "Jacob: Does that mean prioritizing the environment, not necessarily prioritizing, but caring about the environment a little bit more, caring about the societal impact of your publicly held company and so forth?"}, {"ja": "Jacob: ここで言っているのは、一言で言えばそういうことですか。", "en": "Jacob: Is that what we\'re referring to here in a nutshell?"}, {"ja": "Luana: はい、一言で言えばその通りです。この3つの柱に細分化された施策として、企業が実際に何に取り組んでいるか、ということです。", "en": "Luana: Yes, in a nutshell is, yeah, what type of practices and subdivided into these three pillars is a company actually addressing?"}, {"ja": "Luana: 多くの企業がやっているように、2030年までにカーボンニュートラルを目指しているか。", "en": "Luana: Is the company trying to become net carbon free by 2030, like many companies are doing that?"}, {"ja": "Luana: あるいは、小規模な企業であれば、まず事業を成長させるという目標があるため、そのような目標を設定するのは非常に難しいでしょう。", "en": "Luana: Or if you\'re a smaller company, it will be very hard for you to set this goal since you have the goal to grow your business first."}, {"ja": "Luana: しかし、その目標が現実的に達成不可能で、事業そのものを破綻させかねないのであれば、環境面で他にどのような目標を設定できるか、ということです。", "en": "Luana: But since this goal could be potentially unattainable and defeat your business, what other goals could you have towards environmental?"}, {"ja": "Luana: なぜなら、いまや投資家、つまり企業の成長を支援したいエクイティ投資家たちは、こうした取り組みを真剣に注視しているからです。", "en": "Luana: Since now investors, investors meaning equity investors that want to help companies to grow are really looking at these initiatives."}, {"ja": "Jacob: 例えばFacebookやTwitterが、自社の社会的影響に目を向けるといったことですね。", "en": "Jacob: So Facebook, for example, or Twitter, looking at the social impacts of their companies."}, {"ja": "Jacob: それは一つの例になりますか。", "en": "Jacob: Would that be an example?"}, {"ja": "Luana: はい、その通りです。", "en": "Luana: Yes, yes."}, {"ja": "Luana: Facebook、Twitter、Disney、そして主に航空会社のような他の企業も、2030年までにカーボンニュートラルを目指すと相次いで表明しています。", "en": "Luana: Facebook, Twitter, Disney, mainly other companies such as airlines, they all just came out saying they will thrive to be net carbon free by 2030."}, {"ja": "Luana: 石油・ガス会社の中には、新技術を用いて炭素を回収しようとしているところもあります。鉱業界、特にこうした業界は環境負荷が非常に高く、さらに各国で天然資源を扱う場合には、ガバナンス面、特に反汚職にも関わってきます。", "en": "Luana: Oil and gas companies, some of the oil and gas companies saying that they will try to use new technologies to capture carbon in the mining industry, especially these industries, they\'re really intense in the environmental side and can get into the governance sides, anti-corruption, whenever you\'re dealing with natural resources in different countries."}, {"ja": "Luana: そして社会的側面、これが社会的側面です。", "en": "Luana: And the social aspect, that\'s the social aspect."}, {"ja": "Luana: すべての業界に関わる話ですよね。", "en": "Luana: It touches all sectors, right?"}, {"ja": "Luana: 大企業から中小企業まで、規模を問わず関係します。", "en": "Luana: And it can be from big companies to small companies."}, {"ja": "Luana: その企業の文化はどうか。", "en": "Luana: How is that culture?"}, {"ja": "Luana: 従業員の包摂はどうか。",  the environment."}, {"ja": "Luana: パンデミック中に私たちが目にしたように、パンデミックのプラスの側面の一つは、世界中で工場が閉鎖されたときに、絶滅しかけていた動物がより多く戻ってくる姿を見られたことです。", "en": "Luana: And we saw during the pandemic, one of the positives of the pandemic was to see whenever we shut down plants in the world, we saw more animals, extinguished animals coming back."}, {"ja": "Luana: 世界中のさまざまな動植物が戻ってきて、大気汚染が減少していくのを目の当たりにしたのを覚えています。", "en": "Luana: I remember seeing so many of the fowl and flora of the world and seeing the air pollution diminishing."}, {"ja": "Luana: 気候変動を信じない人々にとっても、製造業を停止すると、実際に生活の質、動物の生活、空気の質などすべてが向上するということが、非常に明確に示されたのです。", "en": "Luana: It was very clear for those who don\'t believe in climate change that when we shut down our manufacturers, actually we have a better quality of life, of animal life, of the air life, all of that."}, {"ja": "Luana: しかしパンデミック以前、確か2002年頃だったと思いますが、国連が2030年に向けた目標、いわゆるSDGs(持続可能な開発目標)を打ち出しました。企業が念頭に置くべき17の目標です。", "en": "Luana: But even before the pandemic, I think back in 2002, alpha, if I\'m not mistaken, that\'s when UN United Nations came to goals for 2030, which are called the SDGs goals, 17 goals for companies to have in mind."}, {"ja": "Luana: それらの目標は、飢餓ゼロ、貧困ゼロ、クリーンエネルギーなど、私たち全員が念頭に置くべき内容です。", "en": "Luana: And these goals are no hungry, no poverty, clean energy, all of these things that we all should have in mind."}, {"ja": "Luana: それ以前〜", "en": "Luana: Before-"}, {"ja": "Jacob: それはいつのことでしたか。", "en": "Jacob: And when was this?"}, {"ja": "Jacob: 2012年に国連が〜", "en": "Jacob: That was 2012 in United-"}, {"ja": "Luana: ウォール街は国連の話に耳を傾けるのでしょうか。", "en": "Luana: Does Wall Street listen to the UN?"}, {"ja": "Luana: ウォール街が本当に国連に目を向け始めた瞬間を特定することはできませんが、過去2年間で確かに何かが起きました。", "en": "Luana: I cannot pinpoint the moments that Wall Street really started looking at UN, but something happened in the past two years."}, {"ja": "Luana: そしてこういった動きを目にできるのは素晴らしいことです。例えば本日、サステナビリティに特化したロング・ショート・ヘッジファンドを開始するという発表がありました。", "en": "Luana: And it\'s been beautiful to see something on the lines of, for example, today, being kept to announce that they will start having a long short hedge fund specializing in sustainability."}, {"ja": "Luana: 彼らがそれを始めるのです、それは〜", "en": "Luana: They will, it\'s a."}, {"ja": "Luana: サステナビリティだけに投資するヘッジファンドです。", "en": "Luana: It\'s a hedge fund they will invest only."}, {"ja": "Jacob: はい。", "en": "Jacob: Yes."}, {"ja": "Luana: はい。", "en": "Luana: Yes."}, {"ja": "Luana: そしてBlackRockでも同じことが見られます。BlackRockは現在、ESGにどう取り組むかという戦略を打ち出しています。", "en": "Luana: And you can see that with BlackRock, BlackRock now has a strategy in ESG, how they\'re going to address ESG."}, {"ja": "Luana: Cathie Wood氏もまた、ESGへの取り組み方について包括的な戦略を発表しました。", "en": "Luana: Cathie Wood also came out with an entire strategy towards how you were dealing with ESG."}, {"ja": "Luana: そして、こうした動きはまず一部の大手投資家が始めることで、他にも波及していきます。例えば、私が非常に大きな投資家で、プライベートエクイティに資金を投じたいけれども、どこに投じるべきか決めかねているとします。あるプライベートエクイティが本当にサステナビリティを重視していて、私自身もサステナビリティを大切にしているのであれば、当然そちらに資金を投じます。どんな企業でも対象にするようなプライベートエクイティには投じません。", "en": "Luana: And it comes from one set of big investors start doing, then you have that entire effect in others because let\'s say if I am a very large investor and I want to put my money into private equity and I don\'t know which private equity I go but I can see that private equity really cares about sustainability and for me I really care about sustainability I\'m going to put my money there and not in the private equity that it\'s looking at any company."}, {"ja": "Jacob: これは上場企業の行動にも影響を与えるとお考えですか。挙げられたBainやBlackRockは、いずれも投資会社ですよね。", "en": "Jacob: Do you think this will affect the behavior of the public companies because you\'ve mentioned Bain, BlackRock, those are investment companies."}, {"ja": "Jacob: しかし、上場企業自身の行動が変わらなければ、大きな影響は生まれないでしょう。", "en": "Jacob: But if the underlying behavior of the public companies doesn\'t change, it\'s not going to have much of an impact."}, {"ja": "Jacob: 投資家の意思決定プロセスが、実際の企業行動、ひいては人々や環境にどの程度影響を与えるとお考えですか。", "en": "Jacob: To what extent do you think investors decision-making process is going to actually impact the actual behavior here that\'s going to people in the environment?"}, {"ja": "Luana: 100%影響を与えると思います。", "en": "Luana: I think will affect a hundred percent."}, {"ja": "Luana: なぜなら、ここでお話ししているのは投資家のことだからです。", "en": "Luana: Because, yes, these are the investors, right?"}, {"ja": "Luana: 投資の側面について話しているわけです。", "en": "Luana: We\'re talking about the investment side."}, {"ja": "Luana: さて、企業はどうやって成長するのでしょうか。", "en": "Luana: Now, how a company usually grow?"}, {"ja": "Luana: 企業は無機的(inorganically)にも成長できます。つまり、差別化を考えて……失礼、まずは有機的(organically)に、自社が持つあらゆるリソースを活用し、新たな生産方法などを考えることで成長できます。一方で、M&Aを通じて無機的に成長することもできます。", "en": "Luana: The company can grow inorganically, so the company can start thinking about differentiate and well, sorry, the company can go organically and with everything that the company has within and think about a different method of production, etcetera, inorganically with mergers and an acquisition."}, {"ja": "Luana: ただ、どのように企業が成長できるかという問いを突き詰めると、投資なしに成長するのは非常に困難です。", "en": "Luana: But if we have to ask this question of how a company can grow, it\'s very hard for a company to grow without making an investment."}, {"ja": "Luana: ですから、有機的にせよ無機的にせよ、お金は必ず方程式の一部となります。", "en": "Luana: So the company can try to grow organically or inorganically, but money will be part of the equation."}, {"ja": "Luana: もちろん、非常に健全で、自社のキャッシュフローだけで成長資本をまかなえる企業もあります。先ほどキャッシュフローの話をした際に触れた通りです。", "en": "Luana: And yes, some companies are very healthy and they are able to generate enough cash flow to sustain their growth capital that we talked to early when we were talking about cash flows."}, {"ja": "Luana: しかし、こうした企業の多くは実際には資本調達によって成長しており、その手段はエクイティ(株式)かデット(負債)のいずれかです。", "en": "Luana: But most of these companies actually grow with raising capital and this can be equity or debt."}, {"ja": "Luana: もし投資家が、ある企業のサステナビリティへの取り組みの欠如に賛同できなければ、その企業の数百万ドル規模の資金調達全体がリスクにさらされることになります。", "en": "Luana: If these investors are not aligned with the lack of sustainability initiatives of a company, there is an entire multimillion finance that this company is now at risk."}, {"ja": "Luana: ですから、たとえ現時点で環境・社会・ガバナンスに無関心な企業であっても、自社の成長をどう資金調達でまかなうかは気にせざるを得なくなります。", "en": "Luana: So even if the company, let\'s say for a company that does not care about this now, about the environmental, social or their governance, the company will care about how to continue financing their growth."}, {"ja": "Luana: したがって、こうした崇高な大義にまったく動かされない企業であっても、状況は非常に厳しくなると思います。", "en": "Luana: So I think there\'s going to be very hard for companies, even if they are not, do not feel compelled to any of these beautiful causes."}, {"ja": "Luana: そして資金調達の困難という話に及べば、彼らも変わらざるを得なくなるでしょう。", "en": "Luana: And whenever we touch about lack of financing, they will be kind of obliged to change."}, {"ja": "Jacob: もしマーク・ザッカーバーグがこの番組を聞いていたら、彼に何と言いますか。", "en": "Jacob: What would you say to Mark Zuckerberg when he listens to this show?"}, {"ja": "Luana: マークについては、Facebookについて言えば、彼はミレニアル世代ですから、すでにESGの影響を十分に認識していると思います。", "en": "Luana: Mark, no, I think Facebook, I think Mark being a millennial, he\'s already much aware of the ESG impact."}, {"ja": "Jacob: 特に社会的側面でしょうか。", "en": "Jacob: Particularly the social?"}, {"ja": "Luana: 特に社会的側面です。", "en": "Luana: Particularly the social."}, {"ja": "Luana: 願わくば、従業員を大切に扱い、環境への影響を抑えようとしていてほしいですね。", "en": "Luana: I think hopefully he\'s treating his employees well and trying to have less impact on the environment."}, {"ja": "Luana: 私のメッセージはむしろ、これから先に向けたものです。", "en": "Luana: I think my message is more for, for coming."}, {"ja": "Luana: Instagramの「いいね」をなくしましょう。", "en": "Luana: Get rid of the Instagram likes."}, {"ja": "Luana: 私のメッセージは、利益のことしか考えていないすべてのCEOや取締役会に向けたものです。", "en": "Luana: I think my message would be more for all the CEOs and all the board of directors."}, {"ja": "Luana: 彼らは利益のことしか考えていません。", "en": "Luana: They\'re only thinking about profits."}, {"ja": "Luana: 変化はすでにここにあります。", "en": "Luana: The change is here."}, {"ja": "Luana: 変化はこれから来るのではありません。", "en": "Luana: The change is not coming."}, {"ja": "Luana: 変化はすでに到来しているのです。", "en": "Luana: The change has arrived."}, {"ja": "Luana: 私たち、つまり次の世代、現在の世代、そしてこれからの世代の投資家たちは、企業がサステナビリティをどう考え、事業をより持続可能にしようとしているかを見ています。そしてそれが業績にどう結びつくかは、すでに証明されています。", "en": "Luana: We, the next generation, the current generation and the next generation of investors are looking at how you think sustainability and to be clear, to make your business more sustainable has been proved."}, {"ja": "Luana: McKinseyだけでなく、多くのコンサルティング会社が調査結果を発表しています。それによれば、こうしたパーパスや3つの柱について考えることそのものが、収益性を高めるのです。", "en": "Luana: I think McKinsey, not only McKinsey, so many consulting groups have come out with research showing that the beauty of all of that is even when you\'re thinking about the purpose and thinking about these three pillars, you increase your profitability."}, {"ja": "Luana: つまり、両者は相互に作用し合っているということです。", "en": "Luana: So it\'s one way helping the other."}, {"ja": "Luana: 具体例として、社会的側面の一つに多様性と包摂があります。職場により多くの女性、より多くのマイノリティを迎え入れる、というものです。", "en": "Luana: And the case in point is one of the social aspect is the diversity, the inclusion is to bring more women into the workforce, more minority groups into the workforce."}, {"ja": "Luana: そして多くの調査が、多様性のあるグループの方がより創造的なアイデアを生み出すこと、そしてそうしたアイデアが事業を新たな方向へと導き、より高い利益につながり得ることを示しています。", "en": "Luana: And so many research have come out saying how a diverse group can elaborate more creative ideas and how these creative ideas can actually take a business into a different direction than can lead to more profit."}, {"ja": "Luana: つまり、ある側面はもう一方の側面と手を取り合って機能するのです。", "en": "Luana: So one aspect actually goes hand in hand."}, {"ja": "Luana: 時には、「サステナビリティを重視するのは、それが良いマインドセットだから」という発想自体を作り直す必要があります。", "en": "Luana: Sometimes it\'s really recreating this mindset that focus on sustainability is just because it\'s a good mindset to have."}, {"ja": "Luana: いいえ、いいえ、それは単に良いというだけではありません。", "en": "Luana: No, no, no, it\'s not only good."}, {"ja": "Luana: 事業成長にとって不可欠なのです。", "en": "Luana: It\'s essential for the business growth."}, {"ja": "Jacob: これは私にとって非常に興味深いトピックです。資本主義は、もしそう呼ぶならば、さまざまな経済制度の一つに過ぎないという見方ができるからです。", "en": "Jacob: This is a very interesting topic to me because you look at the different economic institutions, if you want to call them that, of which capitalism is one."}, {"ja": "Jacob: 私は資本主義を、ほかの科学と同じように捉えています。", "en": "Jacob: I look at capitalism as any other science."}, {"ja": "Jacob: 例えばヘルスケアを見てみましょう。", "en": "Jacob: You look at say, healthcare."}, {"ja": "Jacob: ヘルスケアは大きく進化してきました。", "en": "Jacob: And healthcare has evolved tremendously."}, {"ja": "Jacob: 100年前は、ある種の病気は神が引き起こしたと考えられていて、いろいろと奇妙な信念がありました。", "en": "Jacob: A hundred years ago, they used to think that certain diseases were caused by God and, you know, they had all sorts of funky beliefs."}]}, {"id": "default-27", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part7", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Jacob: 資本主義についても同様で、この数十年だけでも大きく進化しています。", "en": "Jacob: And you look at capitalism and it\'s evolved a lot just over the last few decades."}, {"ja": "Jacob: 例えばFacebook上のミーム的な画像、もしそう呼ぶならですが、路上で誰かが餓死していて、背景では裕福な人々が食事をしている、「資本主義はひどい」といったメッセージが添えられているものなどがあります。", "en": "Jacob: And pictures on Facebook, for example, of memes, if you want to call them that, say, of somebody on the street lying there starving and you\'ve got wealthy people in the back eating and it says, you know, capitalism is horrible or whatever."}, {"ja": "Jacob: しかし、ここで重要なのは、資本主義はこれまでのところ圧倒的に最も効果的な経済制度であると証明されているということです。", "en": "Jacob: But I think what\'s important here is that capitalism so far has proven to be the most effective economic institution by far."}, {"ja": "Jacob: 社会的ニーズを満たすという点では、社会主義や共産主義などと比べて、あらゆる面ではるかに効果的でした。", "en": "Jacob: It\'s been much more effective across the board in terms of meeting society\'s needs than socialism and communism and so forth."}, {"ja": "Jacob: もちろん欠点もあります。重要なのは、資本主義の参加者たち―これは社会的にも経済的にも極めて複雑な制度ですが―その参加者たちが学び、耳を傾け、この制度が進化し続け、改善され続ける必要があると理解していることだと思います。", "en": "Jacob: But it certainly has its flaws and I think what\'s important is that the participants within capitalism, and it\'s an extremely complex institution, both social and economic, but the participants are learning and listening and understanding that the institution needs to evolve and continue to improve."}, {"ja": "Jacob: なぜなら、人々の中には資本主義を本質的に悪いものだと見る人もいますが、ただ指をさして「あれは悪い」と言うだけでは状況の改善にはつながりません。特にそれが人類史上最良の制度なのですから。", "en": "Jacob: Because I think people look at capitalism and just some look at it as inherently bad and just pointing your finger and saying that\'s bad isn\'t really going to help the situation, especially when it\'s the best institution in the history of mankind."}, {"ja": "Jacob: それを改善していくことは、本当に素晴らしいことだと思います。", "en": "Jacob: To improve it, I think, is certainly an amazing thing."}, {"ja": "Jacob: そして、この先50年後、100年後にどこに向かっていくのかは、非常に興味深い問いです。", "en": "Jacob: And it\'s really, really interesting where this might head in, 50 years or 100 years."}, {"ja": "Jacob: 資本主義の未来について、何か大胆な予想をお持ちですか。", "en": "Jacob: But do you have any kind of wild guess where you think capitalism might be in the future?"}, {"ja": "Jacob: 50年後、100年後について、ということです。", "en": "Jacob: in 50 years or 100 years."}, {"ja": "Jacob: 前置きとして申し上げますと、資本主義の本質は投資にあります。", "en": "Jacob: Because, and to preface that, the essence of capitalism is investing."}, {"ja": "Jacob: リターンを得る必要があります。", "en": "Jacob: You have to have returns."}, {"ja": "Jacob: リターンを得るには、成長が必要です。", "en": "Jacob: To have returns, you have to have growth."}, {"ja": "Jacob: Facebookのような企業を見ても、彼らは成長しなければなりません。", "en": "Jacob: You look at a company like Facebook and they have to grow."}, {"ja": "Jacob: どうやって成長するのか。", "en": "Jacob: How do you grow?"}, {"ja": "Jacob: 時には価値観で妥協しなければなりません。", "en": "Jacob: Sometimes you have to compromise values."}, {"ja": "Jacob: 社会の価値観で妥協しなければなりません。", "en": "Jacob: You have to compromise society\'s values."}, {"ja": "Jacob: あるいは他の企業の場合は、環境で妥協しなければなりません。", "en": "Jacob: Or with other companies, you have to compromise the environment."}, {"ja": "Jacob: ある時点で、成長は頭打ちになるかもしれません。", "en": "Jacob: So at some point, growth might plateau."}, {"ja": "Jacob: では、これらの異なる価値観をどうバランスさせるのでしょうか。", "en": "Jacob: So how do you balance those different values?"}, {"ja": "Jacob: それを踏まえて、資本主義は今後数年でどこに向かうとお考えですか。", "en": "Jacob: In response to that, where do you think that capitalism might head in X number of years?"}, {"ja": "Jacob: 何か大胆な予想やご意見はありますか。", "en": "Jacob: Do you have any wild guesses or opinion?"}, {"ja": "Luana: あります、Jacob。", "en": "Luana: I do, Jacob."}, {"ja": "Luana: そして、資本主義が最良の経済・政治制度であると証明されてきたという点では、あなたの意見に同意します。", "en": "Luana: And I agree with you in the sense that capitalism has been proved as the best economic and political system."}, {"ja": "Luana: それを示す現実の証拠もあります。", "en": "Luana: We have life proofs of that."}, {"ja": "Luana: その違いを示す最良の例の一つは、北朝鮮と韓国を比較することだと思います。", "en": "Luana: I think that one of the best ways to see how different it is, it\'s comparing North Korea versus South Korea, right?"}, {"ja": "Luana: 異なる制度が、それぞれの国の健全性にどう反映されたか、ということです。", "en": "Luana: Different systems and how actually this reverberated into the health of these nations."}, {"ja": "Luana: しかし、世界のあらゆるものと同じように、強化が必要であり、より包摂的である必要があり、より良いものになる必要があります。そしてそれは、利益のみに焦点を当てないところから始まる必要があります。", "en": "Luana: But yes, like everything in the world, needs enhancements, it needs to be more inclusive, it needs to be better, and it needs to start by not focused only on profit."}, {"ja": "Luana: 私たちが向かっているこの方向性を表す用語ですが、私が考えたものではなく、世界経済フォーラムの創設者兼会長であるKlaus Schwab氏が提唱したものです。", "en": "Luana: And I think where we are heading in this terminology, was not created by me, it was actually created by Klaus Schwab, who is the founder and executive chairman of the World Economic Forum."}, {"ja": "Luana: 彼は、新しい資本主義を「ステークホルダー資本主義」と呼んでいます。", "en": "Luana: And he calls the new capitalism the stakeholder capitalism."}, {"ja": "Luana: つまり、私たちは本質的に「シェアホルダー(株主)資本主義 porate development?"}, {"ja": "Luana: 本質的には、コーポレート・ディベロップメントは社内の投資銀行のような部門です。", "en": "Luana: In essence, corporate development is the area of the company that it\'s almost the in-house investment banking."}, {"ja": "Luana: つまり、会社の成長を考える人々のグループということです。", "en": "Luana: So that meaning is the group of people who are going to be thinking about the growth of the company."}, {"ja": "Luana: 現状維持にとどまらないよう、戦略を考え抜くことが役割です。", "en": "Luana: So not try to prevent the company to stay at the status quo and thinking of the strategies."}, {"ja": "Luana: 成長を資金面で支えてくれる投資家を探したり、買収候補を検討したりします。", "en": "Luana: We\'re going to be looking at investors to finance this growth, looking at potential targets to buy."}, {"ja": "Luana: それがコーポレート・ディベロップメント・チームの注力する分野です。", "en": "Luana: That\'s what the corporate development team is focused on."}, {"ja": "Jacob: それで、Itafosとは何でしたっけ。", "en": "Jacob: And Itafos is a, what is it?"}, {"ja": "Jacob: 豆腐とトウモロコシ?", "en": "Jacob: Tofu and corn?"}, {"ja": "Luana: 豆腐ですか。", "en": "Luana: Tofu."}, {"ja": "Luana: 違います。当社は世界各地に鉱業権を持ち、川下事業まで手がけています。", "en": "Luana: No, we have mining rights in different parts of the world and with a downstream."}, {"ja": "Luana: リン鉱石を採掘し、肥料を製造しているのです。", "en": "Luana: So we mine phosphorus and produce a fertilizer."}, {"ja": "Luana: そしてこの肥料はリン酸ベースなので、大半は大豆やトウモロコシの作物に使われます。", "en": "Luana: And this fertilizer, since it\'s phosphate based, it\'s majority it\'s used in the soybean crops and corn crops."}, {"ja": "Jacob: なるほど。", "en": "Jacob: Okay."}, {"ja": "Jacob: 私はすっかり取り違えていましたね。", "en": "Jacob: I botched that definitely."}, {"ja": "Jacob: では、その分野ではどのようなコーポレート・ディベロップメントの手法を使われているのでしょうか。", "en": "Jacob: So what corporate development tools do you use within that realm?"}, {"ja": "Luana: Itafosでこれまでで最も楽しかった経験の一つをお話しします。当社は2017年、正確には2016年末から2017年にかけて立ち上げました。", "en": "Luana: Well, I think one of the most fun experiences I had so far at Itafos, we started the company in 2017, end of 16, 2017."}, {"ja": "Luana: 当時はブラジルでまさに稼働を始めようとしている事業が一つだけあり、そこで肥料を生産しようとしていました。", "en": "Luana: And at that time, we only had one about to be operational business in Brazil and about to produce fertilizer there."}, {"ja": "Luana: そして、ある機会を見つけました。", "en": "Luana: And we saw an opportunity."}, {"ja": "Luana: Idaho州にある肥料生産会社で、もとはAgriという会社が所有しており、売却されようとしていたのです。", "en": "Luana: We saw this fertilizer producer in Idaho which was formally owned by a company named Agri that was being sold."}, {"ja": "Luana: コーポレート・ディベロップメント・チームの一員として、経営陣、CEO、CFOがその事業を買収するのを支援しました。", "en": "Luana: And as part of the corporate development team, I helped managements, the CEO, the CFO to acquire that business."}, {"ja": "Luana: ですから、ここでの「手法」というのは、良い機会を察知し、深掘りの分析を行うことです。株式調査と同じように、多くのキャッシュフロー予測を行い、もしこの事業を買うとしたら、将来どれだけのキャッシュフローを生み出すのか、その予測にどれだけ自信が持てるのか、見落としはないか、法的な論点は何か、といったことを検討します。", "en": "Luana: So the tool is really like being aware of good opportunities, do a deep dive, do a lot of, again, same thing as we\'re doing in equity research, a lot of cashflow forecasts to see, if we want to buy this business how much this business are going to be generating in the future, how comfortable I am with this forecast, what I might be missing, what are the legal portions."}, {"ja": "Luana: もちろん法務チームも関与しますが、特にESGに関わる部分、つまり環境などについては、私たち自身も認識しておく必要があります。", "en": "Luana: And then the legal team, of course, gets involved, but we might need to be aware, especially in terms of the almost mixing with ESG, but the environmental, et cetera."}, {"ja": "Luana: 鉱業界ではそうした要素が多く絡みますが、いつも面白い仕事です。", "en": "Luana: There\'s a lot of that goes into the mining industry and it\'s always fun."}, {"ja": "Luana: 買収の現場では、", "en": "Luana: It\'s an acquisition."}, {"ja": "Luana: 事業に関する膨大な情報を細かく分解する必要があります。売りに出ていることすら知らなかった事業について、買い手として向き合う会社が価格の目安を提示してきます。それに同意するのか、それとも「いえ、自分で分析した結果、この価格は適正価格より20%高い」と主張するのかを判断する必要があります。", "en": "Luana: We have to really kind of break down a lot of information off of the business, a business that you don\'t know that it\'s there for sale, that the com  fertilizer for."}, {"ja": "Luana: この情報は本当に面白くて、コーポレート・ディベロップメントの良いところでもあります。", "en": "Luana: So this information, this is really cool because that\'s the good part of being the corp development."}, {"ja": "Luana: 会社のあらゆる部門と一緒に仕事ができるのです。", "en": "Luana: You really are able to work with all the departments of the company."}, {"ja": "Luana: コマーシャル部門から、彼らが市場をどう見ているかを把握する必要があります。", "en": "Luana: You need to know from the commercial side, how they are seeing the markets."}, {"ja": "Luana: セールスと話して、「売上はどれくらい伸びているのか」、", "en": "Luana: You need to talk to sales, like how much are sales are going?"}, {"ja": "Luana: 「現場で何を耳にしているのか」、", "en": "Luana: What are you hearing in the hoods?"}, {"ja": "Luana: 「顧客が他の種類の製品に関心を持っているか」といったことを確認します。", "en": "Luana: How. or the client\'s interest in other types of products."}, {"ja": "Luana: 法務チームとも仕事をしますし、財務計画チームとも仕事をします。", "en": "Luana: If you work with the legal team, you work with the financial planning team."}, {"ja": "Luana: ですから、サイロ(縦割り)で仕事をするわけではないという意味で、楽しい仕事です。", "en": "Luana: So it\'s fun in that sense that you are not in a silo."}, {"ja": "Luana: 会社の全員と本当にコミュニケーションを取れる必要があります。", "en": "Luana: You really have to be able to communicate with everyone from the company."}, {"ja": "Jacob: そして、社内で女性としてその役割を担っていることに関連して伺いたいのですが、", "en": "Jacob: And is it true your role as a female in the company and doing what you do?"}, {"ja": "Jacob: どちらの性別の方が楽観的だと思いますか。", "en": "Jacob: Who is the more optimistic gender?"}, {"ja": "Luana: 男性です。", "en": "Luana: Man."}, {"ja": "Jacob: それは生物学的なものですか。", "en": "Jacob: Is that biological?"}, {"ja": "Luana: 生物学的なものだと思います。", "en": "Luana: I think it\'s biological."}, {"ja": "Luana: そう思います。", "en": "Luana: I think so."}, {"ja": "Luana: 男性は、何というか、非常に優れた執行者ですよね。", "en": "Luana: I think men are more, I think sometimes I think when a very good executors, right?"}, {"ja": "Luana: 機会を見つけ出し、レーザーのような集中力でディールの実行・クロージングに取り組みます。", "en": "Luana: Like to spot opportunity and like laser focus on executing, closing the deal."}, {"ja": "Luana: とにかく物事を成し遂げたい、というタイプです。", "en": "Luana: And they just want to get things done."}, {"ja": "Jacob: なぜなら、私たち男性の脳はとても単純だからです。", "en": "Jacob: Because our brain is so simple."}, {"ja": "Jacob: 気が散らないのです。", "en": "Jacob: We don\'t get distracted."}, {"ja": "Luana: 女性と仕事をするときは、私たちはより慎重だと思います。", "en": "Luana: I think when I work with women, we are more cautious."}, {"ja": "Luana: ディールメイキングそのものだけでなく、ディールを本当に最良のものにすることを重視します。", "en": "Luana: It\'s more just, not only about the deal making, but really making the best of the deal."}, {"ja": "Luana: つまり、「これからの3分で決めるのはやめて、よく考えよう」というような姿勢です。", "en": "Luana: So more like, let me not make a decision in the next three minutes and think."}, {"ja": "Luana: ですから、私たち女性は「間(ま)を取る力」を理解していると思います。", "en": "Luana: So I think we know the power of a pause."}, {"ja": "Jacob: ところで、生物学的な違いといえば、自分の犬を飼っていたときのことを思い出します。当時タイにいて、私の犬が発情期でした。", "en": "Jacob: Well, you know, the biological differences I noticed when I had my dog, I was in Thailand at the time and my dog was in heat."}, {"ja": "Jacob: あれが初めて強く印象に残った瞬間だったと思います。", "en": "Jacob: And I think that\'s the first time it really struck me."}, {"ja": "Jacob: 私の犬が発情期で、何という光景か。他のオス犬たちが何マイルもうちまでついてきて、生物学的な欲求であるとはいえ、人間にできるあらゆる手段でうちの犬を妊娠させようとしたのです。", "en": "Jacob: My dog was in heat and oh my God, I mean these dogs followed my dog home for miles and miles and they would do anything humanly possible just to impregnate her, which of course is a biological desire."}]}, {"id": "default-28", "topic": "M&A Talk Podcast", "title": "M&Aトーク Part8", "source": "M&A Talk Podcast", "isDefault": true, "pairs": [{"ja": "Jacob: その後、Yellowstone国立公園を車で走っているとき、バイソンが互いに角で突き合い、死に至るまで戦っているのを目にしました。すべては別のメスと遺伝子を残す機会を得るためです。", "en": "Jacob: Then later on I\'m driving through Yellowstone and I see Bison goring each other to death just so they can have the opportunity to be able to pass on their genes with another female."}, {"ja": "Jacob: こうした行動には生物学的な根拠があり、それは投資家の視点においても同様だというのは、興味深いことです。", "en": "Jacob: So it\'s interesting that these behaviors, that there\'s a biological basis in these behaviors and even in the investors from their point of view as well."}, {"ja": "Jacob: Warren Buffettの本、正確には彼自身の本ではなく、彼の年次株主への手紙に基づいて書かれた彼に関する本を読むと、", "en": "Jacob: You read Warren Buffett in his, not his books, but books about him, which are derived from his annual shareholder letters."}, {"ja": "Jacob: 彼は人間の行動について非常に多くを語っています。", "en": "Jacob: And he talks so much about human behavior."}, {"ja": "Jacob: Ray Dalioも同様だと思いますが、あなたは意思決定のプロセスにどれくらいの頻度で人間の行動を取り入れていますか。", "en": "Jacob: I believe Ray Dalio does as well, but how often do you incorporate human behavior into your decision-making process?"}, {"ja": "Luana: 私には、両親が精神分析家であったことによる恩恵があります。もっとも、それは時にデメリットにもなりますが。", "en": "Luana: I have the benefits, which sometimes comes with disadvantages, for being raised by two psychoanalysts."}, {"ja": "Luana: そのため、人間の行動やフロイトについて常に話題にされる家庭で育ち、その後ファイナンスの世界に進みました。", "en": "Luana: So I was raised in a house that was always talking about human behaviors, Freud, and I went into finance."}, {"ja": "Luana: 学んでいた頃の話ですが、私はブラジルで学士課程を修了しました。", "en": "Luana: And when I was studying, back in college, I did my undergrads in Brazil."}, {"ja": "Luana: その頃、行動ファイナンス(behavioral finance)という研究分野が大きく盛り上がっており、組織行動論や投資における行動についても、事実として裏付けられつつありました。", "en": "Luana: That\'s when the behavior finance class of study was actually really upsurging and more and more organization behavior and the behavior in investments have been almost proven to be a fact."}, {"ja": "Luana: ですから私は、人間として、自分自身の少なからぬ部分を、時には大きく、自らの意思決定の中に投影しているということを常に意識しています。時には数字を無視してしまうこともあります。数字はある方向を示してくれているのに、", "en": "Luana: So for me, I\'m always aware that as humans, we are putting a little bit, if not a lot of ourselves in the decisions we are making, we sometimes we discard the numbers, the numbers can be pointing us to a direction."}, {"ja": "Luana: 自分が経験している心理的な影響のせいで、結局その逆の判断を下してしまうことがあるのです。", "en": "Luana: And because of some psychological effects that we are going through, we decided to take the opposite side."}, {"ja": "Luana: ですから、自分の心理的な行動が判断に影響を与えるということを認識し、そこから距離を置き、いかなる種類の決定にもバイアスを生まないように努めています。", "en": "Luana: So I really try to incorporate my, to be aware that our psychological behavior will have an impact and distance myself off that to not create bias in any type of decision."}, {"ja": "Jacob: ところで、精神分析家とは何をする職業なのですか。", "en": "Jacob: What does a psychoanalyst do, by the way?"}, {"ja": "Luana: 精神分析家は、私のように数字を分析する代わりに、人を分析します。", "en": "Luana: A psychoanalyst, instead of analyzing numbers like I do, they analyze people."}, {"ja": "Luana: 精神分析家のオフィスに行くと、本質的には45分間、悩んでいることについて話し、トラウマや子ども時代を探っていく、というものです。", "en": "Luana: So a psychoanalyst is essentially you go to a psychoanalyst\'s office and for 45 minutes you talk about what has been bothering you and trying to figure out your traumas, childhood."}, {"ja": "Jacob: ああ、つまり心理学者(psychologist)のことですか。", "en": "Jacob: Oh, so a psychologist?"}, {"ja": "Luana: それとは少し違います。", "en": "Luana: A little bit different than that."}, {"ja": "Luana: ええ、心理学者に似ています。", "en": "Luana: Yeah, it\'s similar to a psychologist."}, {"ja": "Luana: 違いは少しだけです。", "en": "Luana: It\'s a little bit the difference."}, {"ja": "Luana: 精神分析家(psychoanalyst)は、主にフロイト派のアプローチに従う点が特徴です。", "en": "Luana: It\'s mainly a psychoanalyst follows much of a Freudian approach."}, {"ja": "Luana: つまり、Sigmund Freud派の精神分析家に対して、心理学者は必ずしもフロイトのアプローチに従うわけではありません。", "en": "Luana: So Sigmund Freud versus a psychologist not necessarily is following Freud\'s approach."}, {"ja": "Jacob: なるほど、非常に、非常に、非常に興味深いですね。", "en": "Jacob: Well, very, very, very interesting."}, {"ja": "Jacob: 性別間の違いとして、他にどんなことに気づきますか。また、ファイナンス業界で女性として働くというのは、どのような感じですか。", "en": "Jacob: What other differences do you notice between the genders and then what\'s it like being a woman or a female in finance?"}, {"ja": "Luana: ええ、本当に興味深い体験でした。", "en": "Luana: Yeah, has been for sure an interesting ride here."}, {"ja": "Luana: 例えばRaymond James時代、同僚2人が辞めたことで、ある時期は私が24人の男性に囲まれた唯一の女性として1年間過ごしました。", "en": "Luana: Like back at Raymond James, for example, for one year, for one period that two of my colleagues had left, I was the only woman around 24 men."}, {"ja": "Luana: 業界がどれほど男性優位なのかを目の当たりにするのは、興味深いことです。", "en": "Luana: And it\'s just interesting to see how male dominance the industry has."}, {"ja": "Luana: 現在のItafosのコーポレート・ディベロップメント・チームでも、私は男性優位の取締役会、男性のみの経営陣に囲まれた唯一の女性です。", "en": "Luana: And in the corporate dev team, now in Itafos, I\'m also the only woman surrounded by a board of directors that it\'s male dominant, it\'s management that it\'s only male."}, {"ja": "Luana: 男性と仕事をすることで私が好きなのは、その実践的なところです。", "en": "Luana: I think it\'s what I like about working with men, it\'s very practical."}, {"ja": "Luana: 膨大な詳細に圧倒されそうになる場面でも、男性は「ここで線を引いて、次のステップに進もう」と適切に区切る力を持っていると思います。", "en": "Luana: I think men have that quality of whenever we\'re getting to very much overwhelming details, man knows how to kind of draw the line of, hey, let\'s cut here and move to the next step."}, {"ja": "Luana: 欠けていると思うのは〜", "en": "Luana: I think what things that are missing-"}, {"ja": "Jacob: 褒め言葉を続けてください。", "en": "Jacob: Keep the compliments going."}, {"ja": "Luana: 欠けていると思うのは〜", "en": "Luana: I think what it\'s missing is-"}, {"ja": "Jacob: おっと。", "en": "Jacob: Uh-oh."}, {"ja": "Jacob: おっと。", "en": "Jacob: Uh-oh."}, {"ja": "Luana: それは、エゴが多いということです。", "en": "Luana: I think what it says is there\'s a lot of ego."}, {"ja": "Luana: つまり、ご存じの通り、", "en": "Luana: That it\'s, you know, it\'s."}, {"ja": "Luana: 彼らは大きなエゴを持っており、そこで心理的影響が現れ、最良の判断を妨げてしまうことがあります。", "en": "Luana: They have big egos and that\'s when you can see the psychological effects, really kind of not impairing the best decision."}, {"ja": "Luana: 女性はそこまでエゴに駆られていません。「あなたの判断の方がより筋が通っていて、より理にかなっているなら、ぜひそうしましょう。私たちは同じチームですから」という姿勢になります。", "en": "Luana: I think women, we are not that ego driven and it\'s, hey, if your decision tells more and makes more sense, by all means, we\'re all on the same team here."}, {"ja": "Luana: 「私の決定ではなく、あなたの決定に従いましょう」と。", "en": "Luana: Let\'s follow your decision, not mine."}, {"ja": "Luana: エゴが制約になっている場面を目にすることがあります。", "en": "Luana: And sometimes I can see ego being a constraint."}, {"ja": "Luana: そして二つ目は、EQ(感情的知性)です。物事を判断する際、より深く、必要なだけ掘り下げて分析する判断軸を持つこと、これは女性が本当に得意な分野だと思います。", "en": "Luana: And secondly, I think it\'s that EQ, that emotional intelligence of judging certain things, judging the center for analyzing certain things with more in-depth that it\'s necessary that women can really do a good job."}, {"ja": "Luana: 「うーん、落ち着いた気持ちで考えてみよう」というような姿勢です。", "en": "Luana: That\'s like, hmm, let me get into this calm set of mind."}, {"ja": "Luana: 時間はかかるかもしれませんが、それだけの価値はあります。", "en": "Luana: It\'s going to take me maybe longer, but it will be worth it."}, {"ja": "Jacob: EQというと、Daniel Golemanの……あの本のタイトルは何でしたっけ。", "en": "Jacob: So EQ along the lines of like Daniel Goleman\'sWhat\'s the name of his book?"}, {"ja": "Jacob: 『EQ こころの知能指数(Emotional Intelligence)』ですか。", "en": "Jacob: Is it emotional intelligence?"}, {"ja": "Luana: 感情的知性(Emotional Intelligence)、はい。", "en": "Luana: Emotional intelligence, yes."}, {"ja": "Luana: これまでに、感情的知性の高い男性の同僚にもたくさん出会いました。ただ、女性の方がより自然に持っている資質だと感じます。", "en": "Luana: I think, and look, I met a lot of male colleagues with high emotional intelligence in these years, but I see something, I think it\'s more natural in women."}, {"ja": "Jacob: 以前にも聞かれたことがあるかは分かりませんが、女性として、経営者や、弁護士、会計士、株式アナリストといった専門職の方々へのアドバイスはありますか。", "en": "Jacob: I don\'t know if that\'s been asked before, but as a female, what\'s your advice to business owners or anybody in the profession, attorney, accountant, equity analyst, so forth."}, {"ja": "Jacob: 彼らはあなたとミーティングをしますが、相手が女性だとは知らされていない。あなたがドアから入ってきて、顔を上げた瞬間に、「女性だったのか」と驚く、というような場面です。", "en": "Jacob: They have a meeting with you they don\'t know it\'s a female, you come around the door and they look up and boom, and they\'re not expecting a female."}, {"ja": "Jacob: 違う扱いを受けたいと思いますか。あるいは、男性がどんな間違いをしているのを目にしますか。", "en": "Jacob: Do you want to be treated differently or what mistakes do you see men make?"}, {"ja": "Jacob: 彼らに対するアドバイスや、あなた自身が受けている扱いについて教えてください。", "en": "Jacob: What\'s your advice to them and how you\'re treated?"}, {"ja": "Luana: 私自身はキャリアを通じて非常に幸運で、女性であることを理由に違う扱いを受けたと感じたことはありません。ただ友人の中には経験した人もいて、例えば「女性がいるから、会社のストレスフルな場面であまりストレスを与えないようにしよう」というような、", "en": "Luana: I have been extremely lucky throughout my career that I have never felt treated differently for being a female, but I know some of my friends have in the sense of oh, let\'s not get really stressed in a moment of stress of a company because there is a female there."}, {"ja": "Luana: そういう形で、その事業を女性向きに調整しようとする例があると聞いています。", "en": "Luana: So really trying to make that business more suited for female."}, {"ja": "Luana: ただ、私自身はそのような経験をしたことはありません。", "en": "Luana: But I have never experienced that."}, {"ja": "Luana: 歴代の男性の上司たちと仕事ができたのは、本当に幸運でした。", "en": "Luana: I was very lucky to work with all the male bosses that I had."}, {"ja": "Luana: 常に平等に扱われていると感じてきました。", "en": "Luana: I always felt treated equally."}, {"ja": "Luana: 一つ、時々気になることがあって、ぜひアドバイスとして申し上げたいことがあります。私たちは「#MeToo」の影響に深く関わるようになり、男女のより親密な接触を過度に恐れるあまり、男性が女性をディナー、ビジネスディナー、ランチ、ハッピーアワーに誘いたがらない場面が見られます。", "en": "Luana: I think one thing that bothers me sometimes that I would definitely give as an advice is the entire, like we became so much involved into this hashtag MeToo, so much afraid of the male, female more contact that sometimes I think men just don\'t want to invite a female for a dinner, a business dinner or a lunch dinner or happy hour dinner."}, {"ja": "Luana: 多くの男性がそうしているのを目にします。例えばUCLAでも、私の方から男性の友人に声をかけなければなりません。", "en": "Luana: I see a lot of like males doing that, I see very clear like at UCLA, for example, I have to reach out to my male friends."}, {"ja": "Luana: そうでないと、彼らは私に声をかけることに少し躊躇しているように感じます。", "en": "Luana: Otherwise I felt that they felt a bit worried to reach out to me."}, {"ja": "Luana: それは#MeTooの一つの結果なのだ
