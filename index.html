<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="英作文">

<title>口頭英作文トレーニング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f5f4f0; min-height: 100vh; }
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }
.top-bar { background: #fff; border-bottom: 1px solid #e8e6e0; padding: 14px 20px 12px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; }
.top-bar-title { font-size: 15px; font-weight: 600; color: #1a1a1a; flex: 1; }
.back-btn { font-size: 14px; color: #0f6e56; cursor: pointer; white-space: nowrap; padding: 4px 0; }
.list-hero { padding: 24px 20px 4px; }
.list-hero h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; letter-spacing: -0.02em; }
.list-hero p { font-size: 13px; color: #999; margin-top: 4px; }
.article-list { padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 10px; max-width: 600px; width: 100%; margin: 0 auto; }
.article-card { background: #fff; border-radius: 14px; border: 1px solid #e8e6e0; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }
.article-card-tap { cursor: pointer; flex: 1; display: flex; align-items: center; gap: 14px; }
.article-card-tap:active { opacity: 0.7; }
.article-num { width: 36px; height: 36px; border-radius: 10px; background: #f0f9f5; color: #0f6e56; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.article-num.custom { background: #f5f0fa; color: #7c3aed; font-size: 18px; }
.article-info { flex: 1; min-width: 0; }
.article-topic { font-size: 11px; color: #999; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.article-title { font-size: 15px; font-weight: 600; color: #1a1a1a; line-height: 1.35; }
.article-meta { font-size: 11px; color: #bbb; margin-top: 3px; }
.article-arrow { color: #ccc; font-size: 20px; flex-shrink: 0; }
.delete-btn { font-size: 12px; color: #cc0033; background: #fff0f3; border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.add-card { background: #fff; border-radius: 14px; border: 1.5px dashed #b8dfd4; padding: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; color: #0f6e56; font-size: 15px; font-weight: 600; }
.add-card:active { background: #f0f9f5; }
.form-body { flex: 1; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 600px; width: 100%; margin: 0 auto; overflow-y: auto; }
.form-section { background: #fff; border-radius: 14px; border: 1px solid #e8e6e0; overflow: hidden; }
.form-section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #999; padding: 12px 16px 0; text-transform: uppercase; }
.field { padding: 8px 16px 10px; border-bottom: 1px solid #f0eee8; }
.field:last-child { border-bottom: none; }
.field label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
.field input { width: 100%; font-size: 15px; font-family: inherit; color: #1a1a1a; background: transparent; border: none; outline: none; line-height: 1.5; padding: 2px 0; }
.ocr-area { background: #fff; border-radius: 14px; border: 1.5px dashed #b8dfd4; overflow: hidden; }
.ocr-upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 22px; cursor: pointer; color: #0f6e56; font-size: 15px; font-weight: 600; }
.ocr-upload-label:active { background: #f0f9f5; }
.ocr-preview { width: 100%; max-height: 220px; object-fit: contain; display: none; }
.ocr-run-btn { width: 100%; padding: 14px; background: #0f6e56; color: #fff; border: none; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; display: none; }
.ocr-run-btn:active { background: #085041; }
.ocr-status { padding: 12px 16px; font-size: 13px; color: #888; text-align: center; display: none; }
.pairs-list { display: flex; flex-direction: column; }
.pair-item { border-bottom: 1px solid #f0eee8; padding: 12px 16px; }
.pair-item:last-child { border-bottom: none; }
.pair-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pair-num-label { font-size: 11px; font-weight: 600; color: #bbb; }
.pair-del-btn { font-size: 11px; color: #cc0033; background: #fff0f3; border: none; border-radius: 6px; padding: 3px 8px; cursor: pointer; font-family: inherit; }
.pair-row { margin-bottom: 6px; }
.pair-row label { font-size: 10px; color: #bbb; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
.pair-row textarea { width: 100%; font-size: 14px; font-family: inherit; color: #1a1a1a; background: transparent; border: none; outline: none; resize: none; line-height: 1.55; min-height: 44px; padding: 2px 0; }
.add-pair-btn { margin: 2px 16px 14px; padding: 10px; background: #f5f4f0; border: none; border-radius: 10px; font-size: 14px; color: #0f6e56; font-weight: 600; font-family: inherit; cursor: pointer; display: block; width: calc(100% - 32px); }
.add-pair-btn:active { background: #e8e6e0; }
.save-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
.save-btn:active { background: #333; }
.progress-sub { padding: 8px 20px 10px; background: #fff; border-bottom: 1px solid #e8e6e0; }
.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-bar { flex: 1; height: 3px; background: #e8e6e0; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #0f6e56; border-radius: 2px; transition: width 0.3s ease; }
.counter { font-size: 11px; color: #999; white-space: nowrap; }
.practice-body { flex: 1; display: flex; flex-direction: column; padding: 20px 16px 120px; gap: 14px; max-width: 600px; width: 100%; margin: 0 auto; }
.card { background: #fff; border-radius: 14px; border: 1px solid #e8e6e0; padding: 22px 20px; }
.card-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #bbb; margin-bottom: 10px; }
.card-text { font-size: 17px; line-height: 1.7; color: #1a1a1a; }
.card-en { border-top: 3px solid #0f6e56; cursor: pointer; }
.card-en:active { background: #f9f9f7; }
.en-placeholder { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px 0 10px; color: #bbb; font-size: 14px; }
.en-revealed { font-size: 16px; line-height: 1.75; color: #1a1a1a; }
.practice-nav { display: flex; gap: 10px; width: 100%; position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 28px; background: #f5f4f0; border-top: 1px solid #e8e6e0; z-index: 10; }
.practice-nav button { flex: 1; padding: 14px 10px; font-size: 15px; font-family: inherit; background: #fff; border: 1px solid #e8e6e0; border-radius: 12px; color: #1a1a1a; cursor: pointer; }
.practice-nav button:active { background: #f5f4f0; }
.practice-nav button:disabled { opacity: 0.3; }
.practice-nav button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.practice-nav button.primary:active { background: #333; }
</style>
</head>
<body>

<!-- パスワード画面 -->
<div id="screen-password" style="position:fixed;inset:0;background:#f5f4f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:40px 24px;">
  <div style="font-size:28px;font-weight:700;color:#1a1a1a;letter-spacing:-0.02em;margin-bottom:8px;">英作文トレーニング</div>
  <div style="font-size:14px;color:#999;margin-bottom:40px;">パスワードを入力してください</div>
  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;">
    <input id="pw-input" type="password" placeholder="パスワード"
      style="width:100%;padding:14px 16px;font-size:16px;font-family:inherit;border:1px solid #e8e6e0;border-radius:12px;background:#fff;outline:none;text-align:center;letter-spacing:0.1em;"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()" style="width:100%;padding:14px;font-size:16px;font-weight:600;font-family:inherit;background:#1a1a1a;color:#fff;border:none;border-radius:12px;cursor:pointer;">開く</button>
    <div id="pw-error" style="text-align:center;font-size:13px;color:#cc0033;min-height:20px;"></div>
  </div>
</div>

<script>
(function(){
  var PW = 'hottea';
  var KEY = 'eigo_auth';
  function checkPw(){
    var val = document.getElementById('pw-input').value;
    if(val === PW){
      sessionStorage.setItem(KEY, '1');
      document.getElementById('screen-password').style.display = 'none';
    } else {
      document.getElementById('pw-error').textContent = 'パスワードが違います';
      document.getElementById('pw-input').value = '';
    }
  }
  window.checkPw = checkPw;
  // APIキー設定画面の表示
  window.showApiKeyScreen = function(){ document.getElementById("screen-apikey").style.display = "flex"; };
  window.saveApiKey = function(){
    var key = document.getElementById('api-input').value.trim();
    if (!key.startsWith('sk-ant-')) {
      document.getElementById('api-error').textContent = 'APIキーは sk-ant- で始まります';
      return;
    }
    localStorage.setItem('eigo_api_key', key);
    document.getElementById('screen-apikey').style.display = 'none';
  };
  if(sessionStorage.getItem(KEY) !== '1'){
    document.addEventListener('DOMContentLoaded', function(){
      document.getElementById('screen-password').style.display = 'flex';
    });
  } else {
    document.getElementById('screen-password').style.display = 'none';
  }
})();

// ★ APIキーをここに入力してください ★
const ANTHROPIC_API_KEY = localStorage.getItem('eigo_api_key') || '';
</script>


<!-- APIキー設定画面 -->
<div id="screen-apikey" style="position:fixed;inset:0;background:#f5f4f0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9998;padding:40px 24px;">
  <div style="font-size:22px;font-weight:700;color:#1a1a1a;letter-spacing:-0.02em;margin-bottom:8px;">APIキーの設定</div>
  <div style="font-size:13px;color:#999;margin-bottom:8px;text-align:center;">Anthropic APIキーを入力してください</div>
  <div style="font-size:12px;color:#bbb;margin-bottom:32px;text-align:center;">console.anthropic.com で取得できます</div>
  <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;">
    <input id="api-input" type="password" placeholder="sk-ant-..."
      style="width:100%;padding:14px 16px;font-size:14px;font-family:inherit;border:1px solid #e8e6e0;border-radius:12px;background:#fff;outline:none;letter-spacing:0.04em;">
    <button onclick="saveApiKey()" style="width:100%;padding:14px;font-size:16px;font-weight:600;font-family:inherit;background:#1a1a1a;color:#fff;border:none;border-radius:12px;cursor:pointer;">保存して開始</button>
    <div id="api-error" style="text-align:center;font-size:13px;color:#cc0033;min-height:20px;"></div>
  </div>
</div>

<!-- 一覧 -->
<div id="screen-list" class="screen active">
  <div style="display:flex;justify-content:flex-end;padding:12px 20px 0;"><span onclick="document.getElementById("screen-apikey").style.display="flex"" style="font-size:12px;color:#999;cursor:pointer;">⚙ APIキー設定</span></div>
  <div class="list-hero">
    <h1>英作文トレーニング</h1>
    <p>記事を選んで練習しましょう</p>
  </div>
  <div class="article-list" id="article-list"></div>
</div>

<!-- 追加・編集 -->
<div id="screen-edit" class="screen">
  <div class="top-bar">
    <div class="back-btn" onclick="showList()">← キャンセル</div>
    <div class="top-bar-title" id="edit-title">記事を追加</div>
  </div>
  <div class="form-body">

    <!-- 画像OCRセクション -->
    <div class="ocr-area">
      <label class="ocr-upload-label" for="ocr-input">
        <span style="font-size:22px">📷</span>
        <span>画像をアップロードしてOCR</span>
      </label>
      <input type="file" id="ocr-input" accept="image/*" style="display:none" onchange="onImageSelected(event)">
      <img id="ocr-preview" class="ocr-preview" alt="preview">
      <div id="ocr-status" class="ocr-status"></div>
      <button id="ocr-run-btn" class="ocr-run-btn" onclick="runOcr()">この画像から和文・英文を抽出する</button>
    </div>

    <div class="form-section">
      <div class="form-section-label">記事情報</div>
      <div class="field"><label>英語トピック（任意）</label><input id="f-topic" type="text" placeholder="例：Corporate Governance"></div>
      <div class="field"><label>日本語タイトル</label><input id="f-title" type="text" placeholder="記事のタイトルを入力"></div>
      <div class="field"><label>出典（任意）</label><input id="f-source" type="text" placeholder="例：読売新聞 2026年5月1日"></div>
    </div>
    <div class="form-section">
      <div class="form-section-label">対訳ペア</div>
      <div class="pairs-list" id="pairs-list"></div>
      <button class="add-pair-btn" onclick="addPair()">＋ 対訳ペアを追加</button>
    </div>
    <button class="save-btn" onclick="saveArticle()">保存する</button>
  </div>
</div>

<!-- 練習 -->
<div id="screen-practice" class="screen">
  <div class="top-bar">
    <div class="back-btn" onclick="showList()">← 一覧</div>
    <div class="top-bar-title" id="practice-title"></div>
  </div>
  <div class="progress-sub">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="prog"></div></div>
      <div class="counter" id="counter"></div>
    </div>
  </div>
  <div class="practice-body">
    <div class="card">
      <div class="card-label">和文 — 英訳してみましょう</div>
      <div class="card-text" id="ja-text"></div>
    </div>
    <div class="card card-en" onclick="toggleEn()">
      <div class="card-label">英文</div>
      <div id="en-content"></div>
    </div>
  </div>
  <div class="practice-nav">
    <button id="btn-prev" onclick="prev()">← 前へ</button>
    <button class="primary" id="btn-reveal" onclick="toggleEn()">英文を見る</button>
    <button id="btn-next" onclick="next()">次へ →</button>
  </div>
</div>

in the Party Charter, and died midway through his third term."}, {"ja": "後を継いだラム氏は長年公安畑を歩み、前書記長の下で公安相として汚職摘発に辣腕を振るった。", "en": "Lam, who took over from the previous general secretary, has long served in the field of public security. Under the former general secretary, Lam demonstrated a strong hand in cracking down on corruption as public security minister."}, {"ja": "多数の党幹部を失脚させ、自身の権力基盤を固めたとされる。", "en": "He is said to have ousted numerous top party officials and solidified his own power base."}, {"ja": "ラム氏は1月の党大会で、2026〜30年の経済成長率を年平均10%以上とし、45年には先進国入りするとの国家目標を掲げた。", "en": "At the Party Congress in January, Lam set national goals of achieving an average annual economic growth rate of over 10% in the period from 2026 to 2030 and pushing his country to become a developed nation by 2045."}, {"ja": "経済成長を実現するため、自身に権力を集中させ、意思決定の迅速化を図る考えなのだろう。", "en": "To achieve this economic growth, he likely intends to centralize power in his own hands to realize speedy decision-making."}, {"ja": "ベトナムはこれまで、中国やロシアと友好関係を維持する一方で、米国とも関係を強化する「全方位外交」を基本としてきた。", "en": "Vietnam has historically pursued a policy of \'omnidirectional diplomacy,\' in which it has strengthened its ties with the United States while simultaneously maintaining friendly relations with China and Russia."}, {"ja": "ラム氏は、国家主席就任後の初外遊先に中国を選び、習近平国家主席との会談で対中関係の発展と経済協力への期待を示した。", "en": "Lam chose China as the destination for his first overseas trip since assuming the role of president. During his meeting with Chinese President Xi Jinping, Lam said the development of relations with China is a \'top priority\' and expressed hope for economic cooperation."}, {"ja": "一党支配下で集団指導が後退すると、トップの判断の誤りが修正されにくくなる。", "en": "However, as has been seen in China\'s past, when collective leadership recedes under one-party rule, it becomes difficult to correct errors made by the top leader."}, {"ja": "日本は東南アジア諸国連合（ASEAN）の主要国であるベトナムを重視してきた。", "en": "Japan has placed importance on Vietnam for a long time, as it is a key member of the Association of Southeast Asian Nations."}, {"ja": "高市首相は近く、ベトナムなどを訪問する予定だ。日越が連携を深める契機にしてほしい。", "en": "Prime Minister Sanae Takaichi is scheduled to visit Vietnam and another country soon. The visit should serve as an opportunity to deepen cooperation between Japan and Vietnam."}]}, {"id": "default-2", "topic": "Corporate Governance Code", "title": "現金ため込む経営を改めたい", "source": "読売新聞 2026年4月20日", "isDefault": true, "pairs": [{"ja": "現金ため込む守りの経営が日本経済の課題と指摘されながら、新たに策定される企業統治指針を踏まえ、資金を成長への投資に振り向けていくべきだ。", "en": "Although a defensive management style of retaining cash and deposits has been identified as a challenge for the Japanese economy, it shows no signs of changing. Funds should be redirected toward investments for growth based on the set-to-be-revised Corporate Governance Code."}, {"ja": "金融庁と東京証券取引所が定める企業統治指針は、上場企業に対し、企業価値の向上を求める行動原則と言える。", "en": "The code established by the Financial Services Agency and the Tokyo Stock Exchange can be described as a set of principles requiring listed companies to take actions that enhance corporate values."}, {"ja": "守らない場合は投資家に説明する必要があるため、実質的な拘束力を持っている。", "en": "Since companies must explain to investors if they fail to comply, the code effectively has binding force."}, {"ja": "安倍政権の下で、成長戦略の柱として2015年に初めて発布されたこの指針は、株主との対話の充実や社外取締役を増やして取締役会の機能を強化することなどを定めた。", "en": "The code was first formulated in 2015 under the administration of then Prime Minister Shinzo Abe as a pillar of its growth strategy, and stipulates measures such as enhancing dialogue with shareholders and strengthening the functions of the board of directors by increasing the number of outside directors."}, {"ja": "18年と21年に改訂された指針がこれまで一定の効果を発揮したことは間違いない。", "en": "There is no doubt that the code, revised in 2018 and 2021, has been effective to a certain degree thus far."}, {"ja": "企業収益力は向上し、外国からの投資も増えた。", "en": "Corporate profitability has improved, and foreign investment has increased."}, {"ja": "日経平均株価は過去最高値を更新し、6万円に近づいている。", "en": "The Nikkei Stock Average has reached a record high and is approaching 60,000."}, {"ja": "金融庁などは現在、今夏をめどに5年ぶりに指針を改訂する検討を進めている。", "en": "The FSA and others are currently considering revising the code for the first time in five years, with a target date of this summer."}, {"ja": "改訂案には、取締役会が現金などの資産を不動産などの経営資源に有効活用できているか、不断に検証すべきだと明記した。", "en": "The draft of the revised code explicitly calls for boards of directors to continuously verify whether their companies are effectively utilizing management resources such as cash and deposits, as well as real estate."}, {"ja": "企業が漫然と現金を眠らせたままにするのは難しくなる。", "en": "The revised code will make it difficult for companies to simply leave their cash and deposits idle."}, {"ja": "リスクをとって成長分野への投資を進めなければならない。", "en": "They must take risks and invest in growth sectors."}, {"ja": "持続的な成長に向けては、企業統治の強化も課題だ。", "en": "Strengthening corporate governance is also a key challenge for achieving sustainable growth."}, {"ja": "形式的に社外取締役を整えたものの、内実を伴わない事例が枚挙にいとまがないからだ。", "en": "This is because there are countless cases of companies merely introducing outside directors as a formality, without any substance."}, {"ja": "最近もモーター大手ニデックで巨額の不正会計が発覚し、取締役会の機能不全があらわになった。", "en": "Recently, massive accounting fraud was uncovered at major motor manufacturer Nidec Corp, exposing the dysfunction of its board of directors."}, {"ja": "改訂案で、独立社外取締役が、経営陣の選任や解任に主体的に関わるよう求めることにしたのは妥当だ。", "en": "It is appropriate that the revised code will require independent outside directors to take a proactive role in the appointment and dismissal of members of management teams."}, {"ja": "企業は指針を踏まえた具体策を練る必要がある。", "en": "Companies must devise concrete measures based on the code."}, {"ja": "株主還元策にばかり追われて商品やサービスの魅力を高める戦略を強化しなければ、国民が恩恵を感じられるはずはなく経済の成長も限られる。", "en": "Unless companies stop focusing solely on measures to give returns to shareholders and instead strengthen strategies to enhance the appeal of their products and services, the public will not feel the benefits, and economic growth will remain limited."}, {"ja": "24年度の配当総額も23兆円と過去最高を記録した。株価上昇を狙った安易な自社株買いだ。", "en": "In fiscal 2024, total dividends paid out also reached a record high of 23 trillion yen. As a reckless result, stock buybacks aimed solely at driving up stock prices have increased."}]}, {"id": "default-3", "topic": "Disasters and pets", "title": "避難場所を平時から考えたい", "source": "読売新聞 2026年4月11日", "isDefault": true, "pairs": [{"ja": "大規模な災害が起きるたびに、被災者のペットをどう扱うかが問題になってきた。ペットがいるために避難所に入るのを拒まれ、車中泊を強いられたケースもある。", "en": "Every time a major disaster occurs, questions arise about how to accommodate the pets of people affected. There have been cases where people were denied entry to evacuation centers because they had pets with them, forcing them to sleep in their cars.\\""}, {"ja": "一方、動物が苦手な人やアレルギーのある人が、ペットと同じ場所で避難生活を送ることを不安に思うのも無理はない。", "en": "However, it is understandable that people who are uncomfortable around animals or have allergies feel anxious about being in the same space as pets during an evacuation.\\""}, {"ja": "ペットを飼っている人とそうでない人が、ともに困難を乗り越えるにはどうしたら良いか。社会全体で考えておきたい。", "en": "Society as a whole should consider how people with and without pets can overcome these difficulties together.\\""}, {"ja": "環境省は近く、人とペットの災害対策の指針を改定する。飼い主とペットが一緒に逃げる「同行避難」を普及させると同時に、飼い主に備えを促す狙いがある。", "en": "The Environment Ministry will soon revise disaster response guidelines for people and pets. The aim is to promote the practice of owners and their pets evacuating together, while also encouraging owners to prepare in advance.\\""}, {"ja": "新たな指針では、ペットの受け入れについて、避難所となる学校などと事前に協議し、受け入れるペット数などの情報を共有するよう、自治体に求める予定だ。避難者の居住空間とは別に、ペット用スペースを設けることも促す。", "en": "Under guidelines to be revised, the ministry plans to require local governments to discuss in advance with schools and other potential evacuation centers regarding the acceptance of pets and share information such as the number of pets that can be accommodated. Setting up spaces for pets, separate from the living quarters of evacuees, will also be encouraged.\\""}, {"ja": "この指針が最初に策定されたのは2013年のことだ。東日本大震災で、被災地に取り残されたペットが野生化して数が増え、行政などが捕獲に迫われるケースがあったためだ。ペットの餓死も多かったとされている。", "en": "Guidelines of this kind were first formulated in 2013. Their creation was prompted by cases of pets that were left behind in the areas affected by the Great East Japan Earthquake. The animals became feral and grew in number, forcing local governments and other entities to deal with their capture. It is also believed that many pets starved to death.\\""}, {"ja": "そうした状況を改善しようと、同行避難を基本とする指針をまとめた経緯がある。", "en": "The guidelines were compiled to improve such situations, making a standard practice for evacuating with pets.\\""}, {"ja": "だが、一昨年の能登半島地震では、避難所に入れず、損壊した自宅にペットととどまった人がいた。反対に、避難所でペットに対する苦情が出た例もあった。", "en": "However, following the Noto Peninsula Earthquake two years ago, some people were unable to enter evacuation centers and remained in their damaged houses with their pets. There were complaints about pets at some evacuation centers as well.\\""}, {"ja": "トラブルを防ぐためには、地域住民に対し、どの避難所でペットを受け入れるのかあらかじめ周知しておくことも重要になる。", "en": "To prevent such problems, it is also important for local governments to let residents know in advance which evacuation centers will accept pets.\\""}, {"ja": "過酷な避難生活が続いて心身の不調に陥り、命を落とす「災害関連死」が増えている。飼い主がペットと一緒に避難できれば、災害関連死を減らす一助にもなるのではないか。動物との絆がストレスを癒やす場合もあるだろう。", "en": "There has been an increase in the number of people dying after developing mental and physical ailments caused by prolonged, harsh living conditions as evacuees. If owners could evacuate with their pets, it might help reduce such deaths. The bond with an animal can help alleviate stress in some cases.\\""}, {"ja": "また、ペットのいる人専用の避難所を設けるのも一案だ。例えば熊本市は、動物専門学校と協定を結び、この学校を災害時のペット同伴避難所に指定している。", "en": "Additionally, setting up evacuation centers specifically for people with pets is an option. For instance, the Kumamoto city government has formed an agreement with an animal vocational school and designated it as a pet-friendly evacuation center in the event of a disaster.\\""}, {"ja": "災害時にペットを守る責任が飼い主自身にあることは言うまでもない。えさや水の備蓄、基本的なしつけのほか、ペットをケージに慣れさせることも必要だ。避難中は、ペットを被災地外に預けることも選択肢になる。", "en": "It goes without saying that owners bear responsibility for protecting their pets during disasters. In addition to stockpiling food and water and providing basic training for pets, it is also necessary for owners to get their pets used to spending time in cages. Placing pets in temporary care outside the disaster area is also an option during an evacuation.\\""}, {"ja": "こうした責任を十分に果たせないのであれば、ペットを安易に飼うべきではない。", "en": "People who cannot properly fulfill these responsibilities should not adopt pets without adequate consideration.\\""}]}, {"id": "default-4", "topic": "Okinawa gubernatorial election", "title": "地域発展に現実的な政策競え", "source": "読売新聞 2026年4月26日", "isDefault": true, "pairs": [{"ja": "米軍普天間飛行場（沖縄県宜野湾市）の名護市辺野古への移設計画に反対し続けることを、沖縄県民は本当に望んでいるのだろうか。", "en": "Do the people of Okinawa Prefecture truly want to continue opposing the plan to relocate the U.S. Marine Corps\' Futenma air station in Ginowan to the Henoko district in Nago?\\""}, {"ja": "現実的な基地負担の軽減策や、県民生活の向上は、沖縄にとって重要な課題のはずだ。次期知事選を、地域の発展につなげる機会としなければならない。", "en": "There is no doubt that implementing realistic measures to reduce the burden on Okinawa Prefecture of hosting U.S. military bases and improving the lives of local residents are important issues for the prefecture. The next Okinawa gubernatorial election must be used as an opportunity to bring about regional development.\\""}, {"ja": "沖縄の玉城デニー知事が記者会見し、県知事選（8月27日告示、9月13日投開票）に3選を目指して立候補すると正式に表明した。主要な争点の一つとして、辺野古への移設計画を挙げた。", "en": "Okinawa Gov. Denny Tamaki held a press conference to formally announce his intention to seek a third term in the gubernatorial election, for which campaigning is set to officially start on Aug. 27 and voting is slated for Sept. 13. He cited the planned relocation of the Futenma base to Henoko as one of the key issues in the election.\\""}, {"ja": "知事選には、既に前那覇市副市長の古謝玄太氏が出馬する意向を表明している。自民党は古謝氏を推薦する見通しだ。", "en": "Former Naha Deputy Mayor Genta Koja has already announced his plan to run for governor. The Liberal Democratic Party is expected to endorse him.\\""}, {"ja": "辺野古移設について、玉城氏は反対する考えを改めて示した。古謝氏は容認の立場だ。", "en": "Tamaki has reiterated his opposition to the relocation plan, while Koja has adopted a stance of accepting it.\\""}, {"ja": "日米両政府が1996年4月、普天間の全面返還で合意してから30年が過ぎた。民主党政権が実現性のない「県外移設」を掲げたことや、移設に反対する県が国と法廷闘争を繰り広げたことが、返還の遅れを招いてしまった。", "en": "Thirty years have passed since the Japanese and U.S. governments agreed in April 1996 to fully return the land of the Futenma base to Japan. The delay in the return can be attributed to the administration led by the now defunct Democratic Party of Japan, which advocated an unrealistic plan to relocate the base outside the prefecture, and to the prefecture\'s legal battle with the central government over the relocation.\\""}, {"ja": "世界で最も危険とされる普天間の返還を実現するには、辺野古移設が現実的な唯一の選択肢だ。司法の場で県の主張が次々と退けられてきたことを、玉城氏は重く受け止める必要がある。", "en": "Relocating to Henoko is the only realistic option to realize the return of the Futenma base, which is said to be the most dangerous airfield in the world. Tamaki needs to take seriously the fact that the prefecture\'s claims have repeatedly been rejected in court.\\""}, {"ja": "一方、移設計画にはなお懸案が残っている。普天間の滑走路は長さが2700メートルあるのに対し、辺野古の2本の滑走路はいずれも1800メートルと短い。主にヘリコプターの運用を想定しているので、離着陸できる航空機は制限される。", "en": "However, concerns remain regarding the relocation plan. The runway at the Futenma base is 2,700 meters long, but the two runways planned to be built in Henoko are both shorter, at 1,800 meters each. The assumption is that the Henoko runways will be used primarily for helicopters, so the types of aircraft that can take off from and land there will be limited.\\""}, {"ja": "日米両国は2013年、普天間返還の条件として、米軍が緊急時に使用する長い滑走路を持つ空港を確保することで合意した。政府は那覇空港を想定しているが、県側は反発している。国と県で真摯（しんし）に協議することが欠かせない。", "en": "As a condition for the return of the Futenma base, Japan and the United States agreed in 2013 to secure an airport with a long runway to be used by the U.S. military in times of emergency. The central government envisages using Naha Airport for this purpose, but the prefectural government opposes this idea. It is essential for the central and prefectural governments to engage in sincere discussions.\\""}, {"ja": "沖縄には、国内の米軍施設の7割が集中している。米軍基地の整理・縮小や本土への分散を進めて、負担の軽減を着実に図ることも政府の責務だ。", "en": "Okinawa Prefecture is home to 70% of all U.S. military facilities in Japan. It is the central government\'s duty to steadily reduce the burden on the prefecture by advancing the consolidation and downsizing of U.S. military bases and spreading them to the mainland of Japan.\\""}, {"ja": "沖縄の課題は基地問題に限らない。1人あたりの県民所得は全国最低で、貧困世帯も多い。", "en": "The challenges faced by Okinawa Prefecture are not limited to the base issue. Per capita prefectural income is the lowest among all Japan\'s prefectures, and there are many households living in poverty in the prefecture.\\""}, {"ja": "地元の経済界は、普天間を含め、返還が予定される米軍基地の跡地を、先端医療や海洋探査などの拠点とする計画を進めている。", "en": "The local business community is moving forward with plans to transform the sites of U.S. military bases that are planned to be returned to Japan, including Futenma, into hubs for advanced medical care and marine exploration, among other purposes.\\""}, {"ja": "沖縄を豊かな県にするため、世界有数の研究機関である沖縄科学技術大学院大学の知見を、新たな産業の創出に生かす手もある。", "en": "Leveraging the expertise of the Okinawa Institute of Science and Technology, one of the world\'s leading research institutions, is one option to create new industries, thereby helping to make Okinawa a prosperous prefecture.\\""}]}, {"id": "default-5", "topic": "Appeal of books", "title": "偶然の出会いが世界を広げる", "source": "読売新聞 2026年4月27日", "isDefault": true, "pairs": [{"ja": "紙の書籍や雑誌の売れ行きが低迷する中で、大型書店が新装開店した。15年ぶりに復活した雑誌もある。本の魅力を再認識する機会にしたい。", "en": "A major bookstore has recently reopened after renovations amid stagnant sales of print books and magazines. After 15 years, one magazine has made a comeback. Hopefully, these developments can serve as an opportunity to rediscover the appeal of books.\\""}, {"ja": "紙の書籍や雑誌の推定販売額は昨年9647億円で、50年ぶりに1兆円を下回った。インターネットの普及などに伴って、1996年の2兆6564億円をピークに減少傾向が続いている。", "en": "Sales of print books and magazines are estimated to have totaled ¥964.7 billion last year, falling below ¥1 trillion for the first time in 50 years. Driven mainly by the widespread use of the internet, sales have been on a downward trend since 1996, when they peaked at ¥2.6564 trillion.\\""}, {"ja": "特に雑誌は、前年比10%減の3708億円で落ち込みが大きい。雑誌を買いに書店に来た人が、その機会に他の本も手に取ることが多いだけに、影響は深刻だ。", "en": "Magazines, in particular, saw a significant decline, falling 10% year-on-year to ¥370.8 billion. The impact is severe, as people who come to bookstores to buy magazines often also pick up books during their visit.\\""}, {"ja": "今では、地域に書店が一つもない「無書店自治体」が、全体の4分の1に上っている。", "en": "Today, one-quarter of all municipalities in Japan have no bookstores at all.\\""}, {"ja": "そうした中、紙の本や雑誌が改めて注目される事例が続いた。東京の神保町で、老舗の「三省堂書店」が、老朽化した旧本店を新しいビルに建て替え、3月に新装開店した。1980平方メートルの売り場で約50万冊を扱う。歩くと様々な本が視界に入るように棚の配置が工夫されている。", "en": "Against this backdrop, there have been a series of events where physical books and magazines are once again drawing attention. Long-established Sanseido Bookstore Ltd. replaced its aging former head store with a new building and reopened in Jimbocho, Tokyo, in March. The new store stocks about 500,000 titles across its 1,980-square-meter sales floor. The shelves are carefully arranged in a way that draws shoppers\' attention to a variety of books as they walk through the store.\\""}, {"ja": "書店には、それまで関心がなかった分野で、気になる本が見つかる楽しさがある。その一冊が人生を変えることもある。三省堂書店の亀井崇雄社長は「本との偶然の出会いを届けたい」と話す。", "en": "Bookstores offer the joy of visitors discovering books that intrigue them in fields they previously had no interest in. A single book can even change a person\'s life. \\"We hope to deliver serendipitous encounters with books,\\" said Takao Kamei, president of Sanseido Bookstore.\\""}, {"ja": "チケット販売の「ぴあ」は今月、部数減で2011年に休刊した紙の情報誌を復活させた。", "en": "Ticket sales company PIA Corp. brought back a print information magazine this month, which it suspended in 2011 due to declining circulation.\\""}, {"ja": "休刊後は主にインターネットで情報を発信してきたが、利用者が思わぬ映画や舞台と出会うには多くの情報を一覧できる紙が便利だと、復活を考えたという。", "en": "The company had provided information mainly online since the magazine\'s suspension, but decided to revive the print edition because it believed browsing through a large volume of information in print format makes it easier for users to serendipitously discover movies and stage productions.\\""}, {"ja": "読書離れに拍車をかけたのは、スマートフォンの長時間利用だとされる。ただ最近は、若い世代を中心にメッセージのやり取りなどを面倒に感じる「SNS疲れ」が増えているとも言われる。", "en": "Spending hours on smartphones is said to have accelerated a decline in reading habits. However, nowadays more people, especially among younger generations, are said to be experiencing social media fatigue because they are tired of interacting via text message and other formats.\\""}, {"ja": "紙の本は、自分のペースでページをめくることができ、深く考えるのに適している。時には、スマホを置いて紙の本を手に取ってみてはどうだろう。", "en": "With paper books, readers can turn the pages at their own pace, which is ideal for deep reflection. Now and then, it might be worth putting down smartphones and picking up a physical book.\\""}, {"ja": "デジタルに親しんでいる若い世代にも、紙の本の良さを感じてもらいたい。そのためには、学校図書館の充実が欠かせない。本が古い、冊数が少ない、カギがかかっている時間帯が多い、といった状況は改善せねばならない。", "en": "It will be ideal if the younger generations, who are so familiar with digital media, also come to appreciate the merits of physical books. To that end, enhancing school libraries is essential. Factors like outdated books, insufficient collections and libraries being closed for many hours must be addressed.\\""}, {"ja": "魅力的な本を紹介する学校司書の待遇改善も重要だ。正規の常勤職員は1割程度にとどまり、複数校の掛け持ちも多いという。", "en": "It is also crucial to improve the working conditions of school librarians, whose role is to introduce students to compelling books. Currently, only about 10% of librarians work full-time as regular staff, and many librarians are said to be working at multiple schools.\\""}, {"ja": "小中学校や高校に比べて図書数が少ない特別支援学校の図書館を充実させることも急務だ。", "en": "It is also an urgent task to improve libraries at special needs schools, which have fewer books compared to elementary, junior high and high schools.\\""}]}, {"id": "default-6", "topic": "Political neutrality", "title": "自民も自衛隊も緊張感足りぬ", "source": "読売新聞 2026年4月27日", "isDefault": true, "pairs": [{"ja": "自治体や民間団体が行うイベントに自衛隊を招き、交流を広げるというのなら、歓迎したい。だが政党の行事への参加となれば、話は別だ。", "en": "The Self-Defense Forces\' attendance at events organized by local governments or private organizations upon invitation to foster exchanges is welcomed. However, participating in a political party event is a completely different story.\\""}, {"ja": "自衛隊員が自民党の最高機関である党大会で登壇し、しかも、国歌斉唱をリードするとは、驚きを禁じ得ない。自衛隊の政治的中立性が疑われかねない失態だ。", "en": "One cannot help but be taken aback by an SDF member taking the stage at a gathering of the Party Convention — the Liberal Democratic Party\'s supreme body — and leading the singing of the national anthem. This is a blunder that risks casting doubt on the SDF\'s political neutrality.\\""}, {"ja": "隊員は、陸上自衛隊中央音楽隊に所属する3等陸曹で、自民党大会で国歌を歌った。制服を着用し、会場では「陸自が誇るソプラノ歌手」だと紹介された。陸自を代表して参加した、との印象を抱いた人も多いのではないか。", "en": "A sergeant belonging to the Ground Self-Defense Force Central Band sang the national anthem at the LDP convention. Clad in uniform, the sergeant was introduced at the venue as \\"the GSDF\'s proud soprano singer.\\" Many people probably got the impression that the sergeant was participating in the convention on behalf of the GSDF.\\""}, {"ja": "野党が「自衛隊の政治的利用だ」と批判しているのに対し、高市首相は、3曹は国歌を歌っただけで、自衛隊員の政治的行為を制限する自衛隊法には違反しない、と説明している。", "en": "While opposition parties are criticizing it as political exploitation of the SDF, Prime Minister Sanae Takaichi explained that the sergeant merely sang the national anthem and did not violate the Self-Defense Forces Law, which restricts political activities by SDF personnel.\\""}, {"ja": "3曹は、自民党大会の演出を依頼したイベント会社から、私人としての出演を打診されたという。だが制服姿で、陸自所属という紹介付きとあっては、私人とはみなされまい。", "en": "The sergeant reportedly was asked to perform in a private capacity by an event planning company that the LDP asked to organize the convention. However, given that she was in uniform and was introduced as a GSDF member, it is unlikely she would be regarded as a private citizen.\\""}, {"ja": "憲法は、公務員を「全体の奉仕者」と定めている。特別職の国家公務員で、実力組織である自衛隊の隊員は、自衛隊法で政治的行為が一層厳しく制限され、罰則も厳しい。戦前に軍部が政治力を持ち、独走した反省が背景にある。", "en": "The Constitution defines public officials as \\"servants of the whole community.\\" Members of the SDF, an armed organization, are national public servants in special service, and therefore their political activities are subject to even stricter restrictions under the law, with severe penalties in place. This is a reflection on the prewar years, when the military obtained political power and acted unilaterally.\\""}, {"ja": "仮に党大会での歌唱が自衛隊法に違反していないとしても、隊員が政治色を帯びた言動を取れば、自衛隊が特定の党に肩入れしていると疑われても仕方あるまい。", "en": "Even if singing at the party convention does not violate the law, if an SDF member makes politically tinged remarks or takes political actions, it is only natural that people would question whether the SDF is supporting a specific political party.\\""}, {"ja": "3曹の出席を認めた関係者の対応は理解に苦しむ。", "en": "It is hard to understand how those in charge could have permitted the sergeant\'s attendance at the convention.\\""}, {"ja": "3曹は、参加の可否を事前に上司に相談していた。陸自幹部が防衛省の担当部署に問い合わせたところ、担当者は「自衛隊法違反には当たらない」と回答したという。党大会への出席は、陸自トップの陸幕長も知っていた。", "en": "The sergeant had consulted her superior in advance regarding whether she would be allowed to attend. When a senior GSDF officer inquired with the relevant department at the Defense Ministry, a ministry official is said to have replied that \\"it would not violate the Self-Defense Forces Law.\\" The chief of staff, the head of the GSDF, was also aware of her attendance at the convention.\\""}, {"ja": "小泉防衛相は、党大会の当日まで、3曹の出席を知らなかったといい、自分に「情報が上がっていれば、別の判断もあり得た」と語っている。防衛省内の情報共有の体制を点検すべきだ。", "en": "Defense Minister Shinjiro Koizumi reportedly did not know of the sergeant\'s attendance until the day of the convention, saying, \\"Had the information been reported to me, a different judgment may have been reached.\\" The ministry\'s information-sharing system requires review.\\""}, {"ja": "一方、自民党は、隊員が参加することに問題がないか、イベント会社を通じて防衛省に照会していたというが、会社任せの姿勢は無責任にすぎる。", "en": "Meanwhile, the LDP said it inquired with the ministry through the event planning company to confirm whether there were any issues with the SDF member\'s participation. The party\'s approach of leaving it entirely up to the company is far too irresponsible.\\""}, {"ja": "安全保障環境の悪化を踏まえ、政府は、増税などによって防衛予算を拡充している。税負担が増す国民から、厳しい視線が注がれていることを自民党も防衛省・自衛隊も忘れてはならない。", "en": "Given the deteriorating security environment, the government is expanding the defense budget through tax increases and other measures. The LDP, the Defense Ministry and the SDF must not forget that they are under close scrutiny from the public, whose tax burden is increasing.\\""}]}, {"id": "default-7", "topic": "Hungary", "title": "欧州極右伸長の流れ変わるか", "source": "読売新聞 2026年4月16日", "isDefault": true, "pairs": [{"ja": "ハンガリー議会選挙で新興野党が圧勝し、オルバン首相の退陣が決まった。16年ぶりの政権交代が実現する。", "en": "A new opposition party won a landslide victory in Hungary\'s parliamentary election, ousting Prime Minister Viktor Orban. This will be the first change of government in 16 years.\\""}, {"ja": "ロシアや中国に融和的で、欧州連合（EU）を揺さぶってきた異色の強権指導者の退場である。EUとの関係が改善し、欧州が結束を取り戻す契機となることを期待したい。", "en": "It marks the departure of an unconventional, authoritarian leader who has been conciliatory toward Russia and China and has shaken the European Union. It is hoped that the election results will be an opportunity for Hungary to improve relations with the EU, and for Europe to restore unity.\\""}, {"ja": "オルバン氏は、司法に介入し、政権に批判的なメディアを抑圧するなど強権的な統治手法で、長期政権を担ってきた。", "en": "Orban maintained his administration for so long through his authoritarian approach to governing, which included interfering in the judiciary and suppressing media critical of his administration.\\""}, {"ja": "ロシアのプーチン大統領と関係が近く、EU加盟国の全会一致が必要な対露制裁やウクライナ融資などで再三、「拒否権」をちらつかせてきた。", "en": "He has had close ties with Russian President Vladimir Putin and has repeatedly threatened to use his veto on issues requiring unanimous consent among EU member states, such as sanctions against Russia and loans to Ukraine.\\""}, {"ja": "今回の選挙では、オルバン氏を支持するロシアがSNSなどを通じて偽情報を拡散し、世論工作を仕掛けたと指摘される。", "en": "It has been noted that Russia, which supports Orban, spread disinformation via social media and other means to manipulate public opinion during this election.\\""}, {"ja": "米国のトランプ大統領もオルバン氏の勝利を願うメッセージを送り、選挙中にバンス副大統領をハンガリーに派遣した。内政干渉のそしりは免れない。", "en": "U.S. President Donald Trump also posted a message wishing for Orban\'s victory and dispatched U.S. Vice President JD Vance to Hungary during the campaign. These moves inevitably have invited accusations of meddling in the domestic affairs of a foreign country.\\""}, {"ja": "選挙の公正性を歪（ゆが）めかねない動きは不発に終わり、オルバン氏は大差で敗北した。オルバン氏が早々に敗北を認め、選挙という民主的な手続きがなお機能していることを示した点は評価できる。", "en": "These efforts, which could have undermined the fairness of the election, ultimately failed, and Orban suffered a landslide defeat. It is praiseworthy that he conceded defeat early on, demonstrating that the democratic process of elections is still functional.\\""}, {"ja": "新首相には、定数の3分の2以上の議席を獲得した中道右派「ティサ（尊重と自由）」のマジャル党首が就く。統治体制の立て直しや、EUとの関係修復に尽力してもらいたい。", "en": "Peter Magyar, the leader of the center-right Respect and Freedom Party, or Tisza, which secured more than two-thirds of the parliament\'s seats, is set to become the next prime minister. It is hoped he will work to rebuild the governing system and mend relations with the EU.\\""}, {"ja": "ハンガリーは、ロシア産エネルギーの輸入や、中国からの投資を頼りに経済成長を目指してきた。だが、国内総生産（GDP）成長率が2023年以降、3年連続で1%を下回った。1人あたりGDPはEU加盟国で下位にある。", "en": "Hungary has sought economic growth by relying on energy imports from Russia and investment from China. However, growth in its gross domestic product has fallen below 1% for three consecutive years since 2023. Its per capita GDP is among the lowest for an EU member state.\\""}, {"ja": "中露に依存し、国家管理を強化する手法が限界を迎えていたのは明らかだ。オルバン体制で横行した汚職や縁故主義も、経済成長を妨げてきた要因といえる。", "en": "Clearly, the approach of strengthening state control by relying on China and Russia has reached its limits. Corruption and nepotism, which ran rampant under the Orban regime, can also be cited as factors that have hindered economic growth.\\""}, {"ja": "経済低迷や物価高などに対処できなければ、いかなる体制であってもいずれ国民の不満を抑え切れなくなるのだろう。", "en": "If Hungary cannot deal with economic stagnation and high inflation, among other issues, it will eventually be unable to contain public discontent, regardless of the administration in place.\\""}, {"ja": "オルバン氏は、移民やEU、ウクライナなどを「仮想敵」とし、敵意や憎悪を煽（あお）ってきた。", "en": "Orban has treated immigrants, the EU and Ukraine as \\"hypothetical enemies,\\" stoking hostility and hatred among the public.\\""}, {"ja": "同様の手法はハンガリー以外の欧州にも広がり、ドイツやフランスなどで「自国第一」を掲げる排外的なポピュリズム（大衆迎合主義）勢力を伸長させてきた。", "en": "A similar approach has spread beyond Hungary to the rest of Europe, fueling the rise of xenophobic populist forces advocating \\"our country first\\" in nations such as Germany and France.\\""}, {"ja": "オルバン氏の退陣が、欧州の極右勢力の伸長の変調につながるかどうかを注視する必要がある。", "en": "It is necessary to closely monitor whether Orban\'s departure will affect the rise of the far right across Europe.\\""}]}, {"id": "default-8", "topic": "Stable Imperial succession", "title": "女性・女系を排除せずに論じよ", "source": "読売新聞 2026年4月16日", "isDefault": true, "pairs": [{"ja": "皇室を将来にわたって存続させることは、多くの国民の願いだろう。与野党は、そのための現実的な具体策を丁寧に論じ合わなければならない。", "en": "It must be the desire of many of the people to ensure the continuation of the Imperial family into the future. The ruling and opposition parties must thoroughly discuss practical, concrete measures to achieve this.\\""}, {"ja": "皇位継承の安定策を検討している与野党協議が、1年ぶりに再開された。", "en": "Discussions between the ruling and opposition parties to consider measures for a stable Imperial succession have resumed for the first time in a year.\\""}, {"ja": "30年ほど前に26人いた皇室の方々は、今は16人に減っている。このうち皇位継承権を持つ男系男子は3人しかおらず、天皇陛下の次の世代は、秋篠宮さま（60）の長男の悠仁さま（19）だけだ。", "en": "The number of people in the Imperial family, which was 26 about 30 years ago, has now declined to 16. Of these, there are only three paternal-line male descendants who are eligible to succeed the throne, and the only heir in the generation below the Emperor is Prince Hisahito, 19, the son of Crown Prince Akishino, 60.\\""}, {"ja": "現行の皇室典範の下では、悠仁さまが結婚し、仮に男子が生まれなければ皇統が途絶えてしまう。早急に手を打つ必要がある。", "en": "Under the current Imperial House Law, if Prince Hisahito marries and does not have a son, the Imperial lineage will come to an end. Urgent action is needed.\\""}, {"ja": "与野党協議で論点となっているのは、2021年に政府の有識者会議が提示した2案だ。", "en": "The two proposals presented by a government expert panel in 2021 are currently the focus of discussions between the ruling and opposition parties.\\""}, {"ja": "一つは、女性皇族が結婚後も皇族の身分を保持するというものである。もう一方は、戦後に皇籍を離れた旧11宮家の男系男子を皇族の養子に迎えるといった案だ。", "en": "One proposal is for female members of the Imperial family to retain their status even after marriage. The other one involves bringing paternal-line male offspring from the 11 former Imperial family branches — who lost their Imperial status after the end of World War II — into the Imperial family as adopted children.\\""}, {"ja": "与野党協議では、自民党と日本維新の会、国民民主党などが養子を迎える案を支持した。養子縁組後に生まれた男子に皇位継承権を付与することを想定している。", "en": "During the discussions between the ruling and opposition parties, the Liberal Democratic Party, the Japan Innovation Party, the Democratic Party for the People and another party have supported the adoption proposal. This proposal envisions granting the right of succession to the throne to any male children born after the adoption process is completed.\\""}, {"ja": "他方、立憲民主党は養子案に慎重で、女性皇族を結婚後も皇室にとどめ、その夫と子も皇族とする案を主張している。", "en": "In contrast, the Constitutional Democratic Party of Japan is cautious about the adoption proposal and has advocated for the proposal allowing female members to retain their Imperial status after marriage, with their husbands and children becoming members of the Imperial family.\\""}, {"ja": "中道改革連合は明確な意見を示さなかった。", "en": "The Centrist Reform Alliance has not expressed a clear position.\\""}, {"ja": "自民党は、皇位が男系で継承されてきた歴史を重視している。だが、皇統の危機に際して最も重要なことは皇統の存続である。", "en": "The LDP attaches importance to the history of the Imperial throne being inherited through the paternal line. However, in the face of a crisis in the Imperial lineage, the most important thing is its continuation.\\""}, {"ja": "皇室の方々が親しまれているのは、被災地の訪問などを通じて国民に寄り添ってきたからだ。", "en": "The reason Imperial family members are beloved by the public is because they have stood by the people through such actions as visits to disaster-stricken areas.\\""}, {"ja": "80年間も民間人として生活してきた旧宮家の人を唐突に皇族に復帰させ、その後生まれた男子を天皇と想定することに、国民の理解が得られるのか。", "en": "Could the public support the idea of the sudden return to the Imperial family of former Imperial family branch members who have lived as ordinary citizens for 80 years, and the assumption that any sons born thereafter will become emperors?\\""}, {"ja": "男系男子に固執するあまり、皇室が国民の思いからかけ離れてしまっては本末転倒だ。天皇の地位は「国民の総意に基づく」と定める憲法の趣旨を忘れてはならない。国会では、できるだけ多くの党の合意を得る必要がある。", "en": "It would defeat the purpose if, by clinging too rigidly to the succession of male offspring in the paternal line, the Imperial family were to become detached from the sentiments of the people. The spirit of the Constitution, which stipulates that the Emperor\'s position is based on \\"the will of the people,\\" must not be forgotten. In the Diet discussions, it is important to secure the consensus of as many parties as possible.\\""}, {"ja": "そもそも有識者会議の報告書は、当時の岸田政権の意向に配慮し、女性・女系天皇を想定していない。しかし、憲法は皇位を「世襲」と規定しているだけだ。政府も長年、女性・女系天皇は憲法上許容されると解釈してきた。", "en": "Basically, the expert panel report, giving consideration to the intentions of the administration of then Prime Minister Fumio Kishida, does not envision a female or maternal-line emperor. However, the Constitution merely stipulates that the Imperial throne is \\"dynastic.\\" For many years, the government interpretation has been that a female or maternal-line emperor is allowed constitutionally.\\""}, {"ja": "各党は報告書の2案にとらわれてはならない。今の継承順位は変えないことを前提に、将来の女性・女系天皇も排除せず、皇統の存続を最優先に検討すべきだ。", "en": "Political parties should not be bound by the two proposals in the report of the expert panel. Based on the assumption of not changing the current order of succession to the throne, they should discuss the issue by giving top priority to the continuation of the Imperial lineage without excluding a future female or maternal-line emperor.\\""}]}, {"id": "default-9", "topic": "LDP convention", "title": "足腰を鍛え直す時ではないか", "source": "読売新聞 2026年4月14日", "isDefault": true, "pairs": [{"ja": "つい2か月前の衆院選で圧勝したにもかかわらず、その後の地方選では苦戦が続いている。", "en": "Despite its landslide victory in the House of Representatives election just two months ago, the Liberal Democratic Party has continued to struggle in subsequent local elections.\\""}, {"ja": "自民党は、高市首相への国民の期待感に頼り切り、地道な支持者固めを怠っているのではないか。所属議員一人一人が有権者の声を丁寧にくみ取り、政策への理解を広げられるかどうかが問われている。", "en": "Has the LDP become overly reliant on public expectations for Prime Minister Sanae Takaichi, neglecting the steady work of solidifying support? The question now is whether each and every LDP Diet member can carefully listen to the voices of voters and widen public understanding of its policies.\\""}, {"ja": "自民党が定期党大会を開いた。高市首相は演説で「衆院選では国論を二分する公約を掲げた。大切なのは、公約を一つ一つ実現していくことだ」と強調した。", "en": "The LDP has held its regular party convention. In her speech, Takaichi emphasized: \\"We put forward pledges in the House of Representatives election that divided public opinion. What is important now is to materialize those pledges one by one.\\"\\""}, {"ja": "国会では今後、インテリジェンス（情報収集、分析）の司令塔となる「国家情報会議」の設置法案などの審議が予定されている。皇室典範の改正や、衆院議員定数の削減を含む選挙制度改革に関する与野党協議も始まる見通しだ。", "en": "Diet deliberations are scheduled to begin on bills, including one to establish a \\"national intelligence council\\" that will serve as the command center for intelligence-gathering and analysis. Discussions between the ruling and opposition parties are also expected to begin on revising the Imperial House Law and election reforms, including a reduction in the number of seats in the lower house.\\""}, {"ja": "首相としては、賛否の分かれる課題に結論を出すことで、実行力をアピールする狙いがあるようだ。しかし、選挙で多数を得たからといって強引に決着を図ろうとすれば、支持を失うだろう。", "en": "Takaichi appears to be aiming to demonstrate her ability to get things done by reaching conclusions on divisive issues. However, if she attempts to force a resolution simply because her party won a majority in the election, she will likely lose support.\\""}, {"ja": "党大会で首相はまた、「国でも地方でも選挙に勝ち続ける強い自民党を作る」と語った。", "en": "Takaichi also said at the party convention, \\"We will build a strong LDP that continues to win elections, both at the national and local levels.\\"\\""}, {"ja": "だが、3月の石川県知事選では、与党推薦の現職が再選を逃した。首相は応援のため異例の現地入りをしたが、実らなかった。東京都清瀬市長選、練馬区長選でも自民などが推薦した候補が敗れた。", "en": "However, in the March gubernatorial election in Ishikawa Prefecture, the incumbent supported by the ruling camp failed to win reelection. Takaichi visited the prefecture to campaign for him, an unusual move that was ultimately to no avail. Candidates endorsed by the LDP and others also lost in mayoral elections in the city of Kiyose and Nerima Ward, both in Tokyo.\\""}, {"ja": "各選挙にはそれぞれ地域事情が影響した可能性はあるが、自民党の足腰が弱まっているのは事実だろう。鍛え直さなければ、来春の統一地方選でも苦戦しかねない。", "en": "While local circumstances may have influenced each election, it is true that the LDP\'s foundation is weakening. Unless the party rebuilds its strength, it may face an uphill battle in next spring\'s unified local elections.\\""}, {"ja": "実際、昨年末時点の自民党員数は100万3300人で、この5年間で約13万人減少した。党勢を回復するには、ミニ集会などをこまめに開いて党員を着実に増やしていく努力が欠かせない。", "en": "At the end of last year, the LDP had 1,003,300 members, a decrease of about 130,000 over the past five years. To restore the party\'s strength, it is essential to make a concerted effort to steadily increase membership by frequently holding small rallies and other events.\\""}, {"ja": "自民党はこれまで、保守からリベラルまで幅広い層を取り込む包括政党として長く政権を担ってきた。だが、国民の価値観が多様化し、従来の手法は通用しなくなったという見方は多い。", "en": "The LDP has long held power as a big tent party that has embraced a broad spectrum of voters, from conservatives to liberals. However, many believe that conventional methods no longer work as the public\'s values have diversified.\\""}, {"ja": "時代に合った新たな政党像を模索することもまた、「高市自民党」の課題と言える。", "en": "Seeking a new party image suited to the times is also a challenge for the Takaichi-led LDP.\\""}, {"ja": "自民党内では最近、解散した旧派閥単位の会合が開かれている。先の衆院選で新人議員66人が誕生したことから、旧派閥が若手の教育の場となっているようだ。", "en": "Groups from the former factions, which were previously disbanded, have recently been holding meetings within the LDP. A total of 66 new lawmakers were elected to the House of Representatives from the LDP in February, and the former factions appear to be serving as educational forums for these young lawmakers.\\""}, {"ja": "派閥が復権し、そうした役割を果たすことに問題はないが、再び人事に過度な影響力を行使するといった弊害が出てくれば、党の再生はおぼつかなくなる。", "en": "While there is no problem with factions being restored and fulfilling this role, the party may struggle to rebuild itself if negative consequences arise, such as factions once again exerting excessive influence over personnel decisions.\\""}]}, {"id": "default-10", "topic": "Kashiwazaki-Kariwa nuclear plant", "title": "電力安定供給への貢献大きい", "source": "読売新聞 2026年4月30日", "isDefault": true, "pairs": [{"ja": "東日本大震災以降、14年ぶりに首都圏に原子力発電所の電力が届いた。イラン情勢の混乱が続く中、電力の安定供給に果たす役割は大きい。", "en": "For the first time in 14 years, following the 2011 Great East Japan Earthquake, electricity from a nuclear power plant has reached the Tokyo metropolitan area. Amid ongoing turmoil in the situation in Iran, the plant plays a significant role in ensuring a stable power supply.\\""}, {"ja": "東京電力は、新潟県の柏崎刈羽原発6号機の営業運転を4月16日から始めた。福島第一原発の事故後、東電が本格的に原発を稼働させるのは初めてとなる。", "en": "Tokyo Electric Power Company Holdings, Inc. began commercial operation of the No. 6 reactor at its Kashiwazaki-Kariwa nuclear power plant in Niigata Prefecture on April 16. This marks the first time TEPCO has fully restarted a nuclear reactor since the 2011 accident at the Fukushima No. 1 nuclear power plant.\\""}, {"ja": "6号機は新潟県の同意を得て、1月に再稼働したが、機器の不具合などトラブルが相次いだ。このため2月26日に予定していた営業運転は約2か月遅れた。", "en": "The No. 6 reactor was restarted in January this year with the consent of the Niigata prefectural government, but experienced a series of problems, including equipment malfunctions. As a result, the start of commercial operation, originally scheduled for Feb. 26, was delayed by about two months.\\""}, {"ja": "震災に伴う原発事故がもたらした甚大な被害を踏まえ、安全確認を徹底したということだろう。東電は、地域住民の信頼を損なわぬよう、今後も安全性を最優先に取り組まねばならない。", "en": "This likely reflects TEPCO\'s commitment to thorough safety checks in light of the immense damage caused by the nuclear accident following the earthquake. TEPCO must continue to work to prioritize safety above all else so as not to undermine the trust of local residents.\\""}, {"ja": "原発の再稼働が進まない中、首都圏の電力需給は近年、綱渡りの状況が続いてきた。", "en": "With the restart of nuclear reactors stalling, supply and demand for electricity in the Tokyo metropolitan area has remained precarious in recent years.\\""}, {"ja": "特に2022年は厳しかった。ロシアのウクライナ侵攻によるエネルギー不足に加え、コロナ禍でテレワークなどが普及して家庭の電力需要が増えたからだ。", "en": "The situation was particularly severe in 2022. This was due to increased household electricity demand resulting from the widespread adoption of telecommuting and other factors during the COVID-19 pandemic, as well as energy shortages caused by Russia\'s aggression against Ukraine.\\""}, {"ja": "政府は当時、電力供給の余裕が乏しくなったことを受けて、大規模停電を未然に防ぐため、3月には初の電力需給逼迫（ひっぱく）警報の発令、夏にも7年ぶりの節電要請を行い、翌年も実施した。", "en": "At the time, in response to the reduced power supply, the government issued a warning for the first time regarding the tight electricity supply-demand balance in March 2022 to prevent large-scale power failures. It also issued a request for power conservation that summer — the first instance in seven years — and repeated the request the following year.\\""}, {"ja": "今夏は柏崎刈羽原発の再稼働により、節電要請は見送られる見通しだ。出力が大きい原発が電力安定供給に果たす貢献度の高さを、改めて示したと言えよう。東電は運転を止めるトラブルを起こさぬよう、万全を期す必要がある。", "en": "This summer, with the restart of the reactor at the Kashiwazaki-Kariwa nuclear power plant, it is expected that a request for power conservation will not be issued. It can be said that this indicates the significant contribution that high-output nuclear power plants make to a stable power supply. TEPCO must take every possible precaution to ensure that no problems arise that could stop the operation.\\""}, {"ja": "イランが原油輸送の大動脈であるホルムズ海峡を事実上封鎖するなど、地政学的なリスクの高まりに直面している。エネルギー安全保障が一段と問われる中、原発は脱炭素と両立できる「準国産エネルギー」として重要だ。", "en": "Japan is facing heightened geopolitical risks, such as Iran\'s de facto blockade of the Strait of Hormuz, a vital artery for crude oil transport. As energy security becomes an increasingly critical issue, nuclear power is vital as a \\"quasi-domestic energy source\\" that can help with decarbonization efforts.\\""}, {"ja": "原子力の活用は、化石燃料の節約につながる利点も大きい。", "en": "The use of nuclear power also offers significant benefits in terms of conserving fossil fuels.\\""}, {"ja": "日本の電源構成は、太陽光などの再生可能エネルギーが増えたものの約7割は液化天然ガス（LNG）などの火力発電が占める。柏崎刈羽原発の稼働により、ホルムズ海峡経由で輸入していたLNGの3割相当を減らせるという。", "en": "Although the share of renewable energy sources such as solar power has increased in Japan\'s power mix, thermal power generation — primarily using liquefied natural gas — accounts for about 70% of the total. It is estimated that the restart of the reactor at the Kashiwazaki-Kariwa nuclear power plant would reduce LNG imports via the Strait of Hormuz by about 30%.\\""}, {"ja": "イラン情勢の先行きは不透明で、エネルギーの大半を輸入に頼る日本にとって厳しい状況は続くだろう。LNG価格の高騰で、今夏以降の電気料金の上昇は避けられない見通しとなっている。", "en": "The outlook for the situation in Iran remains uncertain, and the difficult circumstances are likely to persist for Japan, which relies on imports for the majority of its energy. With LNG prices soaring, it is likely inevitable that electricity rates will rise this summer or later.\\""}, {"ja": "不安定な中東情勢が続くリスクを見据えて、官民で節電の意識を高めていくことも大切だ。", "en": "In light of the risk of continued instability in the Middle East, it is also important for both the public and private sectors to raise awareness about energy conservation.\\""}]}, {"id": "default-11", "topic": "Charitable bequests", "title": "故人の思いを生かせる制度に", "source": "読売新聞 2026年4月19日", "isDefault": true, "pairs": [{"ja": "自分の財産を死後、公的な団体などに寄付する「遺贈寄付」が増えている。生きた証しとして、社会に恩返ししたいという願いを生かすよう、制度を充実させる必要がある。", "en": "An increasing number of people have made charitable bequests in which they donate their assets to public organizations and other groups after death. The system must be improved in a way that will honor the deceased\'s desire to give something back to society as a testament to their life.\\""}, {"ja": "遺贈寄付は遺言書に基づき、死後に財産の一部または全部を相続人以外に渡す仕組みだ。寄付先は大学や貧困などの社会課題に取り組むNPO法人、故人と縁のある自治体など多岐にわたる。", "en": "Under the system for charitable bequests, people give all or part of their assets to parties other than their heirs after death in accordance with their will. Recipients range widely and include universities, nonprofits tackling social issues such as poverty and local governments with ties to the deceased.\\""}, {"ja": "単身高齢者が増加し、人生の終わりを想定して準備をする「終活」も広がっている。そのため、2023年の遺贈寄付は、1142件、643億円に上った。件数は10年間で約3倍になった。", "en": "As the number of elderly people living alone rises, more people have begun preparing for the end of their life. Partly for this reason, there were 1,142 charitable bequests in 2023, amounting to ¥64.3 billion. Such bequests roughly tripled over the past decade.\\""}, {"ja": "それでも、約50兆円に上る年間の遺産相続額に比べれば、ごく一部にすぎない。相続人がいないことに伴って国庫に入る遺産も、24年度は過去最多の約1300億円に達している。", "en": "Even so, this figure represents only a tiny fraction of the amount that is inherited annually, which totals about ¥50 trillion. Assets that would have been inherited but that went instead to state coffers due to the absence of an heir also marked a record high of about ¥130 billion in fiscal 2024.\\""}, {"ja": "遺贈寄付は財政難に悩む団体の活動を助け、大学の研究促進や行政の目が届きにくい課題の解決にもつながる。日本に寄付文化を定着させる意味でも、今後さらに拡大させていく意義は大きい。", "en": "Charitable bequests help fund organizations that are financially struggling, aid university research and contribute to the resolution of issues that are hard for government bodies to address. Expanding charitable bequests further, to establish a culture of giving in Japan, would be deeply meaningful.\\""}, {"ja": "問題は手続きが複雑なことだ。関心はあっても、遺言書の作成などに不安を持つ人や、寄付先選びに迷う人は多い。寄付先の団体に専門知識を持つ職員が少なく、相談しにくいことも、寄付をためらう理由の一つとなっている。", "en": "The complexity of procedures for charitable bequests is a major problem. Despite their interest in making such a donation, many people feel anxious about things such as preparing a will or are unsure about what organization they should make their bequest to. Another reason people hesitate is that many would-be recipients lack staff with specialized knowledge of bequests, making it difficult for donors to discuss the matter with them.\\""}, {"ja": "三重大学は3月、地元銀行2行と遺贈寄付の連携協定を結んだ。銀行が寄付先として大学を紹介し、寄付の意向が示された場合は、寄付者の相談に乗ったり、遺言書の作成を支援したりする。", "en": "In March, Mie University signed a partnership with two local banks for bequests. Under the pact, these banks will promote the university to those thinking to make a charitable bequest, and when someone is interested in donating, the university will provide advice and help draft a will.\\""}, {"ja": "京都大学は2月、遺贈寄付の支援に力を入れるクラウドファンディング大手「READYFOR」と協定を結んだ。様々な団体の資金集めを支援してきた実績を生かし、遺贈寄付を広く呼びかける情報発信にも協力するという。", "en": "In February, Kyoto University signed an agreement with Readyfor, Inc., an operator of a major crowdfunding platform focusing on supporting charitable bequests. By leveraging its experience in supporting fundraising for various organizations, the company plans to help the university spread information widely to seek bequests.\\""}, {"ja": "こうした連携協定を活用すれば、専門知識を持つ職員の不足を補うことができよう。地元の金融機関にとっても、地域貢献をアピールする機会となるはずだ。", "en": "Through such partnerships, recipient organizations may be able to make up for a lack of staff with specialized knowledge. Such initiatives will also no doubt serve as an opportunity for local financial institutions to highlight their contributions to the community.\\""}, {"ja": "昭和女子大学が設立した社会福祉法人は、遺贈寄付を原資に、寄付者の名前を冠した基金を運用している。山梨県富士吉田市は「子育ての支援に」と寄せられた遺贈寄付を、子育て支援施設に置く知育遊具の購入代に充てた。", "en": "A social welfare corporation established by Showa Women\'s University manages a fund named after a donor, using her bequest as a primary financial source. The city government of Fujiyoshida, Yamanashi Prefecture, has allocated a bequest made for child-rearing support to the purchase of educational play equipment for a facility that supports childcare.\\""}, {"ja": "故人の遺志を生かして、寄付を有効に活用してほしい。遺贈先に選ばれるには、信用が大事だ。寄付の実績や使途を公表し、透明性を確保することが欠かせない。", "en": "Bequests must be put to effective use to honor the deceased\'s wishes. Trust is essential for entities to be chosen to receive donations. Recipients must ensure transparency by disclosing donation records and how these donations are used.\\""}]}, {"id": "default-12", "topic": "Japan and NATO", "title": "多国間の協調で抑止力高めよ", "source": "読売新聞 2026年4月19日", "isDefault": true, "pairs": [{"ja": "北大西洋条約機構（NATO）に加盟する32か国のうち、30か国の大使らが来日し、小泉防衛相らと会談した。直前には韓国も訪れた。", "en": "Ambassadors and other representatives from 30 member states of the North Atlantic Treaty Organization, which has 32 members in total, visited Japan and held talks with Japanese officials, including Defense Minister Shinjiro Koizumi. They also visited South Korea immediately prior to coming to Japan.\\""}, {"ja": "NATOの海外訪問団としては異例の規模だという。", "en": "This is said to be an unusually large delegation of NATO members visiting overseas.\\""}, {"ja": "米国が国際秩序を主導する立場を放棄し、世界は紛争が絶えない時代を迎えている。トランプ米大統領は、イランへの軍事作戦に非協力的なNATOの姿勢に不満を持ち、脱退までちらつかせた。", "en": "With the United States having abandoned its position as leader of the international order, the world has entered an era of constant conflict. Frustrated with NATO\'s uncooperative attitude toward assisting the U.S. military operation against Iran, U.S. President Donald Trump has even hinted at withdrawing the United States from NATO.\\""}, {"ja": "そうした中、NATOの主な構成国である欧州で、アジアを含めた国際社会の安定に日韓両国との協力関係が欠かせない、という認識が広がっているようだ。", "en": "Under such circumstances, there appears to be a growing view among European nations — which make up most of NATO — that cooperation with both Japan and South Korea is indispensable for the stability of the international community, which includes Asia.\\""}, {"ja": "日本はNATOとの防衛協力を深め、紛争の拡大に歯止めをかける必要がある。多国間で協調し、法の支配や自由貿易といった秩序の立て直しに努めるべきだ。", "en": "Japan must deepen defense cooperation with NATO to prevent the escalation of conflicts. Through multilateral cooperation, Japan should strive to restore order, such as the rule of law and free trade.\\""}, {"ja": "NATO大使らは、各国の外交当局の次官級が多い。小泉氏と大使らは会談で、具体的な防衛協力を進めることを確認した。", "en": "Many of the NATO representatives in the delegation are vice-ministerial level officials in the foreign service of their respective countries. During a meeting, Koizumi and these representatives affirmed their intention to move forward with specific forms of defense cooperation.\\""}, {"ja": "日本とNATOは昨年、それぞれが持つ防衛装備品の情報を共有するため、「防衛装備・産業対話」を発足させた。将来的に弾薬などの互換性を高め、有事の際に装備を融通し合う狙いがある。", "en": "Last year, Japan and NATO launched the Dialogue on Defense Industrial Cooperation and Capability to share information on their respective defense equipment. This platform is aimed at enhancing the interoperability of ammunition and other supplies in the future and eventually sharing equipment with each other in times of emergency.\\""}, {"ja": "現在は、日本の防衛産業がつくる装備品の納入先は主に自衛隊に限られている。NATOと協力することになれば、弱体化した日本の防衛産業の育成につながる。", "en": "Currently, the supply of equipment produced by Japan\'s defense industry is primarily limited to the Self-Defense Forces. If Japan were to cooperate with NATO in this manner, that would help revitalize its weakened defense industry.\\""}, {"ja": "また、海上自衛隊と、NATO各国の海軍でつくる海上部隊は、地中海やバルト海などで共同訓練を実施してきた。制服組の交流を深め、抑止力の向上を図っていく意義は大きい。", "en": "Japan\'s Maritime Self-Defense Force and NATO naval forces, comprising navies from its member states, have conducted joint exercises in locations including the Mediterranean and the Baltic Sea. It is meaningful to strengthen Japan\'s deterrence by deepening exchanges among SDF and NATO officers.\\""}, {"ja": "訪問団はまた、装備品を製造している大手電機メーカーの神奈川県内にある工場を視察した。韓国でも防衛産業を訪れたという。", "en": "The NATO delegation also visited a factory operated by a major electronics company that is producing defense equipment in Kanagawa Prefecture. It reportedly visited defense industry facilities in South Korea as well.\\""}, {"ja": "欧州各国は、ウクライナを侵略するロシアの脅威にさらされている。ウクライナへのミサイル供与などに伴い、装備品の不足も課題になっているという。", "en": "European countries are facing a threat from Russia, which has engaged in aggression against Ukraine. Partly because they have supplied missiles and other equipment to Ukraine, they are said to be dealing with a shortage of defense equipment.\\""}, {"ja": "日本は近く、防衛装備品の輸出ルールを緩和し、殺傷能力のある武器も一定の条件付きで輸出可能とする予定だ。NATO側と協議して、円滑に輸出を進める方向で検討してもらいたい。", "en": "Japan plans to soon ease its rules on defense equipment exports, making it possible to export lethal weapons as well under certain conditions. The nation should consider ways to facilitate such exports by consulting with NATO.\\""}, {"ja": "現在、日英伊3か国は、次期戦闘機の共同開発を進めている。この枠組みに最近、カナダが参加の意向を伝えてきているという。", "en": "Currently, Japan, Britain and Italy are advancing joint development of a next-generation fighter jet. Canada is said to have recently expressed its intention to join this initiative.\\""}, {"ja": "共同開発に携わる国が増えれば、開発費の負担を抑えることができる。価値観を共有する国と協力することは選択肢となろう。", "en": "If more countries participate in the joint development, the burden of development costs can be reduced. Cooperating with countries that share common values will be an option.\\""}]}, {"id": "default-13", "topic": "Widespread insurance fraud", "title": "行き過ぎた成果主義が温床に", "source": "読売新聞 2026年4月29日", "isDefault": true, "pairs": [{"ja": "外資系生命保険会社などで、顧客から金銭をだまし取る問題が、さらなる広がりを見せた。安心を届ける保険業界としてあるまじき不正だ。", "en": "Fraud involving the swindling of money from customers at foreign-affiliated life insurance companies and other firms continues to spread. Such deception is utterly unacceptable for an industry that is supposed to provide peace of mind.\\""}, {"ja": "外資系のプルデンシャル生命保険で、営業職員らによる大規模な金銭詐取問題が発覚したのは1月だ。約500人の顧客から計31億円を受け取るなどしていた。", "en": "In January, a large-scale financial fraud scheme involving sales employees at the foreign-owned Prudential Life Insurance Co. was uncovered. They received a total of ¥3.1 billion from about 500 customers.\\""}, {"ja": "約30年間、社員や元社員が架空の金融商品への投資を持ちかけたり借金を頼んだりする手口が横行していた。衝撃的な事態だ。", "en": "For about 30 years, there had been rampant use of methods in which employees and former employees solicited investments in fictitious financial products or asked for loans. This is a shocking situation.\\""}, {"ja": "今回、新たな被害相談が約700件に上っていることが判明した。このうち約70件は、グループ会社であるジブラルタ生命保険の社員が関係していたという。", "en": "It has now been revealed that the number of new reports of victimization has risen to about 700. Of these, about 70 cases reportedly involved employees of Gibraltar Life Insurance Co., which is a Prudential group company.\\""}, {"ja": "プルデンシャル生命は、販売自粛期間を5月上旬から11月上旬まで延長し、再発防止策を進める方針だ。社員教育や企業統治の見直しなどを総点検すべきである。", "en": "Prudential plans to extend its voluntary sales suspension period from early May to early November and implement measures to prevent a recurrence. The company should conduct a comprehensive review of its employee training and corporate governance.\\""}, {"ja": "保険業界にとって深刻なのは、新たにソニー生命保険でも金銭詐取の問題が発覚したことだ。", "en": "It is particularly serious for the insurance industry that a new case of financial fraud has also come to light at Sony Life Insurance Co.\\""}, {"ja": "元営業職員が顧客ら約100人から計22億円を運用目的で預かり、約12億円が返済されていないという。今後、約280万人の全契約について調査する方針だ。", "en": "A former sales staffer reportedly collected a total of ¥2.2 billion from about 100 customers that they claimed were for investment purposes, and about ¥1.2 billion has not been paid back. The company plans to investigate all of its 2.8 million policies from now on.\\""}, {"ja": "これだけの広がりを見せている以上、業界の信頼は根本から揺らいでいると言わざるを得ない。", "en": "Given the wide extent of the issue, it must be said that trust in the industry has been fundamentally shaken.\\""}, {"ja": "プルデンシャルやソニーなどの外資系や新興の生保は、日本生命など伝統的な国内生保と対比し、カタカナ生保と呼ばれてきた。", "en": "Foreign-affiliated and emerging life insurers, such as Prudential and Sony, have been referred to as \\"katakana life insurers\\" because their Japanese names contain katakana, in contrast to traditional domestic insurance companies like Nippon Life Insurance Co.\\""}, {"ja": "国内生保は、義理（G）、人情（N）、プレゼント（P）を重視した「GNP営業」が特徴だ。", "en": "Domestic life insurance companies are characterized by their sales method of focusing on moral duty, humanity and gifts.\\""}, {"ja": "これに対し、カタカナ生保は顧客のライフプランを精緻（せいち）に分析し、一人一人に最適となる保険の提案や、割安な保険料、柔軟な商品設計をセールスポイントに、販売を伸ばしてきた歴史がある。", "en": "In contrast, katakana insurers have a history of boosting sales by meticulously analyzing customers\' life plans and offering tailored insurance proposals, affordable premiums and flexible product designs as their selling points.\\""}, {"ja": "プルデンシャルもソニーも「ライフプランナー」と呼ばれる専門知識を持つ営業職員が顧客に寄り添う手法で、生保大手の牙城を崩そうとしてきた。", "en": "Both Prudential and Sony have attempted to break the stronghold of the major life insurance companies by employing sales staffers with specialized knowledge, known as life planners, who work closely with customers.\\""}, {"ja": "プルデンシャルなどの職員が顧客の信頼を逆手に取り、金銭をだまし取ることは許されない。", "en": "It is unacceptable for employees of companies like Prudential to exploit customers\' trust to defraud them of money.\\""}, {"ja": "完全歩合制に近い報酬形態も不正の温床になっていたのだろう。いったん不正に手を染めてしまえば、カネを目当てに歯止めが利かなくなるためだ。", "en": "A compensation structure that is based nearly entirely on commission likely served as a hotbed for misconduct. Once a person starts engaging in wrongdoing, the pursuit of money can become unstoppable.\\""}, {"ja": "不適切な案件が起きた期間といい、広がりといい、金融庁の監督にも不十分な点があったのではないか。金融庁は、立ち入り検査に入るなど、不正の全容解明を急がなければならない。", "en": "Given both the duration and the scope of the inappropriate practices, there may have been shortcomings in the Financial Services Agency\'s supervision. The FSA must urgently conduct on-site inspections and other measures to fully uncover the extent of the misconduct.\\""}]}, {"id": "default-14", "topic": "NPT conference opens", "title": "核不拡散体制を崩壊させるな", "source": "読売新聞 2026年4月29日", "isDefault": true, "pairs": [{"ja": "大国が核使用の脅しを強め、原子力発電所や核関連施設までも攻撃の対象にするなど、世界の安全を脅かしている。", "en": "Major powers are threatening to use nuclear weapons and even targeting nuclear power plants and nuclear-related facilities, thereby endangering global security.\\""}, {"ja": "核兵器を巡る国際的な枠組みや規範は、崩壊の瀬戸際にある。", "en": "The international framework and norms regarding nuclear weapons are on the brink of collapse.\\""}, {"ja": "各国は今こそ、危機感を持って不拡散体制の立て直しに取り組まなければならない。", "en": "Now more than ever, all nations must work to rebuild the nonproliferation structure with a sense of urgency.\\""}, {"ja": "核拡散防止条約（NPT）の履行状況を点検する再検討会議が、米ニューヨークの国連本部で始まった。", "en": "A review conference to examine the implementation of the Nuclear Nonproliferation Treaty (NPT) has begun at the U.N. headquarters in New York.\\""}, {"ja": "原則5年に1度、191の締約国・地域などが集まり、国際軍縮などを議論する場である。", "en": "Held every five years in principle, this conference brings together 191 signatory states and regions to discuss nuclear disarmament and related issues.\\""}, {"ja": "国連のグテレス事務総長は会議の冒頭、「苦労して確保した規範が崩れ始めている」と述べ、強い危機感を示した。", "en": "At the opening of the conference, U.N. Secretary General Antonio Guterres expressed a strong sense of crisis, saying, \\"Hard-won norms are eroding.\\"\\""}, {"ja": "国家間の対立もあらわになった。イランが副議長国の一つに選出されると、米国は「恥ずべきこと」と批判した。", "en": "Confrontations among nations have also come to the surface. When Iran was elected as one of the vice presidents, the United States criticized the move as \\"beyond shameful.\\"\\""}, {"ja": "イランは、米軍などがイランの核施設を攻撃したのは国際法違反だと非難した。", "en": "Iran, in turn, condemned the U.S. and Israeli military attacks on its nuclear facilities as a violation of international law.\\""}, {"ja": "5月22日までの会議中に、軍縮の道筋などを示す最終文書をまとめられるかが焦点だ。", "en": "The key focus during the conference, which runs through May 22, is whether a final document outlining a path toward nuclear disarmament can be formulated.\\""}, {"ja": "2015年と22年の過去2回の会議は、最終文書を全会一致で採択できずに決裂した。3回連続の決裂となれば、核軍縮の機運が完全に失われかねない。", "en": "The two previous conferences, held in 2015 and 2022, collapsed without achieving unanimous adoption of final documents. If the latest conference ends in a third consecutive failure, momentum for nuclear disarmament could be completely lost.\\""}, {"ja": "核をめぐる状況は急速に悪化している。ロシアはウクライナに侵略し、プーチン露大統領は核使用の恫喝（どうかつ）を繰り返している。ロシアは原発も攻撃した。", "en": "The situation surrounding nuclear weapons is rapidly deteriorating. Russia launched aggression against Ukraine, and Russian President Vladimir Putin has repeatedly threatened to use nuclear weapons. Russia has also attacked nuclear power plants.\\""}, {"ja": "一方、米国はイスラエルとともに、「イランの核開発を阻止する」との名目でイランを攻撃した。イランはNPT加盟国だが、イスラエルはNPTに加盟せず、事実上の核保有国とされる。", "en": "Meanwhile, the United States, together with Israel, attacked Iran under the pretext of stopping Iran\'s nuclear development. While Iran is a signatory to the NPT, Israel is not a party to the treaty and is considered a de facto nuclear-armed state.\\""}, {"ja": "核保有国の横暴を放置したままでは、核を持たない国が「条約を守っても安全にはならない」との不信を抱き、自国を守るためには核兵器が必要だという考えが広がりかねない。", "en": "If the overbearing attitudes of nuclear-armed states are left unchecked, non-nuclear states may come to distrust the treaty and turn to the belief that adhering to the treaty does not lead to security. This could fuel the notion that nuclear weapons are necessary to defend their own countries.\\""}, {"ja": "米露両国は、武力行使をやめるべきだ。米露間は核弾頭の配備数を制限する「新戦略兵器削減条約（新START）」が失効した。", "en": "The United States and Russia must immediately cease the use of force. The New START Treaty, which limited the number of deployed nuclear warheads between the United States and Russia, has expired.\\""}, {"ja": "中国はこの条約に参加せず、多核弾頭の保有数を急速に増やしている。英仏も核戦力強化に転じた。", "en": "China did not join this treaty and is rapidly increasing its stockpile of nuclear warheads. Britain and France have also shifted toward strengthening their nuclear arsenals.\\""}, {"ja": "NPTは米露中英仏の5か国に核兵器を持つ特権を認めるとともに、核軍縮交渉を義務づけている。5か国は誠実に軍縮に取り組まなければならない。", "en": "The NPT recognizes that five countries — the United States, Russia, China, Britain and France — have the privilege of possessing nuclear weapons, while obligating them to engage in nuclear disarmament negotiations. These five countries must sincerely commit to disarmament.\\""}, {"ja": "日本は、北朝鮮がNPTから脱退を宣言し、核・ミサイルを増強して地域の安定を損ねている危険な現状を広く訴えるべきだ。", "en": "Japan should widely raise the alarm over the current dangerous situation in which North Korea has declared its withdrawal from the NPT and is undermining regional stability by expanding its nuclear and missile capabilities.\\""}]}, {"id": "default-15", "topic": "Digital textbooks", "title": "現場に利用を押しつけぬよう", "source": "読売新聞 2026年4月11日", "isDefault": true, "pairs": [{"ja": "子供たちが使う教科書に最も重要なのは、十分な学習効果が得られるかどうかである。デジタル化を進めたいからといって、教育の本質を見失うことになっては困る。", "en": "The most important aspect of textbooks for children is whether they can achieve sufficient learning outcomes. Efforts must be made not to lose the essence of education simply because of the desire to promote digitization.\\""}, {"ja": "政府は、デジタル教科書を正式な教科書と位置づけ、検定や無償配布の対象とする学校教育法改正案などを閣議決定した。法案が成立すれば、2030年度の小学校教科書から順次導入される。", "en": "The government approved at a Cabinet meeting a bill to revise the School Education Law and related laws that would designate digital textbooks as official textbooks to which state screening and free distribution apply. If the bill is enacted into law, digital textbooks will be introduced in stages, starting with elementary school materials in the 2030 academic year.\\""}, {"ja": "教育委員会などは「紙のみ」「紙とデジタルを組み合わせたハイブリッド」「完全デジタル」の3形態の中から選ぶことになる。", "en": "Boards of education and others will be required to choose from three formats: paper textbooks only, a hybrid of paper and digital materials, or fully digital.\\""}, {"ja": "学びの大きな転換である。義務教育はこれまで、国が全国一律に一定水準の教育を受けられる環境を守ってきた。紙かデジ
